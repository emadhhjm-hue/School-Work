<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>11Adv-12Gen 2026-2027 · School Work</title>
<style>
  :root{
    --ink:#1a2238; --muted:#697089; --line:#e5e8f0; --bg:#f6f7fb;
    --red:#c0392b; --blue:#2B5FA6; --purple:#7A2FD0; --teal:#0FA98B;
    --good:#1a9d6b; --bad:#d65656; --amber:#F2A93B;
    --shadow:0 10px 30px rgba(30,40,90,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 80px}
  a{color:inherit}
  h1{font-family:Georgia,"Times New Roman",serif}
  .btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:.9rem;background:#eef1f6;color:#33405a;transition:.15s;font-family:inherit}
  .btn:hover{filter:brightness(.97)}
  .btn.pri{background:var(--ink);color:#fff}
  .btn.sm{padding:7px 12px;font-size:.85rem}
  .back{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:4px 0;font-size:.95rem}
  .back:hover{color:var(--ink)}

  /* hub */
  .hero{background:linear-gradient(120deg,#1a2238,#2B5FA6 55%,#7A2FD0);color:#fff;border-radius:18px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:22px}
  .hero .back{color:#dfe7ff;opacity:.9;margin-bottom:6px}
  .hero .back:hover{opacity:1;text-decoration:underline}
  .classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .classcard{display:block;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--blue);border-radius:16px;padding:20px;cursor:pointer;transition:.15s}
  .classcard:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-2px)}
  .classcard .cc-name{font-size:1.25rem;font-weight:800;color:var(--ink)}
  .classcard .cc-chapter{font-weight:700;color:var(--blue);margin-top:2px}
  .classcard .cc-blurb{color:var(--muted);margin-top:8px;font-size:.9rem;line-height:1.5}
  .classcard .cc-meta{margin-top:12px;display:inline-block;background:#eef3fb;color:var(--ink);font-weight:800;font-size:.75rem;padding:5px 12px;border-radius:999px}
  .classcard.soon{border-left-color:var(--muted);opacity:.85}
  .classcard.soon .cc-meta{background:#f0eff2;color:var(--muted)}
  .hero .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:800}
  .hero h1{font-size:2rem;margin:6px 0 4px}
  .hero p{margin:0;opacity:.95;max-width:760px}
  .week{margin-bottom:26px}
  .week-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .wk-badge{background:var(--ink);color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:.8rem}
  .wk-skill{font-weight:800}
  .wk-skill.ls{color:var(--purple)} .wk-skill.rw{color:var(--teal)}
  .wk-dates{color:var(--muted);font-size:.85rem}
  .lesson-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;margin-bottom:12px;transition:.15s}
  .lesson-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-1px)}
  .lesson-card .lk{font-size:.7rem;font-weight:800;letter-spacing:.05em;color:var(--red);text-transform:uppercase}
  .lesson-card .lt{font-size:1.2rem;font-weight:800;margin:3px 0 2px}
  .lesson-card .lb{color:var(--muted);font-size:.85rem}
  .lesson-card .lm{color:var(--muted);font-size:.78rem;margin-top:6px}
  .soon{opacity:.6;cursor:default}
  .soon:hover{transform:none;border-color:var(--line);box-shadow:none}

  /* lesson player */
  .lp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .lp-title h1{font-size:1.7rem;margin:2px 0 2px}
  .lp-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.05em;color:var(--red)}
  .lp-book{color:var(--muted);font-size:.85rem}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
  .chip{background:#eef1f6;color:#40506e;border-radius:999px;padding:3px 11px;font-size:.72rem;font-weight:700}
  .lp-page{background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;padding:8px 13px;margin:10px 0;font-size:.86rem;color:#7a5a12;display:inline-block}
  #timer{background:var(--ink);color:#fff;border-radius:14px;padding:12px 22px;min-width:140px;text-align:center;cursor:pointer;box-shadow:var(--shadow);user-select:none;flex:0 0 auto}
  #timer .tl{font-size:.6rem;letter-spacing:.14em;opacity:.82;font-weight:700}
  #timer .tv{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

  .lp-grid{display:grid;grid-template-columns:1fr 240px;gap:22px;margin-top:14px;align-items:start}
  .lp-body{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 26px;min-height:300px}
  .lp-menu{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
  .lp-menu button{border:0;text-align:right;background:#5a6b8c;color:#fff;padding:11px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.82rem;transition:.12s;font-family:inherit;line-height:1.2}
  .lp-menu button small{display:block;font-weight:600;opacity:.85;font-size:.68rem}
  .lp-menu button:hover{filter:brightness(1.08)}
  .lp-menu button.on{background:var(--red);box-shadow:var(--shadow)}
  .stage-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
  .stage-head h2{font-size:1.3rem;margin:0}
  .stage-min{color:var(--muted);font-size:.8rem}
  .nav-row{display:flex;justify-content:space-between;margin-top:22px}

  /* blocks */
  .lp-body p{line-height:1.65}
  .note{background:#eef4ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 14px;margin:10px 0;font-size:.94rem}
  ol,ul{line-height:1.75}
  .objbox{background:#f4f7fb;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .objbox b{color:var(--blue)}
  .vrow{display:flex;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
  .vrow>b.vw{flex:0 0 128px;color:#12324f;cursor:pointer}
  .vrow>b.vw:hover{text-decoration:underline}
  .vrow .vd{flex:1}
  .vrow .vacts{flex:none;display:flex;gap:6px;align-items:center}
  @media (max-width:640px){ .vrow{flex-wrap:wrap} .vrow>b.vw{flex-basis:100%} .vrow .vd{flex-basis:100%} }
  .vrow:last-child{border-bottom:0}
  .vrow b{min-width:170px;color:var(--ink)}
  .wordday{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border-radius:12px;padding:14px 16px;margin-top:12px}
  .wordday .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  .wordday .w{font-size:1.3rem;font-weight:800}
  textarea,select,input[type=text]{font-family:inherit}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px}
  label.q{display:block;font-weight:700;margin:10px 0 4px}
  .passage p{margin:8px 0}
  .pl{color:var(--red);font-weight:800;margin-right:.4em}
  .graded select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;min-width:180px}
  .grow{display:flex;gap:10px;align-items:center;margin:7px 0;flex-wrap:wrap}
  .grow span.l{flex:1;min-width:220px}
  .gap{border:0;border-bottom:2px solid var(--blue);text-align:center;font-size:1em;background:#f4f7ff}
  .fb{display:none;margin-top:10px;font-size:.92rem}
  .rate{font-size:1.7rem;color:var(--amber);user-select:none;display:inline-flex;gap:6px}
  .rate span{cursor:pointer;padding:2px 4px;line-height:1;transition:transform .08s}
  .rate span:hover{transform:scale(1.15)}
  details summary{cursor:pointer;font-weight:700;color:var(--blue)}

  /* speaking role-play cards */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .rolecard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcff}
  .rolecard h4{margin:0 0 4px;color:var(--purple)}
  @media (max-width:600px){ .roles{grid-template-columns:1fr} }

  /* Activity 2 · writing model + phased timer */
  .a2write .wtimer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
  .wt-clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem;min-width:96px;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px}
  .wt-clock.run{background:var(--teal)} .wt-clock.done{background:var(--red)}
  .wt-phase{font-weight:700;color:var(--muted);font-size:.85rem}
  .hlk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .hlk span{padding:2px 9px;border-radius:6px;font-weight:700;font-size:.76rem}
  .hl-topic{background:#dff5e8;color:#0b6b43}
  .fillw{color:#0b8a43;font-weight:700}
  .hl-r1{background:#e4eeff;color:#1c4e9c}
  .hl-r2{background:#efe4ff;color:#5a2ea6}
  .hl-close{background:#fff1cf;color:#8a5a12}
  .model-ans{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfcff;line-height:1.95}
  .model-ans span{padding:2px 4px;border-radius:4px}
  .wbank{margin:8px 0 10px;padding:10px 12px;border:1px dashed var(--blue);border-radius:10px;background:#f4f7ff;line-height:2}
  .wchip{display:inline-block;margin:3px 6px 3px 0;padding:3px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:.9rem}
  .cloze-art p{line-height:2.3;margin:10px 0}
  .cloze-art .gap{min-width:90px}
  .tmi-row{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fcfcff}
  .tmi-h{font-weight:800;color:var(--purple);margin-bottom:2px}
  .tmi-in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px}
  /* sub-tabs inside an activity */
  .subtab-row{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:2px 0 14px}
  .subtab{border:0;background:transparent;padding:8px 14px;font-weight:800;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;font-size:.92rem}
  .subtab.on{color:var(--blue);border-bottom-color:var(--blue)}
  .subtab:hover{color:var(--ink)}
  /* reading toolbar + clickable words */
  .rtoolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fafbff}
  .rt-zoom{display:inline-flex;gap:4px}
  .rt-hint{font-size:.78rem;color:var(--muted)}
  .wordable{cursor:default}
  .wordable p{cursor:text}
  /* dictionary + type popup */
  .dict-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .dict-ov.open{display:flex}
  .dict{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .dict-hd{display:flex;align-items:center;justify-content:space-between}
  .dict-hd h3{margin:0;color:var(--blue);font-size:1.4rem}
  .lp-plan-btn{margin-top:10px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
  .lp-plan-btn:hover{background:#eef4ff}
  .lpm-ov{position:fixed;inset:0;background:rgba(15,20,40,.55);display:none;z-index:60;padding:24px;overflow:auto}
  .lpm-ov.open{display:block}
  .lpm{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .lpm-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0}
  .lpm-bar h3{margin:0;font-size:1.05rem}
  .lpm-bar .lpm-actions{display:flex;gap:8px}
  .fill{color:#0b8a43;font-weight:800}
  .fill.kw,.fill b{color:#0b8a43}
  .qr-open-btn{margin-top:12px;border:1.5px solid #fff;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
  .qr-open-btn:hover{background:rgba(255,255,255,.28)}
  .qr-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:6px}
  .qr-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(20,30,70,.10);text-align:center}
  .qr-card svg{width:280px;height:280px;display:block;margin:6px auto}
  .qr-brand{font-weight:800;color:var(--ink);font-size:.85rem;margin-bottom:2px}
  .qr-cap{color:var(--muted);font-size:.85rem;margin-top:4px}
  .qr-empty,.qr-side .qr-empty{color:var(--muted);padding:60px 20px}
  .qr-side{flex:1;min-width:280px}
  .qr-label{display:block;font-weight:800;font-size:.8rem;color:var(--ink);margin-bottom:4px}
  .qr-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.95rem}
  .qr-hint{font-size:.82rem;color:var(--muted);margin:6px 0 10px}
  .qr-actions{display:flex;flex-wrap:wrap;gap:8px}
  .qr-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:.85rem}
  .qr-btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
  .qr-btn:hover{filter:brightness(.97)}
  .qr-note{min-height:18px;color:#0b6b43;font-weight:700;font-size:.85rem;margin:8px 0 0}
  .qr-tip{margin-top:12px;background:#fff8ea;border:1px solid #f0e2bf;border-radius:10px;padding:10px 12px;font-size:.85rem;color:#7a5a1a}
  .wk-plan{margin-left:auto;border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:5px 12px;font-weight:800;cursor:pointer;font-size:.82rem}
  .wk-plan:hover{background:#eef4ff}
  .lpm-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#f4f6fc;border-bottom:1px solid #e6e9f2}
  .lpm-tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
  .lpm-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  @media print{ .lpm-tabs{display:none} }
  .lpm-bar button{border:0;border-radius:8px;padding:7px 12px;font-weight:800;cursor:pointer}
  .lpm-print{background:#39d98a;color:#053}
  .lpm-close{background:#eef1f6;color:#333}
  .lpm-doc{padding:22px 26px;color:#111;font-size:.9rem;line-height:1.5}
  .lpm-doc h2{font-size:1.2rem;margin:0 0 2px;color:var(--ink)}
  .lpm-doc h4{margin:16px 0 6px;color:var(--blue);border-bottom:2px solid #e6e9f2;padding-bottom:3px;font-size:.98rem}
  .lpm-doc table{width:100%;border-collapse:collapse;margin:6px 0}
  .lpm-doc th,.lpm-doc td{border:1px solid #c9cfdd;padding:6px 8px;vertical-align:top;text-align:left}
  .lpm-doc th{background:#eef2fb}
  .lpm-doc .chk{color:#0b6b43;font-weight:800}
  .lpm-doc .muted{color:#667;font-size:.85rem}
  .lpm-doc ul{margin:4px 0;padding-left:18px}
  @media print{ body *{visibility:hidden} #lpmOv,#lpmOv *{visibility:visible} #lpmOv{position:absolute;inset:0;background:#fff;padding:0;overflow:visible} .lpm{box-shadow:none;max-width:100%} .lpm-bar{display:none} }
  .dict-x{border:0;background:#eef1f6;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem}
  .dict-hear{margin:8px 0;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
  .dict-pos{display:inline-block;background:#eef4ff;color:#1c4e9c;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.8rem;margin-left:8px}
  .dict-def{margin:10px 0 4px;font-size:1.02rem}
  .dict-ex{margin:4px 0;color:var(--muted);font-style:italic}
  .dict-more{display:inline-block;margin-top:8px;color:var(--blue);font-weight:700;text-decoration:none}
  .type-target{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfcff;line-height:1.9;max-height:150px;overflow:auto;font-size:.95rem}
  .type-in{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:inherit}
  .type-stat{margin-top:6px;font-weight:700;color:var(--muted)}
  .tc-ok{color:#0b6b43;background:#dff5e8}
  .tc-bad{color:#b00020;background:#ffe1e4}
  .rw{border-radius:3px;transition:background .05s}
  .rw-on{background:#ffe680;box-shadow:0 0 0 2px #ffe680;color:#4a3500}
  .type-caret{border-left:2px solid var(--blue);animation:tcaret 1s steps(1) infinite}
  @keyframes tcaret{50%{border-color:transparent}}
  .dict.type-wide{max-width:900px}
  .type-wide .type-target{max-height:46vh;font-size:1.15rem;line-height:2}
  .type-wide .type-in{font-size:1.05rem;min-height:96px}
  /* reading toolbar (reference style) */
  .rtoolbar{border:1px solid var(--line);border-radius:14px;background:#f6f8fc;padding:8px 10px;margin:6px 0 14px}
  .rt-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rt-line+.rt-line{margin-top:8px}
  .rt-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:800;font-size:.86rem;cursor:pointer;font-family:inherit;color:#33405a;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .rt-btn:hover{border-color:var(--blue)}
  .rt-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rt-stop{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rt-toggle.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rt-hl.on{background:#fff1cf;border-color:var(--amber);color:#8a5a12}
  .rt-bee{background:var(--amber);color:#5a3d00;border-color:var(--amber)}
  .rt-grp{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-left:1px solid var(--line)}
  .rt-lab{font-weight:800;font-size:.82rem;color:var(--muted)}
  .rt-step{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800;font-size:1rem;line-height:1}
  .rt-range{accent-color:var(--teal);width:90px}
  .rt-val{font-weight:800;font-size:.82rem;color:#33405a;min-width:38px;text-align:center}
  .rt-size{padding:6px 10px}
  /* highlighter mode */
  .cloze-art.hl-on p{cursor:text}
  .cloze-art.hl-on ::selection{background:#fff3a0}
  .cloze-art .usermark{background:#fff3a0;border-radius:3px;padding:0 2px}
  /* spelling list popup */
  .sl-list{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
  .sl-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fcfcff}
  .sl-row b{min-width:92px}
  .sl-row span{font-size:.85rem;color:var(--muted);flex:1}
  .sl-del{margin-left:auto;border:0;background:#fbeaec;color:#b00020;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800}
  .dict-bank{display:block;width:100%;margin:8px 0 4px;height:38px}
  .dict-bank.on{background:#dff5e8;color:#0b6b43;border-color:#bfe6cf}
  .sl-hear{border:0;background:#eef1f6;border-radius:8px;width:30px;height:30px;cursor:pointer}
  @media (max-width:640px){ .rt-range{width:64px} .rt-grp{border-left:0} }
  /* bold key vocabulary in the reading */
  .cloze-art .kw{font-weight:800;color:#12324f;background:#eef4ff;border-radius:4px;padding:0 3px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .cloze-art .kw:hover{background:#dbe7ff}
  /* glossary / vocabulary study */
  .glossary{margin:16px 0 4px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fafbff}
  .glossary h3{margin:0 0 2px;color:var(--blue);font-size:1.05rem}
  .gl-hint{margin:0 0 10px;font-size:.8rem;color:var(--muted)}

  a1:[{t:"p",html:"<b>Before you listen.</b>"},{t:"prompts",intro:"Topic — discuss:",items:["Is it easy or hard for you to manage money? Why?","Do you keep a budget each month?","What do you usually do when you need more money?"]},{t:"match",intro:"Vocabulary in context — choose the meaning that fits each sentence:",pairs:[["Everything <b>costs an arm and a leg</b> these days.","to be very expensive"],["It’s hard to <b>make ends meet</b> without a job.","to have just enough money to live on"],["Tim lost his job and now he is <b>broke</b>.","having no money at all"],["We’re on a <b>tight budget</b> this month.","a plan that lets you spend only a little"],["Sara has an <b>income</b> of 3,500 dirhams a month.","the money you receive for work or other sources"],["Try not to spend more than you <b>earn</b>.","to receive money for work"],["He had to <b>drop out of</b> the race with an injury.","to leave without finishing"]]},{t:"mcq",intro:"Thinking & predicting — you will hear a student ask a parent for money. Predict before you listen:",qs:[{q:"The student probably needs money for…",opts:["a school trip","a new phone","a birthday gift"],ans:1},{q:"Is this the first time they have asked?",opts:["Yes, the first time","No, they have asked before"],ans:1},{q:"The parent will most likely…",opts:["give the money with no questions","suggest a budget or a plan","refuse and hang up"],ans:1},{q:"At the end, the student probably feels…",opts:["satisfied","a little frustrated","completely calm"],ans:1}]}],
  a2:[{t:"p",html:"<b>While you listen.</b> Read (or listen to your teacher read) the conversation between <b>Adam</b> and his <b>mother</b>."},{t:"dialogue",intro:"Listening for stressed words — fill each gap with the word you hear:",lines:[["Mum","Hello?"],["Adam","Hi, Mum. Can I ask you a quick [[favour]]?"],["Mum","Of course. What is [[it]]?"],["Adam","Well… I’m a bit [[broke]] again. Could you send me two [[hundred]] dirhams, just till the end of the month?"],["Mum","Broke again? Adam, when you moved out you said you could [[make]] ends meet. This is the [[third]] time you’ve asked this month."],["Adam","I know, I’m [[sorry]]. My old phone broke and I had to buy a new [[one]]."],["Mum","A new phone costs an arm and a [[leg]]! You need a [[budget]]. Write down your income and don’t spend more than you [[earn]]."],["Adam","But that’s the problem — my expenses are bigger than my [[income]]."],["Mum","Then maybe you should work a few more [[hours]] at the shop."],["Adam","Mum! I already work fifteen hours a [[week]]!"],["Mum","All right, calm down. I’ll help you this [[time]], but let’s make a plan together."]]},{t:"mcq",intro:"Main ideas, details, numbers & advice — choose the best answer:",qs:[{q:"What is Adam’s main problem?",opts:["his job","managing his money","his studies"],ans:1},{q:"How much money does Adam ask for?",opts:["two hundred dirhams","two thousand dirhams","twenty dirhams"],ans:0},{q:"How many hours a week does Adam work?",opts:["five","fifteen","fifty"],ans:1},{q:"What does his mother advise him to do?",opts:["quit his job","make a budget","drop out"],ans:1},{q:"How does Adam most likely feel at the end?",opts:["satisfied","a little frustrated","completely calm"],ans:1}]}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> In the UAE, families and schools often talk about saving early and spending wisely. The currency is the <b>dirham (AED)</b>, and many people set aside part of their income each month. Living within a budget — not spending more than you earn — is valued everywhere, from Abu Dhabi to Tokyo."},{t:"prompts",intro:"Connect it to you:",items:["In your family or culture, what is one piece of money advice young people are given?","Name one thing that “costs an arm and a leg” where you live — and a cheaper alternative."]}],
  enrich:[{t:"p",html:"<b>Expressions of advice.</b> Notice how people ask for and give advice."},{t:"note",html:"<b>Asking:</b> “What do you think I should do?” · “Could you help me with…?”<br><b>Giving:</b> “Maybe you should…” · “Why don’t you…?” · “You’d better…” · “If I were you, I’d…”"},{t:"mcq",intro:"Asking or giving advice? Choose for each:",qs:[{q:"“Why don’t you make a budget?”",opts:["asking for advice","giving advice"],ans:1},{q:"“What should I do about my expenses?”",opts:["asking for advice","giving advice"],ans:0},{q:"“If I were you, I’d work a few more hours.”",opts:["asking for advice","giving advice"],ans:1}]},{t:"note",html:"<b>Weak forms.</b> In speech, small words are reduced: <i>can</i> → “kin”, <i>to</i> → “tuh”, <i>and</i> → “n”. Say aloud: “I can save” vs “I can’t save.” Which one sounds stronger?"}],

  a1:[{t:"p",html:"<b>The language of advice.</b> Study the patterns, then do the controlled practice."},{t:"note",html:"<b>Asking:</b> “What would you do?” · “Do you think I should…?” · “Any advice?”<br><b>Giving (soft → strong):</b> “You could…” · “Why don’t you…?” · “I’d suggest…” · “If I were you, I’d…” · “You really should…”"},{t:"note",html:"<b>Grammar — verb forms after advice verbs (G.19.2):</b><br>• advise / encourage <b>someone to do</b> → “I advise you <b>to save</b>.”<br>• suggest / recommend <b>doing</b> → “I suggest <b>saving</b> first.”<br>• should / could <b>+ base verb</b> → “You should <b>apply</b> for a scholarship.”"},{t:"mcq",intro:"Choose the correct verb form:",qs:[{q:"My teacher advised me ____ for a scholarship.",opts:["to apply","applying","apply"],ans:0},{q:"I’d suggest ____ some money aside each month.",opts:["to put","putting","put"],ans:1},{q:"If I were you, I ____ take a student loan.",opts:["wouldn’t","don’t","not"],ans:0},{q:"You really should ____ your options first.",opts:["comparing","to compare","compare"],ans:2}]},{t:"match",intro:"Match each problem to a good piece of advice:",pairs:[["“I can’t afford the tuition fees.”","“Why don’t you apply for a scholarship?”"],["“I keep spending all my wages.”","“I’d suggest putting some aside each week.”"],["“I’m exhausted from work and study.”","“If I were you, I’d take some time off.”"],["“I’m not sure which course to choose.”","“You could talk to a careers advisor.”"]]}],
  a2:[{t:"p",html:"<b>Speak — role-play.</b> Work in pairs. Student A has a problem; Student B asks questions and gives advice. Then <b>swap roles</b>. Use at least three advice expressions and one verb pattern from Activity 1."},{t:"roles",cards:[["Card A · The dilemma","You have been offered a place at university, but the tuition fees are high. You could take a student loan, apply for a scholarship, or work for a year first. Ask your partner for advice and explain your worries."],["Card B · The adviser","Listen carefully. Ask two questions to understand the problem, then give at least two clear pieces of advice. Use “If I were you…”, “I’d suggest…”, and one verb pattern (advise + to / suggest + -ing)."]]},{t:"note",html:"<b>Speaking checklist —</b> tick as you go: ☐ I asked questions ☐ I gave 3+ pieces of advice ☐ I used a verb pattern correctly ☐ I used stress and intonation ☐ I kept the conversation going."},{t:"rating",label:"Rate your partner’s advice: clear, polite and easy to follow?"}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> Many Emirati and international students weigh scholarships, government support and family advice when choosing a path. Across cultures, asking elders and mentors for advice is a sign of respect, not weakness."},{t:"prompts",items:["Who would you ask for advice about your future — and why them?","What is one wise piece of advice you have received about money or study?"]}],
  enrich:[{t:"p",html:"<b>Softening advice.</b> Direct advice can sound bossy. Notice how tone changes the message."},{t:"mcq",intro:"Which reply sounds the most polite / softest?",qs:[{q:"A friend is overspending. You say…",opts:["“Stop wasting money!”","“Maybe you could try a budget?”","“You’re bad with money.”"],ans:1},{q:"Choose the softest advice:",opts:["“You must save more.”","“You’d better save more.”","“You might want to save a little more.”"],ans:2}]},{t:"reflect",items:["Write one problem and two different ways to advise on it (one soft, one stronger).","Write one sentence using suggest + -ing and one using advise + to."]}],

   {label:"Class reading",blocks:[{t:"p",html:"<b>Read the article</b> (paragraphs are lettered A–E). Use the reading strategies as you go, then answer the questions."},{t:"passage",title:"Why We Buy: Consumerism and the Human Brain",paras:["Every day we are surrounded by things to buy. Shops, screens and streets are filled with products, and consumers are encouraged to want more of them. This way of living — always buying and using — is called consumerism.","Companies know how the human brain works, and marketing is designed around it. Bright colours, happy faces and the word “new” all catch our attention. When we see something we like, a chemical called dopamine is released, and we feel a small burst of pleasure — even before we buy.","Scarcity is another trick. When a sign says “only two left”, we are pushed to decide quickly. The fear of missing out is stronger than the wish to save, so items are bought that were never really needed.","Brands matter too. Two products can be almost identical, yet one is chosen because its brand feels trustworthy or “cool”. We are not only buying an object; we are buying an image of ourselves.","None of this makes shoppers foolish. But when we understand how marketing works, better choices are made. The smartest consumer is not the one who never buys — it is the one who knows <i>why</i> they are buying."]},{t:"mcq",intro:"Read for the main points — questions name the paragraph:",qs:[{q:"[A] What does “consumerism” mean?",opts:["a way of living based on always buying and using","saving as much money as possible","a type of shop"],ans:0},{q:"[B] Why is dopamine mentioned?",opts:["it makes products cheaper","it gives us pleasure and pulls us toward buying","it is a kind of advert"],ans:1},{q:"[C] How does “scarcity” affect shoppers?",opts:["it makes them wait","it pushes them to decide quickly","it lowers the price"],ans:1},{q:"[E] What is the writer’s main point in paragraph E?",opts:["you should never buy anything","understanding marketing helps you choose better","brands are always dishonest"],ans:1}]},{t:"match",intro:"Vocabulary in context — choose the meaning:",pairs:[["A smart <b>consumer</b> asks questions before buying.","a person who buys and uses goods"],["The two phones were nearly <b>identical</b>.","exactly the same"],["Their <b>marketing</b> targets young people.","the ways a company promotes and sells"],["A trusted <b>brand</b> can charge more.","a product name customers recognise"]]}]},

   {t:"cloze",intro:"Activity 4 — Paragraph A is shown complete, with the answers in green, so the whole article (A–F) can be read aloud. Cover the green words to test yourself.",paras:["We are all <span class='fillw'>consumers</span>. We all buy and use products and services; that is, we <span class='fillw'>consume</span>. The word comes from the Latin <i>consumere</i>, which means “to use up, to waste or destroy”. Most of us don’t think of ourselves as wasteful or destructive, but the world <span class='fillw'>economy</span> is based on consumerism. Today, people worldwide have greater <span class='fillw'>access</span> than ever before to a huge variety of products and, often, to dozens of brands of the same product. What makes us decide to buy Brand A instead of Brand B when the two <span class='fillw'>items</span> are really <span class='fillw'>identical</span>? Why do we buy things that we don’t actually need? The answer lies in marketing – the advertising and selling of products. Successful marketers use their knowledge of psychology and, increasingly, of recent studies of the human brain to persuade us to <span class='fillw'>consume</span> more and more.","A good understanding of human weakness is essential if a company wants to sell a product. One way that advertisers persuade us to buy a product is by targeting our dissatisfaction with ourselves, our fears. Consider for a moment a typical fear – fear of being offensive to other people. Advertisers persuade us, for example, that if we don’t buy their mouthwash, we’ll have bad breath and offend other people. Dentists tell us that mouthwash is actually unnecessary; they explain that we need only simple dental hygiene – regular, correct use of a soft toothbrush and of dental floss. But we continue to spend money on mouthwash, breath freshener, and breath mints. Our fear of offending people outweighs our dentists’ logic.","In a similar way, advertisers also take advantage of our need for a good self-image, our desire to appear attractive, successful, and even exciting. One example is the recent popularity of SUVs in the United States – sport utility vehicles. These vehicles are more expensive than most cars. They use more gas and create more pollution than most cars. They take up more space than most cars. But TV commercials show them climbing rocky mountain roads and crossing rivers, which seems exciting to many people. Most people who buy an SUV never get out of the city. They spend their morning commute in traffic, not driving up and down mountains. Although it may seem irrational, advertisers persuade them that SUV owners are people with an exciting life.","With so many different (but almost identical) brands of the same product, what causes us to choose one brand instead of another? According to Dr. Alan Hirsch, our sense of smell actually influences our opinion of a product and our decision to buy it. A scientist at the Smell and Taste Treatment and Research Foundation in Chicago, Hirsch ran a careful, well-organized study. There were two identical rooms with an identical pair of sneakers in each room. There was only one difference: he sprayed one of the rooms with a scent of flowers. Volunteers entered each room and answered questions about the sneakers. The result was that 84 percent of the people preferred the sneakers in the room with the floral smell even though they were exactly the same as the ones in the other room!","There is also the effect of self-fulfilling prophecies. A self-fulfilling prophecy is a situation in which people cause a prediction to come true. (For example, a teacher tells a class that they are especially intelligent, and that semester the class does especially well on exams.) In marketing, a successful advertisement persuades consumers that a product works well; their belief causes them to use the product in such a way that it does work well. For example, the ads for Brand X of a diet pill say, “Take this pill, and you will lose weight because you won’t be hungry.” So people buy Brand X. Because they believe it will cause weight loss, they begin to eat less. They establish a new habit of eating less. The result? They lose weight. Is this because of the pill or because they are eating less?","Most of us like to think that we are reasonable, independent thinkers. We like to believe that we have a good reason for our choices. We don’t want to buy products because of some strange compulsion – some irrational desire that we can’t control. The truth is, however, that with their increasing knowledge of what goes on in the human brain, marketers might have more power over us than we realize."]},

     {p:"Paragraph C",topic:"Self-image (SUVs)",idea:"Advertisers appeal to our desire to seem attractive and exciting."},
     {p:"Paragraph D",topic:"Sense of smell (Hirsch’s study)",idea:"Smell influences our opinion of a product and our decision to buy."},
     {p:"Paragraph E",topic:"Self-fulfilling prophecy (diet pill)",idea:"Believing a product works can make it actually work."},
     {p:"Paragraph F",topic:"Conclusion",idea:"Marketers may have more power over us than we realize."}
   ]}

  a2:[{t:"p",html:"<b>Viewing & analysis.</b> Now “read” an advertisement the way you read the article — look for the technique behind it."},{t:"video",id:"0Dz3Psj3pV4",query:"how advertising manipulates the brain short",caption:"Watch this clip about advertising and the brain, then identify the techniques below."},{t:"mcq",intro:"Which persuasion technique is used?",qs:[{q:"“Only 3 left in stock — order now!”",opts:["scarcity / fear of missing out","celebrity image","low price"],ans:0},{q:"A famous athlete wears the shoes in the advert.",opts:["scarcity","brand image / role model","information only"],ans:1},{q:"“Join 2 million happy customers!”",opts:["everyone-is-doing-it (social proof)","scarcity","a discount"],ans:0}]},{t:"reflect",items:["Describe one advert you know and the technique it uses.","Rewrite this sentence in the present simple passive: “Companies design adverts for the brain.” → “Adverts ____.”"]}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> The UAE is a global shopping hub, from giant malls to shopping festivals. Being a <i>critical</i> consumer — comparing, questioning and buying with purpose — is a life skill valued in the National Education Charter’s focus on critical thinking."},{t:"prompts",items:["Name one way you could shop more thoughtfully this month.","Do sales and festivals help shoppers, sellers, or both? Explain."]}],
  enrich:[{t:"p",html:"<b>Grammar — present simple passive (G.10.1).</b> We use it when the action matters more than who does it: <i>subject + is/are + past participle</i>."},{t:"mcq",intro:"Choose the correct passive form:",qs:[{q:"Millions of adverts ____ online every day.",opts:["are shown","show","is shown"],ans:0},{q:"This brand ____ by teenagers worldwide.",opts:["is trusted","trusts","are trusted"],ans:0},{q:"Products ____ to look better than they are.",opts:["are designed","design","designs"],ans:0}]}],
  exit:[{t:"reflect",items:["Write one new word you learned and its meaning.","In one sentence, explain how marketing affects the brain.","(KWL “L”) One thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel identifying the main points and techniques in a text?"}]

  vocab:[{t:"p",html:"<b>Key vocabulary</b> (same set as Lessons 5–6). Warm up your spelling before you write."},{t:"vocab",items:[
    ["consumer","a person who buys and uses goods or services","noun","Every …… is a target for adverts."],
    ["consume","to buy and use goods or services","verb","We …… far more than we need."],
    ["marketing","the ways a company promotes and sells its products","noun","…… is built around how we think."],
    ["brand","a product name that customers recognise and trust","noun","A strong …… earns loyalty."],
    ["economy","the system of money, jobs and trade in a place","noun","Consumer spending fuels the …… ."],
    ["identical","exactly the same","adjective","Two …… items, two different prices."],
    ["items","separate things or products","noun","Impulse buys are small …… near the till."],
    ["access","the chance or right to use or get something","noun","One-click …… makes buying easy."]
  ]},{t:"wordday",word:"synthesise",def:"to combine ideas from several sources into one clear whole",ex:"A good summary synthesises many facts into a few sentences."}],
  a1:[{t:"p",html:"<b>Deconstruct a model & plan.</b> A strong summary paragraph has: (1) a <b>topic sentence</b> (the main idea), (2) two or three <b>techniques + examples</b> as evidence, connected with <b>linkers</b>, and (3) a <b>closing sentence</b>."},{t:"note",html:"<b>Cohesive devices (G.10.1 support):</b> <i>First… , In addition… , For example… , As a result… , However… , Overall…</i>"},{t:"mcq",intro:"Plan your paragraph — choose the best option:",qs:[{q:"Which is the best topic sentence for a summary of marketing techniques?",opts:["I like shopping a lot.","Marketing uses several techniques to influence how consumers buy.","Adverts are everywhere."],ans:1},{q:"Which sentence gives evidence (a technique + example)?",opts:["Marketing is clever.","Scarcity is used; for example, “only 2 left” pushes quick decisions.","Shopping is fun."],ans:1},{q:"Which linker best introduces a second point?",opts:["Because","In addition","Finally, first"],ans:1}]},{t:"reflect",items:["Plan — Topic sentence (the main idea of your summary):","Technique + example 1:","Technique + example 2:","One linking word you will use between your points:"]}],
  a2:[{t:"p",html:"<b>Writing prompt:</b> How do businesses influence consumers’ purchasing behavior?"},{t:"writemodel",task:"How do businesses influence consumers’ purchasing behavior? Write a short paragraph (5–7 sentences) answering this question. Use your plan and two techniques with examples — you can draw on the diagram from Lessons 5–6 (emotions, social proof, scarcity & urgency, brand consistency) — with cohesive devices and at least one present simple passive.",plan:["Topic sentence (answer the question):","Technique + example 1:","Technique + example 2:"],model:{
    topic:"Businesses influence consumers’ purchasing behavior in several carefully designed ways.",
    r1:"First, our emotions are targeted, because people buy on feeling and then justify the choice with logic; for example, a warm, happy advert makes a product feel like the right decision.",
    r2:"In addition, scarcity is used to create urgency, so a message such as “only two left” pushes shoppers to decide quickly, and a trusted brand is often chosen even when two items are almost identical.",
    close:"Overall, once consumers understand how these techniques work, wiser choices are made and money is spent with real purpose."
  }},
   {t:"note",html:"<b>Extension — from summary to opinion.</b> Now argue your own view about consumer choice using the OREO plan."},
   {t:"oreo",task:"Do consumers have real freedom of choice, or does marketing decide for them? Read Paragraph E again (self-fulfilling prophecy) and the whole article, then write one opinion paragraph using O-R-E-O.",model:{o1:"In my opinion, consumers are influenced far more than they realise, so real freedom of choice is limited.",r1:"First, advertisers deliberately target our emotions and fears, so decisions are often made for psychological reasons rather than real needs.",r2:"Second, even our senses are used against us, which means we are guided without noticing it.",ex:"For example, in Hirsch’s study, 84% of people preferred identical sneakers simply because the room smelled of flowers, and a self-fulfilling prophecy can make a diet pill seem to “work” only because buyers start eating less.",o2:"So, should we blame ourselves for buying things we don’t need, or should we learn to question the marketing behind every choice?"}}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> Writing clearly and honestly about evidence is part of being a critical, informed citizen — a value at the heart of the UAE National Education Charter. Around the world, media-literate consumers question the messages they are sold."},{t:"prompts",items:["Which technique do you think is the most powerful — and the least fair? Why?","How could a company market a product honestly?"]}],

  exit:[{t:"reflect",items:["Write your topic sentence from today.","Name one cohesive device you used.","(KWL “L”) One thing you learned about summarising."]},{t:"rating",label:"How confident do you feel writing a clear, evidence-based summary?"}]
 }

  a1:[{t:"prompts",intro:"Before you listen — predict:",items:["What steps do you think a person takes to start a business?","What might go wrong along the way?"]},{t:"note",html:"<b>Vocabulary.</b> You will hear the following words and phrases in the lecture. Match the words to their definitions. You can check and correct your answers after you listen."},{t:"match",intro:"Match each word or phrase (1–10) to its definition:",pairs:[

  ]},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Answer key (book letters A–J)</summary><div style=\"margin-top:8px;line-height:1.8\"><b>1–D</b> found = to set up or start a company<br><b>2–I</b> highly = very much<br><b>3–F</b> hire = to give someone a job<br><b>4–H</b> identify = to recognize<br><b>5–A</b> in common = with similar characteristics<br><b>6–J</b> quantity = an amount that can be measured<br><b>7–G</b> raise capital = to gather money for a purpose<br><b>8–C</b> remarkable = deserving to be noticed<br><b>9–E</b> take risks = to do something even when it may fail<br><b>10–B</b> vision = the ability to plan for the future</div></details>"},{t:"note",html:"<b>Grammar — participle clauses (G.4.5):</b> a short way to describe a process.<br>“<b>Having found</b> a gap in the market, she started the company.”<br>“<b>Founded</b> in 2018, the app now has millions of users.”"}],
  a2:[{t:"p",html:"<b>Taking lecture notes.</b> Listen to the <b>first part</b> of the lecture and make notes. Listen specifically for this information:"},{t:"note",html:"<div style=\"line-height:1.9\">1. What are entrepreneurs?<br>2. Who is a good example of an entrepreneur?<br>3. What characteristics do they have?</div>"},{t:"p",html:"<b>Activity 6 — Taking notes on a process.</b> Now listen to the <b>second part</b> of the lecture. Continue making notes. After listening, use your notes to fill in the missing information in the flowchart. (Use 🔊 Read to me to hear the script.)"},{t:"passage",title:"Second part of the lecture — the entrepreneurial process",nolabel:true,paras:[
    "I want to move on now and take a look at the entrepreneurial process. There are six basic steps that most entrepreneurs follow when they start their businesses. In the first step, they identify a problem; in other words, they see a need or a problem that no one else sees. Then, in the second step, they think of a solution — what needs to be done to solve the problem or meet the need. I think we’ve already seen several examples today of people who saw a need or an opportunity and then came up with a creative solution.",
    "Step three is to prepare a business plan. This means looking at things like equipment, location, financing, marketing, and so on. There are thousands of details to think about when you start a new business; as a result, this stage can take months or even years.",
    "The next step, the fourth step, is putting together a team — in other words, hiring the right people to work with the entrepreneur in the new business. After that, the fifth step is something called test marketing. This involves making and selling a small amount of the product or service just to try it out and see if customers like it.",
    "And if they do, then, finally, entrepreneurs go to the sixth step, which is raising capital. Capital is another word for money. The entrepreneur has to raise a lot of money — from the bank, or friends, or family — in order to produce and sell the product or service in large quantities.",
    "Through dreaming and working very hard, these people created companies that solved serious, important problems. They provided jobs for millions of people, and in general their companies made life easier and more pleasant for all of us. If you ever order a book from Amazon, or use natural make-up from the Body Shop, say thanks to the remarkable people who created these companies."
  ]},{t:"note",html:"<b>Entrepreneurial Process</b> — fill in steps 2–6 from your notes:<div style=\"max-width:440px;margin:10px auto;text-align:center\"><div style=\"border:2px solid var(--blue);border-radius:10px;padding:8px 10px;background:#eef4ff;font-weight:700\">1. Identify a problem</div><div style=\"font-size:1.3rem;color:var(--muted)\">⬇</div><div style=\"border:1px solid var(--line);border-radius:10px;padding:8px 10px\">2. ________________________</div><div style=\"font-size:1.3rem;color:var(--muted)\">⬇</div><div style=\"border:1px solid var(--line);border-radius:10px;padding:8px 10px\">3. ________________________</div><div style=\"font-size:1.3rem;color:var(--muted)\">⬇</div><div style=\"border:1px solid var(--line);border-radius:10px;padding:8px 10px\">4. ________________________</div><div style=\"font-size:1.3rem;color:var(--muted)\">⬇</div><div style=\"border:1px solid var(--line);border-radius:10px;padding:8px 10px\">5. ________________________</div><div style=\"font-size:1.3rem;color:var(--muted)\">⬇</div><div style=\"border:1px solid var(--line);border-radius:10px;padding:8px 10px\">6. ________________________</div></div>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Answer key</summary><div style=\"margin-top:8px;line-height:1.9\"><b>1.</b> Identify a problem<br><b>2.</b> Think of a solution<br><b>3.</b> Prepare a business plan<br><b>4.</b> Put together a team (hire the right people)<br><b>5.</b> Test marketing<br><b>6.</b> Raise capital</div></details>"},{t:"mcq",intro:"Listen for the main points — choose the best answer:",qs:[{q:"How many steps are in the entrepreneurial process?",opts:["four","six","ten"],ans:1},{q:"What does the entrepreneur do in step 1?",opts:["raise capital","identify a problem","hire a team"],ans:1},{q:"What is “test marketing” (step 5)?",opts:["making and selling a small amount to try it out","advertising on TV","a type of business plan"],ans:0},{q:"What is “capital”?",opts:["a type of office","another word for money","a business partner"],ans:1}]}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> The UAE actively supports young entrepreneurs through incubators, funds and free zones. Resilience and adaptability — bouncing back and adjusting your plan — are exactly the qualities the National Education Charter encourages."},{t:"prompts",items:["Name one UAE company or product you admire. What problem does it solve?","What is one risk a young founder in your city might face?"]}],

"l1112":{

 stages:{

  obj:[{t:"obj",items:["deliver a prepared presentation with connected, cohesive ideas","interpret and describe trends and details in charts and visuals","answer follow-up questions with fluency and confidence","use participle clauses to describe how your product works"]},{t:"note",html:"Your task this lesson: research and pitch a <b>business plan for a new mobile app</b>."}],
  vocab:[{t:"p",html:"<b>Key vocabulary</b> — pitching a product. Then take the Spelling Bee below."},{t:"vocab",items:[
    ["purpose","the reason something exists or is made","noun","Every app needs a clear …… ."],

    ["equipment","the tools or machines you need","noun","What …… does the team need to build it?"],

  a1:[{t:"p",html:"<b>Plan your pitch.</b> A clear app pitch covers five points. Prepare short notes for each — you will speak, not read."},{t:"prompts",intro:"Your business plan — make notes on:",items:["Purpose — what problem does your app solve?","Features — the 3 best things it does","Users & test-market — who is it for, and how will you try it out?","Team & equipment — who and what you need","Money — how it will earn (or be funded)"]},{t:"note",html:"<b>Presenting language:</b> “Our app is designed to…”, “The main features are…”, “As you can see in the chart…”, “To sum up…”"},{t:"mcq",intro:"Describe the visual — choose the best phrase:",qs:[{q:"A chart shows downloads rising month by month. You say…",opts:["“Downloads have increased steadily.”","“Downloads are a chart.”","“There is a chart.”"],ans:0},{q:"A pie chart shows most users are teenagers. You say…",opts:["“The chart is round.”","“The majority of our users are teenagers.”","“Teenagers exist.”"],ans:1},{q:"Best way to describe how it works (participle clause):",opts:["“Using AI, the app suggests plans.”","“The app is nice.”","“App good.”"],ans:0}]}],
  a2:[{t:"p",html:"<b>Speaking 3 — Research and Present · Skills Focus: Researching, Creating, and Presenting (p. 20).</b> Work in groups of three or four. Imagine you are a creative team of entrepreneurs developing a new and successful mobile app. Follow the four steps below, then present."},{t:"note",html:"<b>1 · Topic.</b> In your group, agree on the mobile app your team will create. It can be a brand-new app, or an improvement to an app that already exists."},{t:"note",html:"<b>2 · Brainstorming.</b> Start by thinking about apps that already exist. Then brainstorm ideas for a new app (or an improvement) and use a <b>mind map</b> to record all your initial ideas."},{t:"prompts",intro:"Consider these questions as you brainstorm:",items:["What is the purpose of your app? Will it solve a problem or satisfy a need?","Who will use the app? Why will they want to use it?","What will the app do, and what features will it offer?"]},{t:"note",html:"<b>3 · Researching.</b> Carry out research to design your business plan. Assign each person a different area to research; each person suggests a few options for the group to choose from."},{t:"note",html:"<b>To design your business plan, make decisions about these items:</b><div style=\"line-height:1.9;margin-top:4px\">1. Will you need any special equipment?<br>2. Where will your business be located?<br>3. Where will you find the money needed to start your business?<br>4. Who will you need to hire in order to produce your product?<br>5. Where, when, and how will you test-market it?<br>6. How will you raise capital to make and sell your product?</div>"},{t:"note",html:"<b>4 · Planning.</b> With your group, discuss the information you collected from your research. Decide <b>which information to include</b> in your presentation, <b>who will present each section</b>, and <b>how</b> you would like to present it."},{t:"note",html:"<b>Presenting language:</b> “Our app is designed to…”, “The main features are…”, “As you can see in the chart…”, “To sum up…”. Use a <b>participle clause</b> to describe how it works: “Using AI, the app suggests plans.”"},{t:"p",html:"<b>Present.</b> Deliver your group’s presentation of the app and business plan. At the end, your audience asks <b>two follow-up questions</b>, which your team answers."},{t:"note",html:"<b>Presentation checklist —</b> ☐ Clear purpose ☐ 3 features ☐ Business-plan decisions (equipment, location, funding, hiring, test-market, capital) ☐ Each member presents a section ☐ Referred to a mind map / visual ☐ Used a linking phrase ☐ Answered follow-up questions ☐ Good eye contact & pace."},{t:"rating",label:"Rate the presentation you heard: clear, well-researched, and confident?"}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> The UAE’s tech and start-up scene is booming, from fintech to smart-city apps. Effective communication — presenting your idea so others understand and believe in it — is a core National Education Charter value and a real-world skill investors look for."},{t:"prompts",items:["What kind of app would be useful for students in the UAE?","Why is confidence just as important as a good idea when you present?"]}],
  enrich:[{t:"p",html:"<b>Handle questions with confidence.</b> Good presenters welcome questions."},{t:"mcq",intro:"Choose the best response to a tough question:",qs:[{q:"“How is this different from apps that already exist?”",opts:["“I don’t know.”","“Good question — unlike others, our app works offline and is free.”","“It just is.”"],ans:1},{q:"You need a moment to think. You say…",opts:["“That’s a great point — let me explain.”","(silence)","“Next question.”"],ans:0}]},{t:"reflect",items:["Write one participle clause describing how your app works.","Write one strong closing line for your pitch."]}],
  exit:[{t:"reflect",items:["Write your app’s purpose in one sentence.","Name one thing you did well when presenting.","(KWL “L”) One thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel delivering a prepared presentation and answering questions?"}]
 }

/* ---- Lesson 13-14: Your Opinion (Reading & Viewing) ---- */
"l1314":{
 num:"13-14", focus:"Reading & Viewing", title:"Your Opinion", book:BOOK,
 grammar:"G.4.1 Clauses & phrases — defining relative clauses", fl:"FL.16 Expressing opinion", charter:"Critical Thinking",
 page:"Resource: Lessons 13–14 PPT · Reading & Writing (Supplementary Resource)",
 stages:{
  kwl:[{t:"note",html:"<b>Prior knowledge (KWL).</b> What do you already know about entrepreneurs — the people who start their own businesses? Note one thing you know and one question you have."},{t:"kwl"}],
  warm:[{t:"prompts",intro:"Warm-up — talk with a partner (5 min):",items:["Would you like to run your own business one day? Why or why not?","What kind of person do you think makes a good entrepreneur?","Is it better to take risks or to play it safe? Give a reason."]}],
  watch:[{t:"video",id:"rRpMrAMesbA",caption:"Think question: What makes a successful entrepreneur? Watch the clip, then note two qualities you would keep in mind before you read."},{t:"reflect",items:["Note TWO qualities of a successful entrepreneur from the video.","Which quality do you think matters most, and why?"]}],
  obj:[{t:"obj",items:["identify and analyse the writer’s attitude and tone towards entrepreneurship, using evidence from the text","read and identify details in an opinion text","tell the difference between fact and opinion, and find the evidence behind an opinion","use defining relative clauses to add information about people and things"]},{t:"note",html:"<b>Main SLO:</b> ENG.08.RV.CS.7.1 — identify and analyse mood, tone or attitude when reading.<br><b>Supporting SLO:</b> ENG.08.RV.CS.5.1 — read and identify details.<br><b>Grammar:</b> G.4.1 defining relative clauses · <b>Functional language:</b> FL.16 Expressing opinion · <b>Charter:</b> Critical Thinking."}],
  vocab:[{t:"p",html:"<b>Key vocabulary</b> — entrepreneurship. Tap 🔊 to hear a word or ＋ Bank to save it, then take the Spelling Bee below."},{t:"vocab",items:[
    ["entrepreneur","a person who starts a business, often taking financial risks","noun","A young …… launched the app from her bedroom."],
    ["risk-taker","a person who is willing to do things that might fail","noun","Every founder is a …… at heart."],
    ["passion","a very strong feeling or enthusiasm for something","noun","Her …… for cooking became a business."],
    ["motivation","the reason or drive to do something","noun","Solving a real problem was his main …… ."],
    ["challenge","a difficult task that tests your ability","noun","Raising money was the biggest …… ."],
    ["fulfilling","making you feel satisfied and happy","adjective","Building something of your own is …… ."],
    ["opportunity","a chance to do something good","noun","She saw an …… that others had missed."],
    ["adventurous","willing to try new or risky things","adjective","Entrepreneurs tend to be …… ."]
  ]}],
  a1:[{t:"note",html:"<b>Skills Focus: Expressing and Supporting Opinion.</b> You can express your opinion explicitly using expressions such as: <i>In my view…</i> · <i>I think that…</i> · <i>I believe…</i> · <i>I would be unwilling to…</i><br>It is important, however, to provide <b>reasons, facts, or examples</b> that support your view. Remember you are writing to a possible reader you want to interest and persuade — the only way to do this is by presenting facts, examples, or arguments that support your opinion."},{t:"p",html:"<b>Reading — “The Ups and Downs of Entrepreneurship.”</b> Read the text (use 🔊 Read to me, and tap any word for its meaning). Then find the writer’s opinions and the reasons, facts and examples that support them."},{t:"passage",title:"The Ups and Downs of Entrepreneurship",nolabel:true,paras:[
    "Some young people dream of finding a job in an office, a 9 to 5 job that will provide them security and a routine to follow. However, there are those who like to dream bigger and who enjoy a little adventure. Entrepreneurs are often considered to be risk-takers with plenty of passion, optimism, and motivation. These character traits are necessary in order to start up your own company, which comes with its own share of challenges and risks. Let’s look at some of the advantages of being an entrepreneur.",
    "First of all, the biggest advantage of entrepreneurship is the opportunity to be your own boss. You are in charge of things and you decide how to run your company. In my view, there are few pleasures in life as great as this and, although you may find that you work longer hours than you would if you were working for someone else, it’s still very fulfilling. Secondly, I think that having your own business is exciting and it can really make your life more enjoyable. There’s nothing worse than waking up in the morning and dreading the time you have to spend sitting in an office doing something you hate. Each day for an entrepreneur is different and filled with opportunities to challenge their skills and determination. Lastly, another advantage of working for yourself is that your salary is directly related to the efforts you make. The more you work, the higher your salary. So, that’s another thing to motivate you every morning.",
    "In conclusion, entrepreneurship is not for everyone. However, if you are an adventurous person, if you get bored easily, and if you’re looking for something different in life, then I believe that you are fit to become an entrepreneur. You just have to come up with the right business plan."
  ]},{t:"note",html:"<b>6 · Reading.</b> Read the text again and fill in the chart with the <b>opinions</b>, and the <b>reasons, facts, or examples</b> that support them. Copy the chart and complete it from the text."},{t:"note",html:"<table style='width:100%;border-collapse:collapse' border='1'><tr><th style='width:45%'>Opinion</th><th>Reason / fact / example that supports it</th></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Suggested answers</summary><div style=\"margin-top:8px;line-height:1.7\"><table style='width:100%;border-collapse:collapse' border='1'><tr style='background:#eef2fb'><th>Opinion</th><th>Support (reason / fact / example)</th></tr><tr><td><i>“In my view, there are few pleasures in life as great as”</i> being your own boss.</td><td>You are in charge and decide how to run your company; even if you work longer hours, it is still very fulfilling.</td></tr><tr><td><i>“I think that having your own business is exciting”</i> and makes life more enjoyable.</td><td>Each day is different and filled with opportunities to challenge your skills and determination — unlike dreading a job you hate.</td></tr><tr><td>Working for yourself is rewarding (another advantage).</td><td>Fact/reason: your salary is directly related to your effort — the more you work, the higher your salary.</td></tr><tr><td><i>“I believe that you are fit to become an entrepreneur”</i> — if it suits your character.</td><td>Reason: if you are adventurous, get bored easily, and want something different in life; you just need the right business plan.</td></tr></table><p class='muted' style='margin-top:6px;font-size:.85rem'>Note the opinion signals — “In my view…”, “I think that…”, “I believe…” — each followed by a supporting reason or example.</p></div></details>"},{t:"mcq",intro:"Check your reading — opinion, support &amp; attitude:",qs:[{q:"What is the writer’s overall attitude to entrepreneurship?",opts:["mostly positive — it is challenging but fulfilling","completely negative","bored and uninterested"],ans:0},{q:"Which is an OPINION from the text?",opts:["Entrepreneurs are risk-takers.","In my view, there are few pleasures as great as being your own boss.","A 9-to-5 job has a routine."],ans:1},{q:"What reason supports the opinion that self-employment is rewarding?",opts:["your salary is directly related to your effort","offices are boring","apps are popular"],ans:0},{q:"Which phrase signals an opinion?",opts:["“I think that…”","“There are six steps…”","“In 2015…”"],ans:0}]}],
  a2:[{t:"p",html:"<b>Grammar — defining relative clauses (G.4.1).</b> We use <b>who</b> (people), <b>which/that</b> (things), <b>whose</b> (possession) and <b>where</b> (places) to add essential information: “An entrepreneur is a person <b>who</b> starts a business.” · “A start-up is a company <b>that</b> is just beginning.”"},{t:"mcq",intro:"Choose the correct relative pronoun:",qs:[{q:"An entrepreneur is someone ____ takes risks.",opts:["who","which","where"],ans:0},{q:"A business plan is a document ____ describes the idea.",opts:["who","that","whose"],ans:1},{q:"That is the city ____ she launched her company.",opts:["which","who","where"],ans:2},{q:"She is the founder ____ vision changed the market.",opts:["who","whose","that"],ans:1}]},{t:"note",html:"<b>Expressing opinion (FL.16):</b> “In my opinion…”, “I believe that…”, “It seems to me that…”. Support every opinion with a <b>reason</b> and an <b>example</b> from the text."},{t:"reflect",items:["Write ONE sentence stating the writer’s overall attitude to entrepreneurship, plus one piece of evidence.","Write one sentence of your own using a defining relative clause (who / which / that)."]}],

/* ---- Lesson 15-16: Your Opinion (Writing & Representing) ---- */
"l1516":{
 num:"15-16", focus:"Writing & Representing", title:"Your Opinion", book:BOOK,
 grammar:"G.4.1 Clauses & phrases — defining relative clauses", fl:"FL.46 Developing an evidence-based argument", charter:"Critical Thinking",
 page:"Resource: Lessons 15–16 PPT · Reading & Writing (Supplementary Resource)",
 stages:{
  kwl:[{t:"note",html:"<b>Prior knowledge (KWL).</b> Think about the adverts you saw today. What is one way advertising changes how people think or buy?"},{t:"kwl"}],
  warm:[{t:"prompts",intro:"Warm-up — talk with a partner (5 min):",items:["What is the most memorable advert you know? Why does it stay in your mind?","Does advertising create needs, or just show us what already exists?","Is advertising mostly good or mostly harmful for consumers? Give a reason."]}],
  obj:[{t:"obj",items:["write an opinion text about the effects of advertising, giving detailed reasons and explanations","produce clear, extended writing that expresses and justifies your opinion","build an evidence-based argument: claim + reason + evidence/example","use defining relative clauses to write more precisely"]},{t:"note",html:"<b>Main SLO:</b> ENG.08.WR.P.2.1 — express ideas, opinions and perspectives, giving detailed reasons and explanations in writing.<br><b>Supporting SLO:</b> ENG.08.WR.P.1.1 — produce clear, extended written or multimodal texts, expressing justifications where appropriate.<br><b>Grammar:</b> G.4.1 defining relative clauses · <b>Functional language:</b> FL.46 Developing an evidence-based argument · <b>Charter:</b> Critical Thinking."}],
  vocab:[{t:"p",html:"<b>Key vocabulary</b> — advertising &amp; consumers. Tap 🔊 to hear a word or ＋ Bank to save it, then take the Spelling Bee below."},{t:"vocab",items:[
    ["advertising","the business of making adverts to promote products","noun","…… is everywhere we look."],
    ["consumer","a person who buys and uses goods or services","noun","Every …… is a target for adverts."],
    ["brand","a product name that customers recognise and trust","noun","A strong …… earns loyalty."],
    ["persuade","to make someone want to do or believe something","verb","Adverts …… us to buy more."],
    ["influence","to have an effect on how someone thinks or acts","verb","Marketing can …… our choices."],
    ["marketing","the ways a company promotes and sells its products","noun","…… is built around how we think."],
    ["self-image","the way you see and feel about yourself","noun","Adverts often play on our …… ."],
    ["consumerism","a way of living based on always buying and using","noun","…… drives much of the economy."]
  ]}],
  a1:[{t:"p",html:"<b>Language for writing — build an evidence-based argument (FL.46).</b> A strong opinion has three parts: a <b>claim</b> (your opinion), a <b>reason</b> (because…), and <b>evidence</b> (an example or fact). e.g. “Advertising influences self-image (claim) because it repeats ‘perfect’ images (reason); for example, many adverts show only flawless faces (evidence).”"},{t:"note",html:"<b>Cohesive devices &amp; opinion language:</b> “In my opinion…”, “I believe…”, “First… , In addition… , For example… , However… , Overall…”. Use <b>defining relative clauses</b> to be precise: “Advertising is a business <b>that</b> studies how we think.”"},{t:"mcq",intro:"Build the argument — choose the best option:",qs:[{q:"Which sentence is a clear CLAIM (opinion)?",opts:["Adverts are on TV.","In my opinion, advertising has a powerful effect on young people.","There are many adverts."],ans:1},{q:"Which adds EVIDENCE to a claim?",opts:["Advertising is bad.","For example, a study found smells changed shoppers’ choices.","I don’t like it."],ans:1},{q:"Which uses a defining relative clause?",opts:["Advertising, it is powerful.","A consumer is a person who buys goods.","Advertising and consumers."],ans:1}]},{t:"note",html:"<b>Plan your opinion text (copy &amp; complete):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th>Part</th><th>My notes</th></tr><tr><td><b>Introduction</b> — the topic + your opinion (thesis)</td><td>&nbsp;</td></tr><tr><td><b>Body 1</b> — effect 1: claim + reason + example</td><td>&nbsp;</td></tr><tr><td><b>Body 2</b> — effect 2: claim + reason + example</td><td>&nbsp;</td></tr><tr><td><b>Body 3</b> — a positive side OR a caution + your response</td><td>&nbsp;</td></tr><tr><td><b>Conclusion</b> — restate opinion + final thought</td><td>&nbsp;</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Model ‘My notes’ — a completed example to guide you</summary><div style=\"margin-top:8px;line-height:1.7\"><b>Introduction:</b> Advertising is everywhere; in my opinion, it has a strong effect — mostly on how we feel about ourselves.<br><b>Body 1:</b> It shapes self-image, because it repeats ‘perfect’ images; for example, many adverts show only flawless faces.<br><b>Body 2:</b> It creates wants, because it links products to happiness; for example, a drink is sold as ‘fun with friends’.<br><b>Body 3:</b> Advertising can also inform us about useful products, so the answer is to watch it critically.<br><b>Conclusion:</b> Overall, advertising is powerful, so consumers who think critically make wiser choices.</div></details>"}],
  a2:[{t:"p",html:"<b>✍️ Writing prompt (write about 120–150 words).</b> <i>What are the effects of advertising on consumers?</i> Write an opinion text. Give your opinion clearly, support it with at least two effects (each a claim + reason + example), mention one other side or a caution, and use opinion language, cohesive devices and at least one defining relative clause."},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Marking rubric — how your writing is scored (out of 10)</summary><div style=\"margin-top:8px\"><table style=\"width:100%;border-collapse:collapse\" border=\"1\"><tr style=\"background:#eef2fb\"><th style=\"padding:6px\">Criterion</th><th style=\"padding:6px\">What the teacher looks for</th><th style=\"padding:6px\">Marks</th></tr><tr><td style=\"padding:6px\"><b>1. Task completion</b></td><td style=\"padding:6px\">Clear opinion + at least two effects with reasons and examples; ~120–150 words.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>2. Organization</b></td><td style=\"padding:6px\">Introduction → body → conclusion, with linking words.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>3. Evidence &amp; reasoning</b></td><td style=\"padding:6px\">Each opinion is justified with a reason and an example (evidence-based).</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>4. Grammar &amp; mechanics</b></td><td style=\"padding:6px\">Correct defining relative clauses; subject–verb agreement.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>5. Spelling &amp; punctuation</b></td><td style=\"padding:6px\">Accurate spelling; capitals, full stops and commas correct.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr style=\"background:#eef2fb\"><td style=\"padding:6px\" colspan=\"2\"><b>Total</b></td><td style=\"padding:6px;text-align:center\"><b>/10</b></td></tr></table></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Sample answer — colour-coded by part</summary><div style=\"margin-top:8px\"><div style=\"margin-bottom:8px;font-size:.86rem\"><span class=\"hl-topic\">Introduction / opinion</span> <span class=\"hl-r1\">Effect 1 (claim+reason+example)</span> <span class=\"hl-r2\">Effect 2 (claim+reason+example)</span> <span class=\"hl-ex\">Other side / caution</span> <span class=\"hl-close\">Conclusion</span> · <b><i>linking words in bold italic</i></b> · <u>relative clause underlined</u></div><p style=\"line-height:2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff\"><span class=\"hl-topic\">Advertising surrounds us every day, and in my opinion it has a strong effect on consumers.</span> <b><i>First,</i></b> <span class=\"hl-r1\">it shapes our self-image, because it repeats ‘perfect’ pictures; for example, many adverts show only flawless faces, so people compare themselves and feel they must buy more.</span> <b><i>In addition,</i></b> <span class=\"hl-r2\">it creates wants we did not have, because it links products to happiness; for example, a fizzy drink <u>that</u> is really just sugar is sold as ‘fun with friends’.</span> <b><i>However,</i></b> <span class=\"hl-ex\">advertising can also inform us about useful new products, so the sensible answer is to watch it critically.</span> <b><i>Overall,</i></b> <span class=\"hl-close\">advertising is powerful, and consumers who think for themselves make wiser choices.</span></p></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff8ea\"><summary style=\"cursor:pointer;font-weight:800;color:#8a5a12\">💡 Sentence starters — help for struggling writers</summary><div style=\"margin-top:8px;line-height:1.9\"><b>Introduction:</b> “In my opinion, advertising…” · “I believe that adverts…”<br><b>Effect 1:</b> “First, it… because… ; for example,…”<br><b>Effect 2:</b> “In addition, it… because… ; for example,…”<br><b>Other side:</b> “However, advertising can also… , so…”<br><b>Conclusion:</b> “Overall, I believe… because…”</div></details>"},{t:"rating",label:"Rate your opinion text: clear opinion, evidence for each effect, and a defining relative clause?"}],

  exit:[{t:"reflect",items:["Write one effect of advertising and the reason + example you gave for it.","Write one defining relative clause you used (who / which / that).","(KWL “L”) One thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel writing a clear, evidence-based opinion text?"}]

   a1:[{t:"p",html:"<b>Read the article</b> (paragraphs are lettered A–E). Use the reading strategies as you go, then answer the questions."},{t:"passage",title:"What’s the Secret?",paras:[
     "Several places around the world are famous for their inhabitants’ very long lives. These places are usually high in the mountains, far from busy modern cities. Doctors and scientists travel to them hoping to discover the secret of such remarkable longevity.",
     "One is Hunza, high in the Himalayan Mountains of Asia, where many people over 100 are still healthy. Scientists point to three main advantages: a clean, unpolluted environment with fresh air and water; a simple diet high in vitamins and fibre but low in fat, sugar and chemicals; and hard physical work in the fields.",

   a2:[{t:"p",html:"<b>Getting meaning from context (SLO 4.1).</b> Use the words around a new word — and its word parts — to work out its meaning."},{t:"mcq",intro:"Choose the meaning that fits the text:",qs:[{q:"In this article, <b>longevity</b> means…",opts:["many years between birth and death","old people in the mountains","a hundred different ages"],ans:0},{q:"<b>Altitude</b> means…",opts:["vertical distance above sea level","dying at an early age","a healthy diet"],ans:0},{q:"An <b>environment</b> is…",opts:["the conditions of a place that influence people","a type of medicine","a mountain village"],ans:0}]},{t:"match",intro:"Word parts — match each word to its meaning using the prefix or suffix:",pairs:[["<b>un</b>polluted","not polluted"],["long-<b>lived</b>","living for a long time"],["<b>pre</b>vent","to stop before it happens"],["inhabit<b>ants</b>","people who inhabit a place"]]},{t:"reflect",items:["Write the main idea of the article in one sentence.","Write one habit from these regions that you could try yourself."]}],

   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Greetings show cultural awareness. In the UAE people often greet with “As-salamu alaykum” and a warm handshake, while in other countries a wave, a bow or a simple “Hello” is common. Knowing how people greet each other helps you show respect anywhere in the world."},{t:"prompts",items:["How do people greet each other in your family or community?","Why is it important to greet new people in a friendly, respectful way?"]}],
