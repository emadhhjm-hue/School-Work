  var v=currentVocab(); for(var i=0;i<v.length;i++){ var t=(v[i][0]||'').toLowerCase();
    if(t===w || t===w.replace(/s$/,'') || t.replace(/s$/,'')===w) return [v[i][1]||'', v[i][2]||'', v[i][3]||'']; }
  return null;
}
function openDict(w){
  var g=lessonWord(w)||GLOSS[w]||GLOSS[w.replace(/s$/,'')]||GLOSS[w.replace(/es$/,'')]||GLOSS[w.replace(/ed$/,'')]||GLOSS[w.replace(/ing$/,'')];
  var def=g?g[0]:'', pos=g?g[1]:'', ex=g?(g[2]||'').replace(/\u2026+/g, w):'';
  var vlink='https://www.vocabulary.com/dictionary/'+encodeURIComponent(w);
  var saved=inLog(w);
  var jw=esc(w).replace(/'/g,"\\'");
  document.getElementById('dictCard').innerHTML =
     '<div class="dict-hd"><h3>“'+esc(w)+'”</h3><button class="dict-x" onclick="closeDict()">✕</button></div>'
    +'<button class="dict-hear" onclick="sayWord(\''+jw+'\')">🔊 Hear it</button>'
    +(pos?'<div class="dict-pos">'+esc(pos)+'</div>':'')
    +(def?'<p class="dict-def">'+esc(def)+'</p>':'<p class="dict-def">No definition on file for this word yet — but you can still hear it, add it to your Spelling Bee list, or look it up online.</p>')
    +(ex?'<p class="dict-ex">“'+esc(ex)+'”</p>':'')
    +'<button class="gl-bank dict-bank'+(saved?' on':'')+'" '+(saved?'disabled':'')+' onclick="bankWord(\''+jw+'\',this)">'+(saved?'✓ In my Spelling Bee list':'🐝 ＋ Add to my Spelling Bee')+'</button>'
    +(def?'':'<a class="dict-more" href="'+vlink+'" target="_blank" rel="noopener">Look it up on Vocabulary.com →</a>');
  document.getElementById('dictOv').classList.add('open');
  sayWord(w);
}
function closeDict(){ try{window.speechSynthesis.cancel();}catch(e){} var c=document.getElementById('dictCard'); if(c)c.classList.remove('type-wide'); document.getElementById('dictOv').classList.remove('open'); }
function sayWord(w){ try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.85; window.speechSynthesis.speak(u);}catch(e){} }
/* Read-to-me: reads the article text, skipping gaps */
function articleText(art){
  /* read the reading text in order, speaking each gap's answer where a blank sits; skip the Glossary */
  var clone=art.cloneNode(true);
  var g=clone.querySelector('.glossary'); if(g) g.parentNode.removeChild(g);
  clone.querySelectorAll('input.gap').forEach(function(inp){
    var w=inp.value.trim()||inp.getAttribute('data-a')||'';
    inp.parentNode.replaceChild(document.createTextNode(' '+w+' '), inp);
  });
  clone.querySelectorAll('.pl').forEach(function(pl){ pl.parentNode.removeChild(pl); }); /* drop paragraph letters */
  return clone.textContent.replace(/\s+/g,' ').trim();
}
/* ---- Read-aloud with word-by-word highlight (chunked for long texts) ---- */
var RW={art:null, orig:null, words:[], off:[], base:0, btn:null, chunks:[], ci:0, keep:null, on:false};
function rwUnwrap(){ if(RW.art && RW.orig!=null){ try{ RW.art.innerHTML=RW.orig; }catch(e){} } RW.art=null; RW.orig=null; RW.words=[]; RW.off=[]; RW.base=0; }
function rwWrap(art){
  rwUnwrap(); RW.art=art; RW.orig=art.innerHTML; RW.words=[]; RW.off=[];
  var walker=document.createTreeWalker(art, NodeFilter.SHOW_TEXT, null, false), nodes=[], n;
  while((n=walker.nextNode())){ var par=n.parentNode; if(par && par.classList && par.classList.contains('pl')) continue; if(!n.nodeValue || !n.nodeValue.trim()) continue; nodes.push(n); }
  nodes.forEach(function(tn){
    var parts=tn.nodeValue.split(/(\s+)/), frag=document.createDocumentFragment();
    parts.forEach(function(p){ if(p==='') return; if(/^\s+$/.test(p)){ frag.appendChild(document.createTextNode(p)); } else { var s=document.createElement('span'); s.className='rw'; s.textContent=p; frag.appendChild(s); RW.words.push(s); } });
    tn.parentNode.replaceChild(frag, tn);
  });
  var off=0; RW.words.forEach(function(s,i){ RW.off[i]=off; off += s.textContent.length + 1; });
  return RW.words.map(function(s){return s.textContent;}).join(' ');
}
function rwHighlightAt(ci){ if(!RW.words.length) return; var abs=RW.base+ci; var idx=-1; for(var i=0;i<RW.words.length;i++){ if(RW.off[i]<=abs) idx=i; else break; } for(var j=0;j<RW.words.length;j++){ RW.words[j].classList.remove('rw-on'); } var cur=RW.words[idx]; if(cur){ cur.classList.add('rw-on'); try{ cur.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){} } }
/* split text into speech-sized chunks (<=180 chars), breaking on sentence ends, tracking each chunk's start offset in the full string */
function rwChunks(txt){
  var out=[], i=0, N=txt.length, MAX=180;
  while(i<N){
    var end=Math.min(N, i+MAX);
    if(end<N){
      var slice=txt.slice(i,end);
      var m=Math.max(slice.lastIndexOf('. '),slice.lastIndexOf('! '),slice.lastIndexOf('? '),slice.lastIndexOf('; '),slice.lastIndexOf(': '));
      if(m<0) m=slice.lastIndexOf(' ');
      if(m>20) end=i+m+1;
    }
    out.push({text:txt.slice(i,end), start:i});
    i=end;
  }
  return out;
}
function rwStopUI(){ RW.on=false; if(RW.keep){ clearInterval(RW.keep); RW.keep=null; } if(RW.btn){ RW.btn.textContent='🔊 Read to me'; RW.btn=null; } }
function rwSpeakNext(){
  if(!RW.on) return;
  if(RW.ci>=RW.chunks.length){ rwUnwrap(); rwStopUI(); return; }
  var ch=RW.chunks[RW.ci]; RW.base=ch.start;
  var u=new SpeechSynthesisUtterance(ch.text); u.lang='en-GB'; u.rate=RSET.rate; u.volume=RSET.vol;
  u.onboundary=function(e){ if(e.name && e.name!=='word') return; rwHighlightAt(e.charIndex||0); };
  u.onend=function(){ if(!RW.on) return; RW.ci++; rwSpeakNext(); };
  u.onerror=function(){ if(!RW.on) return; RW.ci++; rwSpeakNext(); };
  try{ window.speechSynthesis.speak(u); }catch(e){ RW.ci++; rwSpeakNext(); }
}
function readAloud(id,btn){
  var art=document.getElementById(id); if(!art) return;
  var synth=window.speechSynthesis; if(!synth){ if(btn){ btn.textContent='Speech not supported'; } return; }
  // toggle off if already reading
  if(RW.on){ try{synth.cancel();}catch(e){} rwUnwrap(); rwStopUI(); return; }
  try{ synth.cancel(); }catch(e){}
  var txt=rwWrap(art);
  if(!txt || !txt.trim()){ rwUnwrap(); return; }
  RW.chunks=rwChunks(txt); RW.ci=0; RW.on=true; RW.btn=btn||null;
  if(btn) btn.textContent='⏹ Stop';
  // keep-alive: Chrome pauses long queues; nudge it so it keeps going
  RW.keep=setInterval(function(){ try{ if(RW.on && synth.speaking){ synth.pause(); synth.resume(); } }catch(e){} }, 9000);
  rwSpeakNext();
}
function readStop(el){ try{window.speechSynthesis.cancel();}catch(e){} try{rwUnwrap();}catch(e){} rwStopUI(); var w=el&&el.closest?el.closest('.rtoolbar'):null; var b=w&&w.querySelector('.rt-primary'); if(b)b.textContent='🔊 Read to me'; }
/* Zoom the article text in/out */
function zoomArt(id,dir){
  var art=document.getElementById(id); if(!art) return;
  var cur=parseFloat(art.getAttribute('data-fs')||'1'); cur=Math.min(1.8,Math.max(.8,cur+dir*0.1));
  art.setAttribute('data-fs',cur); art.style.fontSize=cur+'em';
  var lab=document.querySelector('.rt-zoomv[data-art="'+id+'"]'); if(lab)lab.textContent=Math.round(cur*100)+'%';
}
/* Type-this-article: a focused copy-typing practice over the article text */
function typeArticle(id){
  var art=document.getElementById(id); if(!art) return;
  var text=articleText(art);
  TYPE={text:text,pos:0};
  var card=document.getElementById('dictCard'); if(card) card.classList.add('type-wide');
  card.innerHTML =
    '<div class="dict-hd"><h3>⌨️ Type this article</h3><button class="dict-x" onclick="closeDict()">✕</button></div>'
   +'<p style="font-size:.9rem;color:var(--muted);margin:0 0 8px">Type the passage exactly. Each letter is checked as you type — correct letters turn green, mistakes turn red, and the blue bar shows where you are.</p>'
   +'<div id="typeTarget" class="type-target"></div>'
   +'<textarea id="typeIn" class="type-in" rows="4" placeholder="Start typing here…" oninput="typeProgress()" autocomplete="off" spellcheck="false"></textarea>'
   +'<div id="typeStat" class="type-stat">0% · 0 errors</div>';
  document.getElementById('dictOv').classList.add('open');
  renderType(); var ta=document.getElementById('typeIn'); if(ta) ta.focus();
}
var TYPE=null;
function renderType(){ if(!TYPE)return; typeProgress(); }
function typeProgress(){
  if(!TYPE)return; var ta=document.getElementById('typeIn'); var v=ta?ta.value:''; var t=TYPE.text;
  var errs=0,ok=0,html='';
  for(var i=0;i<t.length;i++){
    var ch=esc(t[i]);
    if(i<v.length){ if(v[i]===t[i]){ok++; html+='<span class="tc-ok">'+ch+'</span>'; } else { errs++; html+='<span class="tc-bad">'+ch+'</span>'; } }
    else if(i===v.length){ html+='<span class="type-caret">'+ch+'</span>'; }   // caret at current letter
    else html+='<span>'+ch+'</span>';
  }
  var tgt=document.getElementById('typeTarget'); if(tgt) tgt.innerHTML=html;
  var pct=t.length?Math.round((ok/t.length)*100):0;
  var stat=document.getElementById('typeStat'); if(stat) stat.textContent=pct+'% · '+errs+' error'+(errs===1?'':'s');
  // keep the current letter in view so the typist can follow along
  var car=tgt&&tgt.querySelector('.type-caret'); if(car){ try{ car.scrollIntoView({block:'nearest'}); }catch(e){} }
}

var BEE=null;
function currentVocab(){ var L=LESSONS[CUR.id]; if(!L)return[]; var st=(L.stages&&L.stages.vocab)||[]; for(var i=0;i<st.length;i++){ if(st[i].t==='vocab') return st[i].items||[]; } return []; }
function openBee(mode){
 var items;
 if(mode==='mine'){
   items=vocabLog().map(function(e){ return [e.w, e.def||'', e.pos||'', e.ex||'']; });
   if(!items.length){ alert('Your Spelling Bee list is empty. While you read, tap a word and choose “＋ Add to my Spelling Bee” to add it.'); return; }
 } else {
   items=currentVocab().slice();
   if(!items.length){ alert('No vocabulary list found for this lesson.'); return; }
 }
 BEE={list:items,i:0,attempt:1,score:0,tleft:15,iv:null,mine:(mode==='mine')};
 document.getElementById('beeOv').classList.add('open');
 renderBee();
}
function closeBee(){ if(BEE&&BEE.iv){clearInterval(BEE.iv);} BEE=null; try{window.speechSynthesis.cancel();}catch(e){} document.getElementById('beeOv').classList.remove('open'); }
function beeWord(){ return BEE.list[BEE.i]; }
function renderBee(){
 if(!BEE) return; if(BEE.i>=BEE.list.length){ return beeResult(); }
 var w=beeWord(), term=w[0], def=w[1]||'', pos=w[2]||'', ex=w[3]||'';
 var total=BEE.list.length, pct=Math.round((BEE.i/total)*100);
 var exHtml = ex ? '<p class="bee-ex">“'+esc(ex)+'”</p>' : '';
 var posHtml = pos ? '<div class="bee-pos">'+esc(pos)+'</div>' : '';
 document.getElementById('beeCard').innerHTML =
   '<div class="bee-hd"><h3>🐝 Spelling Bee</h3><button class="bee-x" onclick="closeBee()">✕</button></div>'
   +'<div class="bee-sub">Word '+(BEE.i+1)+' of '+total+' · attempt '+BEE.attempt+' of 2 · score '+BEE.score+'</div>'
   +'<div class="bee-bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="bee-time" id="beeTime">⏱ '+BEE.tleft+'s</div>'
   +'<button class="bee-hear" onclick="beeSpeak()">🔊 Hear the word</button>'
   +posHtml+'<p class="bee-def">'+esc(def)+'</p>'+exHtml
   +'<input class="bee-in" id="beeIn" placeholder="type the word…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')beeCheck()">'
   +'<div class="bee-fb" id="beeFb"></div>'
   +'<button class="bee-chk" onclick="beeCheck()">Check ✓</button>'
   +'<div class="bee-note">🏅 Score at least 60% across the words to earn a spelling certificate.</div>';
 var inp=document.getElementById('beeIn'); if(inp) inp.focus();
 beeStartTimer(); beeSpeak();
}
function beeStartTimer(){ if(BEE.iv)clearInterval(BEE.iv); BEE.tleft=15; var t=document.getElementById('beeTime'); if(t)t.textContent='⏱ 15s';
 BEE.iv=setInterval(function(){ if(!BEE)return; BEE.tleft--; var el=document.getElementById('beeTime'); if(el)el.textContent='⏱ '+BEE.tleft+'s'; if(BEE.tleft<=0){ clearInterval(BEE.iv); BEE.iv=null; beeTimeout(); } },1000);
}
function beeSpeak(){ try{ var w=beeWord(); window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(w[0]); u.lang='en-GB'; u.rate=.85; window.speechSynthesis.speak(u);}catch(e){} }
function beeCheck(){
 if(!BEE) return; var inp=document.getElementById('beeIn'); if(!inp)return;
 var val=(inp.value||'').trim().toLowerCase(); var ans=(beeWord()[0]||'').trim().toLowerCase();
 var fb=document.getElementById('beeFb');
 if(!val){ if(fb){fb.style.color='#8a5a12';fb.textContent='Type the word first.';} return; }
 if(val===ans){ if(BEE.iv){clearInterval(BEE.iv);BEE.iv=null;} BEE.score++; if(fb){fb.style.color='var(--good)';fb.textContent='✓ Correct!';} setTimeout(beeAdvance,650); }
 else if(BEE.attempt<2){ BEE.attempt++; if(BEE.iv){clearInterval(BEE.iv);BEE.iv=null;} if(fb){fb.style.color='var(--bad)';fb.textContent='✗ Not quite — one attempt left.';} inp.value=''; inp.focus(); renderBeeCounter(); beeStartTimer(); }
 else { if(BEE.iv){clearInterval(BEE.iv);BEE.iv=null;} if(fb){fb.style.color='var(--bad)';fb.innerHTML='✗ The word was <b>'+esc(beeWord()[0])+'</b>.';} setTimeout(beeAdvance,1300); }
}
function renderBeeCounter(){ var s=document.querySelector('.bee-sub'); if(s)s.textContent='Word '+(BEE.i+1)+' of '+BEE.list.length+' · attempt '+BEE.attempt+' of 2 · score '+BEE.score; }
function beeTimeout(){ if(!BEE)return; var fb=document.getElementById('beeFb');
 if(BEE.attempt<2){ BEE.attempt++; if(fb){fb.style.color='var(--bad)';fb.textContent='⏱ Time! One attempt left.';} var inp=document.getElementById('beeIn'); if(inp){inp.value='';inp.focus();} renderBeeCounter(); beeStartTimer(); }
 else { if(fb){fb.style.color='var(--bad)';fb.innerHTML='⏱ Time! The word was <b>'+esc(beeWord()[0])+'</b>.';} setTimeout(beeAdvance,1300); }
}
function beeAdvance(){ if(!BEE)return; BEE.i++; BEE.attempt=1; renderBee(); }
function beeResult(){
 if(BEE.iv){clearInterval(BEE.iv);BEE.iv=null;}
 var total=BEE.list.length, pct=Math.round((BEE.score/total)*100), pass=pct>=60;
 document.getElementById('beeCard').innerHTML =
   '<div class="bee-hd"><h3>🐝 Spelling Bee</h3><button class="bee-x" onclick="closeBee()">✕</button></div>'
   +'<div style="text-align:center;padding:12px 0 4px"><div style="font-size:2.6rem">'+(pass?'🏅':'📚')+'</div>'
   +'<div style="font-size:1.4rem;font-weight:800;margin-top:4px">'+BEE.score+' / '+total+' correct ('+pct+'%)</div>'
   +'<p style="color:var(--muted);margin:8px 0 0">'+(pass?'Great spelling! You reached the certificate mark for this word list.':'Keep practising — score 60% or more to earn the certificate.')+'</p></div>'
   +'<div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn" onclick="openBee()">↻ Try again</button><button class="btn pri" onclick="closeBee()">Done</button></div>';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&BEE) closeBee(); });

/* ---------------- state persistence (per session) ---------------- */
function fields(){ return document.querySelectorAll('#body textarea, #body select, #body input, #body .rate'); }
function keyOf(){ return CUR.cls+'|'+CUR.id+'|'+CUR.stage; }
function saveState(){ if(!CUR.id) return; var arr=[]; Array.prototype.forEach.call(fields(),function(el){ arr.push((el.className||'').indexOf('rate')>=0 ? (el.getAttribute('data-r')||'') : el.value); }); LSTATE[keyOf()]=arr; }
function restoreState(){ var s=LSTATE[keyOf()]; if(!s) return; Array.prototype.forEach.call(fields(),function(el,i){ if(s[i]==null) return; if((el.className||'').indexOf('rate')>=0){ var r=parseInt(s[i],10)||0; paintStars(el,r); } else el.value=s[i]; }); }

/* ---------------- timer ---------------- */
var TM={sec:0,run:false,iv:null};
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function paint(label){var tv=document.getElementById('tv'),tl=document.getElementById('tl'),t=document.getElementById('timer'); if(tv)tv.textContent=fmt(TM.sec); if(tl&&label!=null)tl.textContent=label; if(t)t.style.background=(TM.sec<=0?'var(--red)':(TM.run?'var(--teal)':'#1a2238'));}
function setTimer(mins){ if(TM.iv){clearInterval(TM.iv);TM.iv=null;} TM.run=false; TM.sec=Math.round((mins||5)*60); paint('TAP TO START'); }
function startTimer(){ if(TM.sec<=0)return; TM.run=true; if(TM.iv)clearInterval(TM.iv); TM.iv=setInterval(function(){ TM.sec--; if(TM.sec<=0){TM.sec=0;TM.run=false;clearInterval(TM.iv);TM.iv=null;paint("TIME'S UP");return;} paint('COUNTING DOWN'); },1000); paint('COUNTING DOWN'); }
function stopTimer(){ TM.run=false; if(TM.iv){clearInterval(TM.iv);TM.iv=null;} }
function timerToggle(){ if(TM.run){ TM.run=false; if(TM.iv){clearInterval(TM.iv);TM.iv=null;} paint('PAUSED — TAP TO RESUME'); } else startTimer(); }

renderClasses();
