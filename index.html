<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>11Adv-12Gen 2026-2027 · School Work</title>
<style>
  :root{
    --ink:#1a2238; --muted:#697089; --line:#e5e8f0; --bg:#f6f7fb;
    --red:#c0392b; --blue:#2B5FA6; --purple:#7A2FD0; --teal:#0FA98B;
    --good:#1a9d6b; --bad:#d65656; --amber:#F2A93B;
    --shadow:0 10px 30px rgba(30,40,90,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 80px}
  a{color:inherit}
  h1{font-family:Georgia,"Times New Roman",serif}
  .btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:.9rem;background:#eef1f6;color:#33405a;transition:.15s;font-family:inherit}
  .btn:hover{filter:brightness(.97)}
  .btn.pri{background:var(--ink);color:#fff}
  .btn.sm{padding:7px 12px;font-size:.85rem}
  .back{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:4px 0;font-size:.95rem}
  .back:hover{color:var(--ink)}

  /* hub */
  .hero{background:linear-gradient(120deg,#1a2238,#2B5FA6 55%,#7A2FD0);color:#fff;border-radius:18px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:22px}
  .hero .back{color:#dfe7ff;opacity:.9;margin-bottom:6px}
  .hero .back:hover{opacity:1;text-decoration:underline}
  .classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .classcard{display:block;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--blue);border-radius:16px;padding:20px;cursor:pointer;transition:.15s}
  .classcard:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-2px)}
  .classcard .cc-name{font-size:1.25rem;font-weight:800;color:var(--ink)}
  .classcard .cc-chapter{font-weight:700;color:var(--blue);margin-top:2px}
  .classcard .cc-blurb{color:var(--muted);margin-top:8px;font-size:.9rem;line-height:1.5}
  .classcard .cc-meta{margin-top:12px;display:inline-block;background:#eef3fb;color:var(--ink);font-weight:800;font-size:.75rem;padding:5px 12px;border-radius:999px}
  .classcard.soon{border-left-color:var(--muted);opacity:.85}
  .classcard.soon .cc-meta{background:#f0eff2;color:var(--muted)}
  .hero .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:800}
  .hero h1{font-size:2rem;margin:6px 0 4px}
  .hero p{margin:0;opacity:.95;max-width:760px}
  .week{margin-bottom:26px}
  .week-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .wk-badge{background:var(--ink);color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:.8rem}
  .wk-skill{font-weight:800}
  .wk-skill.ls{color:var(--purple)} .wk-skill.rw{color:var(--teal)}
  .wk-dates{color:var(--muted);font-size:.85rem}
  .lesson-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;margin-bottom:12px;transition:.15s}
  .lesson-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-1px)}
  .lesson-card .lk{font-size:.7rem;font-weight:800;letter-spacing:.05em;color:var(--red);text-transform:uppercase}
  .lesson-card .lt{font-size:1.2rem;font-weight:800;margin:3px 0 2px}
  .lesson-card .lb{color:var(--muted);font-size:.85rem}
  .lesson-card .lm{color:var(--muted);font-size:.78rem;margin-top:6px}
  .soon{opacity:.6;cursor:default}
  .soon:hover{transform:none;border-color:var(--line);box-shadow:none}

  /* lesson player */
  .lp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .lp-title h1{font-size:1.7rem;margin:2px 0 2px}
  .lp-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.05em;color:var(--red)}
  .lp-book{color:var(--muted);font-size:.85rem}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
  .chip{background:#eef1f6;color:#40506e;border-radius:999px;padding:3px 11px;font-size:.72rem;font-weight:700}
  .lp-page{background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;padding:8px 13px;margin:10px 0;font-size:.86rem;color:#7a5a12;display:inline-block}
  #timer{background:var(--ink);color:#fff;border-radius:14px;padding:12px 22px;min-width:140px;text-align:center;cursor:pointer;box-shadow:var(--shadow);user-select:none;flex:0 0 auto}
  #timer .tl{font-size:.6rem;letter-spacing:.14em;opacity:.82;font-weight:700}
  #timer .tv{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

  .lp-grid{display:grid;grid-template-columns:1fr 240px;gap:22px;margin-top:14px;align-items:start}
  .lp-body{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 26px;min-height:300px}
  .lp-menu{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
  .lp-menu button{border:0;text-align:right;background:#5a6b8c;color:#fff;padding:11px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.82rem;transition:.12s;font-family:inherit;line-height:1.2}
  .lp-menu button small{display:block;font-weight:600;opacity:.85;font-size:.68rem}
  .lp-menu button:hover{filter:brightness(1.08)}
  .lp-menu button.on{background:var(--red);box-shadow:var(--shadow)}
  .stage-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
  .stage-head h2{font-size:1.3rem;margin:0}
  .stage-min{color:var(--muted);font-size:.8rem}
  .nav-row{display:flex;justify-content:space-between;margin-top:22px}

  /* blocks */
  .lp-body p{line-height:1.65}
  .note{background:#eef4ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 14px;margin:10px 0;font-size:.94rem}
  ol,ul{line-height:1.75}
  .objbox{background:#f4f7fb;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .objbox b{color:var(--blue)}
  .vrow{display:flex;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
  .vrow>b.vw{flex:0 0 128px;color:#12324f;cursor:pointer}
  .vrow>b.vw:hover{text-decoration:underline}
  .vrow .vd{flex:1}
  .vrow .vacts{flex:none;display:flex;gap:6px;align-items:center}
  @media (max-width:640px){ .vrow{flex-wrap:wrap} .vrow>b.vw{flex-basis:100%} .vrow .vd{flex-basis:100%} }
  .vrow:last-child{border-bottom:0}
  .vrow b{min-width:170px;color:var(--ink)}
  .wordday{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border-radius:12px;padding:14px 16px;margin-top:12px}
  .wordday .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  .wordday .w{font-size:1.3rem;font-weight:800}
  textarea,select,input[type=text]{font-family:inherit}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px}
  label.q{display:block;font-weight:700;margin:10px 0 4px}
  .passage p{margin:8px 0}
  .pl{color:var(--red);font-weight:800;margin-right:.4em}
  .graded select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;min-width:180px}
  .grow{display:flex;gap:10px;align-items:center;margin:7px 0;flex-wrap:wrap}
  .grow span.l{flex:1;min-width:220px}
  .gap{border:0;border-bottom:2px solid var(--blue);text-align:center;font-size:1em;background:#f4f7ff}
  .fb{display:none;margin-top:10px;font-size:.92rem}
  .rate{font-size:1.7rem;color:var(--amber);user-select:none;display:inline-flex;gap:6px}
  .rate span{cursor:pointer;padding:2px 4px;line-height:1;transition:transform .08s}
  .rate span:hover{transform:scale(1.15)}
  details summary{cursor:pointer;font-weight:700;color:var(--blue)}

  /* speaking role-play cards */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .rolecard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcff}
  .rolecard h4{margin:0 0 4px;color:var(--purple)}
  @media (max-width:600px){ .roles{grid-template-columns:1fr} }

  /* Activity 2 · writing model + phased timer */
  .a2write .wtimer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
  .wt-clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem;min-width:96px;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px}
  .wt-clock.run{background:var(--teal)} .wt-clock.done{background:var(--red)}
  .wt-phase{font-weight:700;color:var(--muted);font-size:.85rem}
  .hlk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .hlk span{padding:2px 9px;border-radius:6px;font-weight:700;font-size:.76rem}
  .hl-topic{background:#dff5e8;color:#0b6b43}
  .hl-r1{background:#e4eeff;color:#1c4e9c}
  .hl-r2{background:#efe4ff;color:#5a2ea6}
  .hl-close{background:#fff1cf;color:#8a5a12}
  .model-ans{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfcff;line-height:1.95}
  .model-ans span{padding:2px 4px;border-radius:4px}
  .wbank{margin:8px 0 10px;padding:10px 12px;border:1px dashed var(--blue);border-radius:10px;background:#f4f7ff;line-height:2}
  .wchip{display:inline-block;margin:3px 6px 3px 0;padding:3px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:.9rem}
  .cloze-art p{line-height:2.3;margin:10px 0}
  .cloze-art .gap{min-width:90px}
  .tmi-row{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fcfcff}
  .tmi-h{font-weight:800;color:var(--purple);margin-bottom:2px}
  .tmi-in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px}
  /* sub-tabs inside an activity */
  .subtab-row{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:2px 0 14px}
  .subtab{border:0;background:transparent;padding:8px 14px;font-weight:800;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;font-size:.92rem}
  .subtab.on{color:var(--blue);border-bottom-color:var(--blue)}
  .subtab:hover{color:var(--ink)}
  /* reading toolbar + clickable words */
  .rtoolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fafbff}
  .rt-zoom{display:inline-flex;gap:4px}
  .rt-hint{font-size:.78rem;color:var(--muted)}
  .wordable{cursor:default}
  .wordable p{cursor:text}
  /* dictionary + type popup */
  .dict-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .dict-ov.open{display:flex}
  .dict{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .dict-hd{display:flex;align-items:center;justify-content:space-between}
  .dict-hd h3{margin:0;color:var(--blue);font-size:1.4rem}
  .dict-x{border:0;background:#eef1f6;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem}
  .dict-hear{margin:8px 0;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
  .dict-pos{display:inline-block;background:#eef4ff;color:#1c4e9c;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.8rem;margin-left:8px}
  .dict-def{margin:10px 0 4px;font-size:1.02rem}
  .dict-ex{margin:4px 0;color:var(--muted);font-style:italic}
  .dict-more{display:inline-block;margin-top:8px;color:var(--blue);font-weight:700;text-decoration:none}
  .type-target{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfcff;line-height:1.9;max-height:150px;overflow:auto;font-size:.95rem}
  .type-in{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:inherit}
  .type-stat{margin-top:6px;font-weight:700;color:var(--muted)}
  .tc-ok{color:#0b6b43;background:#dff5e8}
  .tc-bad{color:#b00020;background:#ffe1e4}
  /* reading toolbar (reference style) */
  .rtoolbar{border:1px solid var(--line);border-radius:14px;background:#f6f8fc;padding:8px 10px;margin:6px 0 14px}
  .rt-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rt-line+.rt-line{margin-top:8px}
  .rt-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:800;font-size:.86rem;cursor:pointer;font-family:inherit;color:#33405a;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .rt-btn:hover{border-color:var(--blue)}
  .rt-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rt-stop{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rt-toggle.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rt-hl.on{background:#fff1cf;border-color:var(--amber);color:#8a5a12}
  .rt-bee{background:var(--amber);color:#5a3d00;border-color:var(--amber)}
  .rt-grp{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-left:1px solid var(--line)}
  .rt-lab{font-weight:800;font-size:.82rem;color:var(--muted)}
  .rt-step{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800;font-size:1rem;line-height:1}
  .rt-range{accent-color:var(--teal);width:90px}
  .rt-val{font-weight:800;font-size:.82rem;color:#33405a;min-width:38px;text-align:center}
  .rt-size{padding:6px 10px}
  /* highlighter mode */
  .cloze-art.hl-on p{cursor:text}
  .cloze-art.hl-on ::selection{background:#fff3a0}
  .cloze-art .usermark{background:#fff3a0;border-radius:3px;padding:0 2px}
  /* spelling list popup */
  .sl-list{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
  .sl-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fcfcff}
  .sl-row b{min-width:92px}
  .sl-row span{font-size:.85rem;color:var(--muted)}
  .sl-hear{border:0;background:#eef1f6;border-radius:8px;width:30px;height:30px;cursor:pointer}
  @media (max-width:640px){ .rt-range{width:64px} .rt-grp{border-left:0} }
  /* bold key vocabulary in the reading */
  .cloze-art .kw{font-weight:800;color:#12324f;background:#eef4ff;border-radius:4px;padding:0 3px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .cloze-art .kw:hover{background:#dbe7ff}
  /* glossary / vocabulary study */
  .glossary{margin:16px 0 4px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fafbff}
  .glossary h3{margin:0 0 2px;color:var(--blue);font-size:1.05rem}
  .gl-hint{margin:0 0 10px;font-size:.8rem;color:var(--muted)}
  .gl-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
  .gl-row:first-of-type{border-top:0}
  .gl-hear{border:0;background:#eef1f6;border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none}
  .gl-body{flex:1}
  .gl-w{font-weight:800;color:#12324f;cursor:pointer;font-size:1.02rem;border-bottom:2px solid transparent}
  .gl-w:hover{border-bottom-color:var(--blue)}
  .gl-pos{display:inline-block;margin-left:8px;background:#eef4ff;color:#1c4e9c;border-radius:6px;padding:1px 7px;font-weight:700;font-size:.75rem}
  .gl-def{margin:3px 0 0}
  .gl-ex{margin:2px 0 0;color:var(--muted);font-style:italic;font-size:.92rem}
  .gl-row{align-items:center}
  .gl-actions{display:flex;gap:6px;flex:none;align-items:center}
  .gl-ico{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:34px;cursor:pointer;font-size:1rem}
  .gl-bank{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;height:34px;cursor:pointer;font-weight:800;color:#33405a;font-size:.85rem}
  .gl-bank:hover{border-color:var(--blue)}
  .gl-bank.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* OREO free-writing */
  .oreo-box{border:1px solid var(--amber);background:#fffdf6;border-radius:16px;padding:16px 18px;margin-top:16px}
  .oreo-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .oreo-badge{background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem}
  .oreo-task{margin:6px 0 10px}
  .oreo-key{font-size:.86rem;color:#33405a;margin:0 0 12px;padding:8px 10px;border:1px dashed var(--amber);border-radius:10px;background:#fff}
  .ok{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-weight:800;color:#fff;font-size:.8rem}
  .ok-o{background:#2e7d55}.ok-r{background:#3f6fb5}.ok-e{background:#7a52a3}.ok-o2{background:#c98a1e}
  .hl-ex{background:#efe6fb}
  /* Visual pop-up */
  .visual-cta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
  .vis-btn{background:#12324f;color:#fff;border-color:#12324f}
  .visual-hint{font-size:.82rem;color:var(--muted)}
  .visual-modal{max-width:640px}
  .visual-img{width:100%;border-radius:12px;border:1px solid var(--line);margin:6px 0}
  .visual-cap{font-size:.92rem;color:#33405a;margin:4px 0 0}
  /* Facts vs Assumptions */
  .facts{margin:14px 0}
  .fa-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .fa-chip{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid}
  .fa-chip.f{color:#2e7d32;background:#e8f5e9;border-color:#bfe0c1}
  .fa-chip.a{color:#c25e00;background:#fff3e0;border-color:#f2d3ac}
  .fa-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .fa-stmt{font-size:.98rem;margin-bottom:10px}
  .fa-num{font-weight:800;color:var(--purple);margin-right:6px}
  .fa-choices{display:flex;gap:10px}
  .fa-choice{flex:1;text-align:center;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fafafb;cursor:pointer;font-weight:800;font-size:.85rem;font-family:inherit;letter-spacing:.3px}
  .fa-choice:hover{border-color:#c7c7cf}
  .fa-choice.sel{border-color:#12324f;background:#eef2fb;color:#12324f}
  .fa-card.fa-ok{border-color:#bfe0c1;box-shadow:0 0 0 2px #e8f5e9 inset}
  .fa-card.fa-no{border-color:#f2c0a8;box-shadow:0 0 0 2px #fff3e0 inset}
  .fa-choice.right{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32}
  .fa-choice.rightA{border-color:#c25e00;background:#fff3e0;color:#c25e00}
  .fa-choice.badpick{border-color:#d9534f;background:#fdecea;color:#b3352f}
  .fa-fb{margin-top:11px;font-size:.86rem;padding:10px 12px;border-radius:8px;display:none;border-left:4px solid;line-height:1.55}
  .fa-fb.show{display:block}
  .fa-fb.f{background:#e8f5e9;border-color:#2e7d32}
  .fa-fb.a{background:#fff3e0;border-color:#c25e00}
  .fa-fb b{display:block;margin-bottom:3px}
  .fa-bar{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
  .fa-score{font-weight:800;color:#12324f}
  /* textbook facts (as-is) */
  .factbook{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcff}
  .fb-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
  .fb-row:first-of-type{border-top:0}
  .fb-n{font-weight:800;color:var(--purple);flex:none}
  .fb-t{flex:1}
  .fb-in{flex:none;width:150px;border:0;border-bottom:2px solid var(--blue);background:#f4f7ff;border-radius:4px;padding:5px 8px;font-family:inherit}

  a1:[{t:"p",html:"<b>Before you listen.</b>"},{t:"prompts",intro:"Topic — discuss:",items:["Is it easy or hard for you to manage money? Why?","Do you keep a budget each month?","What do you usually do when you need more money?"]},{t:"match",intro:"Vocabulary in context — choose the meaning that fits each sentence:",pairs:[["Everything <b>costs an arm and a leg</b> these days.","to be very expensive"],["It’s hard to <b>make ends meet</b> without a job.","to have just enough money to live on"],["Tim lost his job and now he is <b>broke</b>.","having no money at all"],["We’re on a <b>tight budget</b> this month.","a plan that lets you spend only a little"],["Sara has an <b>income</b> of 3,500 dirhams a month.","the money you receive for work or other sources"],["Try not to spend more than you <b>earn</b>.","to receive money for work"],["He had to <b>drop out of</b> the race with an injury.","to leave without finishing"]]},{t:"mcq",intro:"Thinking & predicting — you will hear a student ask a parent for money. Predict before you listen:",qs:[{q:"The student probably needs money for…",opts:["a school trip","a new phone","a birthday gift"],ans:1},{q:"Is this the first time they have asked?",opts:["Yes, the first time","No, they have asked before"],ans:1},{q:"The parent will most likely…",opts:["give the money with no questions","suggest a budget or a plan","refuse and hang up"],ans:1},{q:"At the end, the student probably feels…",opts:["satisfied","a little frustrated","completely calm"],ans:1}]}],
  a2:[{t:"p",html:"<b>While you listen.</b> Read (or listen to your teacher read) the conversation between <b>Adam</b> and his <b>mother</b>."},{t:"dialogue",intro:"Listening for stressed words — fill each gap with the word you hear:",lines:[["Mum","Hello?"],["Adam","Hi, Mum. Can I ask you a quick [[favour]]?"],["Mum","Of course. What is [[it]]?"],["Adam","Well… I’m a bit [[broke]] again. Could you send me two [[hundred]] dirhams, just till the end of the month?"],["Mum","Broke again? Adam, when you moved out you said you could [[make]] ends meet. This is the [[third]] time you’ve asked this month."],["Adam","I know, I’m [[sorry]]. My old phone broke and I had to buy a new [[one]]."],["Mum","A new phone costs an arm and a [[leg]]! You need a [[budget]]. Write down your income and don’t spend more than you [[earn]]."],["Adam","But that’s the problem — my expenses are bigger than my [[income]]."],["Mum","Then maybe you should work a few more [[hours]] at the shop."],["Adam","Mum! I already work fifteen hours a [[week]]!"],["Mum","All right, calm down. I’ll help you this [[time]], but let’s make a plan together."]]},{t:"mcq",intro:"Main ideas, details, numbers & advice — choose the best answer:",qs:[{q:"What is Adam’s main problem?",opts:["his job","managing his money","his studies"],ans:1},{q:"How much money does Adam ask for?",opts:["two hundred dirhams","two thousand dirhams","twenty dirhams"],ans:0},{q:"How many hours a week does Adam work?",opts:["five","fifteen","fifty"],ans:1},{q:"What does his mother advise him to do?",opts:["quit his job","make a budget","drop out"],ans:1},{q:"How does Adam most likely feel at the end?",opts:["satisfied","a little frustrated","completely calm"],ans:1}]}],

  a1:[{t:"subtabs",tabs:[
   {label:"Class reading",blocks:[{t:"p",html:"<b>Read the article</b> (paragraphs are lettered A–E). Use the reading strategies as you go, then answer the questions."},{t:"passage",title:"Why We Buy: Consumerism and the Human Brain",paras:["Every day we are surrounded by things to buy. Shops, screens and streets are filled with products, and consumers are encouraged to want more of them. This way of living — always buying and using — is called consumerism.","Companies know how the human brain works, and marketing is designed around it. Bright colours, happy faces and the word “new” all catch our attention. When we see something we like, a chemical called dopamine is released, and we feel a small burst of pleasure — even before we buy.","Scarcity is another trick. When a sign says “only two left”, we are pushed to decide quickly. The fear of missing out is stronger than the wish to save, so items are bought that were never really needed.","Brands matter too. Two products can be almost identical, yet one is chosen because its brand feels trustworthy or “cool”. We are not only buying an object; we are buying an image of ourselves.","None of this makes shoppers foolish. But when we understand how marketing works, better choices are made. The smartest consumer is not the one who never buys — it is the one who knows <i>why</i> they are buying."]},{t:"mcq",intro:"Read for the main points — questions name the paragraph:",qs:[{q:"[A] What does “consumerism” mean?",opts:["a way of living based on always buying and using","saving as much money as possible","a type of shop"],ans:0},{q:"[B] Why is dopamine mentioned?",opts:["it makes products cheaper","it gives us pleasure and pulls us toward buying","it is a kind of advert"],ans:1},{q:"[C] How does “scarcity” affect shoppers?",opts:["it makes them wait","it pushes them to decide quickly","it lowers the price"],ans:1},{q:"[E] What is the writer’s main point in paragraph E?",opts:["you should never buy anything","understanding marketing helps you choose better","brands are always dishonest"],ans:1}]},{t:"match",intro:"Vocabulary in context — choose the meaning:",pairs:[["A smart <b>consumer</b> asks questions before buying.","a person who buys and uses goods"],["The two phones were nearly <b>identical</b>.","exactly the same"],["Their <b>marketing</b> targets young people.","the ways a company promotes and sells"],["A trusted <b>brand</b> can charge more.","a product name customers recognise"]]}]},
   {label:"📕 Textbook reading",blocks:[
   {t:"note",html:"<b>From your coursebook.</b> Read the article <i>Consumerism and the Human Brain</i>, then complete the two textbook activities below: <b>Activity 4</b> (gap-fill of Paragraph A) and <b>Activity 5</b> (topic &amp; main idea of each paragraph)."},
   {t:"p",html:"<b style=\"font-size:1.15rem\">Consumerism and the Human Brain</b>"},
   {t:"cloze",intro:"Activity 4 — Complete Paragraph A with the words in the word bank (one word is used twice). Then read the whole article (A–F) and press Check.",bank:["access","consume (×2)","consumers","economy","identical","items"],paras:["We are all [[consumers]]. We all buy and use products and services; that is, we [[consume]]. The word comes from the Latin <i>consumere</i>, which means “to use up, to waste or destroy”. Most of us don’t think of ourselves as wasteful or destructive, but the world [[economy]] is based on consumerism. Today, people worldwide have greater [[access]] than ever before to a huge variety of products and, often, to dozens of brands of the same product. What makes us decide to buy Brand A instead of Brand B when the two [[items]] are really [[identical]]? Why do we buy things that we don’t actually need? The answer lies in marketing – the advertising and selling of products. Successful marketers use their knowledge of psychology and, increasingly, of recent studies of the human brain to persuade us to [[consume]] more and more.","A good understanding of human weakness is essential if a company wants to sell a product. One way that advertisers persuade us to buy a product is by targeting our dissatisfaction with ourselves, our fears. Consider for a moment a typical fear – fear of being offensive to other people. Advertisers persuade us, for example, that if we don’t buy their mouthwash, we’ll have bad breath and offend other people. Dentists tell us that mouthwash is actually unnecessary; they explain that we need only simple dental hygiene – regular, correct use of a soft toothbrush and of dental floss. But we continue to spend money on mouthwash, breath freshener, and breath mints. Our fear of offending people outweighs our dentists’ logic.","In a similar way, advertisers also take advantage of our need for a good self-image, our desire to appear attractive, successful, and even exciting. One example is the recent popularity of SUVs in the United States – sport utility vehicles. These vehicles are more expensive than most cars. They use more gas and create more pollution than most cars. They take up more space than most cars. But TV commercials show them climbing rocky mountain roads and crossing rivers, which seems exciting to many people. Most people who buy an SUV never get out of the city. They spend their morning commute in traffic, not driving up and down mountains. Although it may seem irrational, advertisers persuade them that SUV owners are people with an exciting life.","With so many different (but almost identical) brands of the same product, what causes us to choose one brand instead of another? According to Dr. Alan Hirsch, our sense of smell actually influences our opinion of a product and our decision to buy it. A scientist at the Smell and Taste Treatment and Research Foundation in Chicago, Hirsch ran a careful, well-organized study. There were two identical rooms with an identical pair of sneakers in each room. There was only one difference: he sprayed one of the rooms with a scent of flowers. Volunteers entered each room and answered questions about the sneakers. The result was that 84 percent of the people preferred the sneakers in the room with the floral smell even though they were exactly the same as the ones in the other room!","There is also the effect of self-fulfilling prophecies. A self-fulfilling prophecy is a situation in which people cause a prediction to come true. (For example, a teacher tells a class that they are especially intelligent, and that semester the class does especially well on exams.) In marketing, a successful advertisement persuades consumers that a product works well; their belief causes them to use the product in such a way that it does work well. For example, the ads for Brand X of a diet pill say, “Take this pill, and you will lose weight because you won’t be hungry.” So people buy Brand X. Because they believe it will cause weight loss, they begin to eat less. They establish a new habit of eating less. The result? They lose weight. Is this because of the pill or because they are eating less?","Most of us like to think that we are reasonable, independent thinkers. We like to believe that we have a good reason for our choices. We don’t want to buy products because of some strange compulsion – some irrational desire that we can’t control. The truth is, however, that with their increasing knowledge of what goes on in the human brain, marketers might have more power over us than we realize."]},
   {t:"tmi",intro:"Activity 5 — Read the whole article again. Write the topic and the main idea of each paragraph, then compare with the suggested answers.",rows:[
     {p:"Paragraph A",topic:"What consumerism is",idea:"We are all consumers, and marketing / brain science explains why we buy."},
     {p:"Paragraph B",topic:"Fear (mouthwash)",idea:"Advertisers exploit our fears to sell things we don’t really need."},
     {p:"Paragraph C",topic:"Self-image (SUVs)",idea:"Advertisers appeal to our desire to seem attractive and exciting."},
     {p:"Paragraph D",topic:"Sense of smell (Hirsch’s study)",idea:"Smell influences our opinion of a product and our decision to buy."},
     {p:"Paragraph E",topic:"Self-fulfilling prophecy (diet pill)",idea:"Believing a product works can make it actually work."},
     {p:"Paragraph F",topic:"Conclusion",idea:"Marketers may have more power over us than we realize."}
   ]}

 ]}],
  a2:[{t:"p",html:"<b>Viewing & analysis.</b> Now “read” an advertisement the way you read the article — look for the technique behind it."},{t:"video",id:"0Dz3Psj3pV4",query:"how advertising manipulates the brain short",caption:"Watch this clip about advertising and the brain, then identify the techniques below."},{t:"mcq",intro:"Which persuasion technique is used?",qs:[{q:"“Only 3 left in stock — order now!”",opts:["scarcity / fear of missing out","celebrity image","low price"],ans:0},{q:"A famous athlete wears the shoes in the advert.",opts:["scarcity","brand image / role model","information only"],ans:1},{q:"“Join 2 million happy customers!”",opts:["everyone-is-doing-it (social proof)","scarcity","a discount"],ans:0}]},{t:"reflect",items:["Describe one advert you know and the technique it uses.","Rewrite this sentence in the present simple passive: “Companies design adverts for the brain.” → “Adverts ____.”"]}],
  culture:[{t:"p",html:"<b>UAE–World Connection.</b> The UAE is a global shopping hub, from giant malls to shopping festivals. Being a <i>critical</i> consumer — comparing, questioning and buying with purpose — is a life skill valued in the National Education Charter’s focus on critical thinking."},{t:"prompts",items:["Name one way you could shop more thoughtfully this month.","Do sales and festivals help shoppers, sellers, or both? Explain."]}],

 "l34":{

     ["prevent","to stop something from happening","verb","Exercise can help …… illness."]
   ]}],
   a1:[{t:"p",html:"<b>Read the article</b> (paragraphs are lettered A–E). Use the reading strategies as you go, then answer the questions."},{t:"passage",title:"What’s the Secret?",paras:[
     "Several places around the world are famous for their inhabitants’ very long lives. These places are usually high in the mountains, far from busy modern cities. Doctors and scientists travel to them hoping to discover the secret of such remarkable longevity.",
     "One is Hunza, high in the Himalayan Mountains of Asia, where many people over 100 are still healthy. Scientists point to three main advantages: a clean, unpolluted environment with fresh air and water; a simple diet high in vitamins and fibre but low in fat, sugar and chemicals; and hard physical work in the fields.",
     "The Caucasus Mountains in Russia are also known for longevity, and some inhabitants are said to have lived well beyond 100. People there are almost never sick, and many keep their own teeth, a full head of hair and good eyesight into old age.",
     "In Vilcabamba in Ecuador, and on the Greek island of Ikaria, the story is similar — high, unpolluted places with clean mountain water, a moderate climate and natural food. The islanders eat a Mediterranean diet of vegetables, olive oil and honey, sleep more than eight hours, and spend much of the day outdoors.",
     "The diets of these regions differ, but they share three things: the food is natural, with no preservatives or chemicals; people use traditional remedies to prevent and cure illness; and they eat far fewer calories than city people. Their active, low-stress lives may be the real secret — though some scientists argue the great ages cannot be proven, because official birth records are missing."
   ]},{t:"mcq",intro:"Read for the main points — questions name the paragraph:",qs:[{q:"[A] Where are these long-lived places usually found?",opts:["high in the mountains, far from cities","in the centre of big cities","by the sea"],ans:0},{q:"[B] What are Hunza’s three main advantages?",opts:["a clean environment, a simple diet and physical work","cars, shops and money","medicine, doctors and hospitals"],ans:0},{q:"[E] What do the four regions share?",opts:["natural food, traditional remedies and fewer calories","fast food and little exercise","the same language"],ans:0},{q:"[E] Why do some scientists doubt the claims?",opts:["official birth records are missing","the people look young","the food is expensive"],ans:0}]},{t:"match",intro:"Vocabulary in context — choose the meaning:",pairs:[["The village’s <b>inhabitants</b> are very old.","the people who live in a place"],["Scientists study <b>longevity</b>.","long life"],["Hunza is at a high <b>altitude</b>.","height above sea level"],["The air is clean and <b>unpolluted</b>.","not dirty or contaminated"],["Natural food has no <b>preservatives</b>.","chemicals added to keep food fresh"]]}],
   a2:[{t:"p",html:"<b>Getting meaning from context (SLO 4.1).</b> Use the words around a new word — and its word parts — to work out its meaning."},{t:"mcq",intro:"Choose the meaning that fits the text:",qs:[{q:"In this article, <b>longevity</b> means…",opts:["many years between birth and death","old people in the mountains","a hundred different ages"],ans:0},{q:"<b>Altitude</b> means…",opts:["vertical distance above sea level","dying at an early age","a healthy diet"],ans:0},{q:"An <b>environment</b> is…",opts:["the conditions of a place that influence people","a type of medicine","a mountain village"],ans:0}]},{t:"match",intro:"Word parts — match each word to its meaning using the prefix or suffix:",pairs:[["<b>un</b>polluted","not polluted"],["long-<b>lived</b>","living for a long time"],["<b>pre</b>vent","to stop before it happens"],["inhabit<b>ants</b>","people who inhabit a place"]]},{t:"reflect",items:["Write the main idea of the article in one sentence.","Write one habit from these regions that you could try yourself."]}],
   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Around the world, communities famous for long life share simple habits: natural food, daily movement, and strong social ties. The UAE promotes healthy living and family connection as part of national wellbeing."},{t:"prompts",items:["Which ‘secret’ from the text would be easiest to follow in a city? Why?","How do family and friends help people stay healthy?"]}],
   enrich:[{t:"p",html:"<b>Reading strategies.</b> Good readers guess, question and connect."},{t:"mcq",intro:"Choose the best reading strategy:",qs:[{q:"You meet an unknown word. First you should…",opts:["stop reading","guess from the words around it","skip the whole text"],ans:1},{q:"To find the main idea of a paragraph, look at…",opts:["only the last word","the topic and repeated ideas","the page number"],ans:1}]},{t:"reflect",items:["Write one new word you learned and its meaning.","Write one question you still have about longevity."]}],
   exit:[{t:"reflect",items:["Write one main point from today’s text.","Write one new word and what it means.","(KWL “L”) Write one thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel finding the main points of a longer text?"}]

 "l78":{

     ["attitude","the way you think or feel about something","noun","A positive …… helps recovery."],
     ["fraudulent","dishonest and illegal; intended to deceive","adjective","The …… advert promised a miracle cure."]
   ]}],
   a1:[{t:"p",html:"<b>Before you write.</b> Today’s reading, <i>“Can you Trust the Internet for Medical Advice?”</i>, asks whether online health information is reliable. Study the grammar and vocabulary, then summarise its ideas in your own words."},{t:"note",html:"<b>Grammar — present simple passive (G.10.1):</b> use <i>am / is / are + past participle</i> when the action matters more than who does it.<br>“Information <b>is shared</b> on many websites.” · “Patients <b>are helped</b> to understand their symptoms.”"},{t:"mcq",intro:"Choose the correct passive form:",qs:[{q:"Health advice ____ on thousands of websites.",opts:["is shared","shares","sharing"],ans:0},{q:"Worried people ____ by dishonest sellers.",opts:["are taken advantage of","take advantage","takes advantage"],ans:0},{q:"A good remedy ____ by real doctors.",opts:["is recommended","recommends","recommend"],ans:0},{q:"The validity of a website ____ before you trust it.",opts:["should be checked","checks","checking"],ans:0}]},{t:"match",intro:"Vocabulary — match each word with the definition (as in the text):",pairs:[["<b>accurate</b>","correct, without any mistakes"],["<b>dishonest</b>","not true"],["<b>patient</b>","someone who is receiving medical treatment"],["<b>remedy</b>","a solution or treatment to an illness"],["<b>take advantage of</b>","to make good use of the opportunities offered by something"],["<b>validity</b>","being true or acceptable"]]}],
   a2:[{t:"writemodel",task:"Using a mind map (Benefits vs Dangers), write one paragraph that summarises the benefits and dangers of medical advice on the internet. Use the present simple passive at least twice, and end with your opinion: can we expect real solutions to serious problems online?",plan:["Topic sentence — the internet and health information","Benefits branch — how it helps people (use a passive)","Dangers branch — the risks (use a passive)","Closing — your opinion, with a reason"],model:{topic:"On the internet, a huge amount of medical information is shared, and it brings both benefits and dangers.",r1:"On the benefits side, people’s attitudes about healthcare are changed as patients do their own research, and better medical decisions can be made when information is written in clear language.",r2:"On the dangers side, the information is not always accurate, and worried readers are misled by fraudulent claims that are created only to increase sales.",close:"In my view, the internet is a useful tool, but real solutions to serious problems should still be found with a real doctor."}}],
   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Artificial intelligence now answers health questions in seconds, and the UAE is a world leader in using AI wisely. Mastering AI means using it as a helpful tool while still checking facts and thinking for yourself."},{t:"prompts",items:["How can AI help a patient — and how could it mislead one?","Who should you trust for a serious health problem, and why?"]}],
   enrich:[{t:"p",html:"<b>More passive practice.</b>"},{t:"mcq",intro:"Rewrite in the present simple passive — choose the best option:",qs:[{q:"“Doctors write prescriptions.” →",opts:["Prescriptions are written by doctors.","Prescriptions write doctors.","Doctors is written."],ans:0},{q:"“Websites promote false cures.” →",opts:["False cures are promoted by websites.","False cures promote websites.","Websites are promote."],ans:0}]},{t:"reflect",items:["Write one sentence in the present simple passive about the internet.","Write one way to check if a website is honest."]}],
   exit:[{t:"reflect",items:["Write your topic sentence from today.","Name one benefit and one danger of online medical advice.","(KWL “L”) One thing you learned about writing a summary."]},{t:"rating",label:"How confident do you feel writing a clear, organised paragraph?"}]

   a1:[{t:"subtabs",tabs:[
     {label:"Abridged reading",blocks:[{t:"note",html:"<b>Abridged version.</b> A shorter, simpler retelling of the article — read this first if the full text feels hard."},{t:"passage",title:"The Human Brain (abridged)",paras:["The brain has an “old” part that controls basic needs like breathing and sleeping, and a “new” part, unique to humans, for complex thinking. The thinking part, the cerebrum, has two halves called hemispheres, joined by a bridge called the corpus callosum.","People used to say you were either “left-brained” (logical) or “right-brained” (creative). New research shows this is a myth: the two halves work together all the time. Solving a maths problem or making art needs both logic and creativity.","Memory can trick us. In the 1980s, some adults suddenly “remembered” events from childhood, and over 700 court cases were based on these memories. Later studies suggested many were false — even a small suggestion can create a memory of something that never happened.","The teenage brain is still developing. The corpus callosum keeps growing into a person’s twenties, so teenagers may not yet be as self-aware as adults, and they read emotions on faces less easily.","Can we change our brain? Studies say yes. Smoking and “infomania” (too much information from phones and messages) can lower intelligence, but meditation seems to improve memory, learning and concentration — training the mind like exercise trains the body."]}]},
     {label:"📕 Textbook reading",blocks:[
       {t:"note",html:"<b>From your coursebook — identical to the curriculum.</b> Read the full article (A–H), then do <b>Activity 7</b> (facts vs assumptions) and <b>Activity 8</b> (coursebook exercise)."},
       {t:"passage",title:"The Human Brain — New Discoveries",paras:["<span class='rhead'>New Discoveries</span><br>Most of us learn basic facts about the human brain in our middle or high school biology classes. We study the subcortex, the “old brain,” which is found in the brains of most animals and is responsible for basic functions such as breathing, eating, drinking, and sleeping. We learn about the neocortex, the “new brain,” which is unique to humans and is where complex brain activity takes place. We find that the cerebrum, which is responsible for all active thought, is divided into two parts, or hemispheres. The left hemisphere, generally, manages the right side of the body; it is responsible for logical thinking. The right hemisphere manages the left side of the body; this hemisphere controls emotional, creative, and artistic functions. And we learn that the corpus callosum is the “bridge” that connects the two hemispheres. Memorizing the names for parts of the brain might not seem thrilling to many students, but new discoveries in brain function are exciting. Recent research is shedding light on creativity, memory, maturity, gender, and the possibility of changing the brain.","<span class='rhead'>Left Brain / Right Brain: Truth or Myth?</span><br>Scientists agree that the left hemisphere of the brain specializes in different areas or skills than the right hemisphere. Up until recently, many believed that people were either left-brained (in other words, more logical) or right-brained (in other words, more creative) depending on which hemisphere they used most. However, new research suggests that this is a myth and that dividing creativity and logic into the right and left hemispheres is a simple way of looking at the human brain, as well as the things a person can do. Rather than being separated, the two hemispheres continually collaborate. Being able to solve a mathematical equation requires both logic and creativity. So does producing a work of art. Therefore, scientists are now theorizing that any type of activity requires the use of different parts of the brain both in the left hemisphere and the right. The confusion was probably caused in the 1940s when doctors would surgically separate the two hemispheres in patients suffering from seizures. After such an operation, the patient’s brain seemed to function normally, but there were disruptions in perception and cognition which proved that the left and right hemispheres were different.","<span class='rhead'>Memory: True or False?</span><br>In the 1980s in the United States, there were many cases of adults who suddenly remembered, with the help of a psychologist, things that had happened to them in childhood. These memories had been repressed – held back – for many years. Some of these newly discovered memories have sent people to prison. As people remember crimes that they saw or experienced as children, the police have reopened and investigated old criminal cases. In fact, over 700 cases have been filed that are based on these repressed memories.","However, studies in the 1990s suggested that many of these might be false memories. At a 1994 conference at Harvard Medical School, neuroscientists discussed how memory is believed to work. It is known that small pieces of a memory (sound, sight, feeling, and so on) are kept in different parts of the brain; the limbic system, in the middle of the brain, pulls these pieces together into one complete memory. But it’s certain that people can “remember” things that have never happened. Even a small suggestion can leave a piece of memory in the brain. Most frightening, according to Dr. Michael Nash of the University of Tennessee, is that “there may be no structural difference” in the brain between a false memory and a true one.","<span class='rhead'>The Teen Brain</span><br>Parents of teenagers have always known that there is something, well, different about the teen years. Some parents claim that their teenage children belong to a different species. Until recently, neuroscience did not support this belief. The traditional belief was that by the time a child was eight to twelve, the brain was completely mature. However, very recent studies provide evidence that the brain of a teenager differs from that of both children and adults. According to Jay Giedd of the National Institute of Mental Health, “Maturation does not stop at age ten, but continues into the teen years” and beyond. In fact, Giedd and his colleagues found that the corpus callosum “continues growing into your 20s.” Because, it is believed, the corpus callosum is involved in self-awareness and intelligence, the new studies imply that teens may not be as fully self-aware or as intelligent as they will be later. Other researchers, at McLean Hospital in Massachusetts, have found that teenagers are not as able (as adults are) to “read” emotions on people’s faces.","<span class='rhead'>Male versus Female Brain?</span><br>Watch a group of children as they play. You’ll probably notice that the boys and girls play differently, speak differently, and are interested in different things. Of course, there are gender differences but do they really determine the way male and female brains work? As with the left-brain and right-brain theory, scientists in the past studied the origins of these differences and proposed the theory of male versus female brain. Some of their arguments were interesting. For example, they suggested that men were better at reading maps and fixing stuff, whereas women were better at multitasking, using their intuition, or reading the emotions of people in photographs. After further research, however, some scientists don’t agree with the male–female distinction of brains. They believe that our brains are “plastic” and can change in many different ways throughout our lives despite our gender. Although the debate over male and female brains continues, it seems that they are more alike than we used to think.","<span class='rhead'>A Change of Mind?</span><br>We all know the expression “to change your mind”. But is it possible literally to change your mind – or, to be more precise, to change your brain? Reports from 2005 say yes. First, the bad news, at least for smokers: a study from the University of Aberdeen and the University of Edinburgh, in Scotland, concludes that smoking makes people less intelligent. On cognitive tests (that is, tests that involve judgment), smokers did significantly worse than non-smokers. The theory is that toxins – poisons – in the smoke enter the blood and damage blood vessels providing the brain with oxygen. And there is more bad news, for most of us: a study from the University of London says that “infomania” – the constant flood of information from cell phones, emails, and text messaging – can reduce intelligence by ten points on an IQ test.","However, there is also good news: meditation seems to change the “wiring” in the brain in several positive ways. In a study that compared the brains of eight lifelong Buddhist meditators who work with the Dalai Lama with the brains of beginner meditators, scientists discovered that there were significant differences. The expert meditators had higher levels of gamma brain waves, which improve memory, learning, and concentration. Meditation appears to do for the brain what physical training does for the body. The researcher Richard Davidson said, “The trained mind, or brain, is physically different from the untrained one.” Perhaps we should consider going into training."]},

/* stable, seeded scramble so dropdown options don't mirror the answer key,
   yet stay in the same order across re-renders (keeps saved answers valid) */
function scrambleOpts(base, seedStr){
  var s=2166136261; for(var i=0;i<seedStr.length;i++){ s^=seedStr.charCodeAt(i); s=Math.imul(s,16777619); }
  s=s>>>0; var a=base.slice();
  for(var k=a.length-1;k>0;k--){ s=(Math.imul(s,1664525)+1013904223)>>>0; var j=s%(k+1); var t=a[k];a[k]=a[j];a[j]=t; }
  if(a.length>1 && a.join('\u0001')===base.join('\u0001')){ a.push(a.shift()); } // never leave it in original order
  return a;
}

function grade(btn){
 var box=btn.parentNode, els=box.querySelectorAll('.A'), right=0,tot=0,done=true,keys=[];
 Array.prototype.forEach.call(els,function(el){ tot++; var a=el.getAttribute('data-a')||''; var ok;
   if(el.tagName==='SELECT'){ if(el.value==='')done=false; ok=(el.value!==''&&el.value===a); el.style.borderColor=ok?'var(--good)':(el.value===''?'var(--line)':'var(--bad)'); var o=el.querySelector('option[value="'+a+'"]'); keys.push('<li>'+esc(o?o.textContent:a)+'</li>'); }
   else { var v=(el.value||'').trim().toLowerCase(); if(!v)done=false; ok=(v===a); el.style.borderBottomColor=ok?'var(--good)':(v===''?'var(--blue)':'var(--bad)'); keys.push('<li>'+esc(a)+'</li>'); }
   if(ok)right++; });

}

/* ---- Visual pop-up ---- */
function openVisual(){ var c=document.getElementById("visualCard"); if(!c)return;
  c.innerHTML='<div class="dict-hd"><h3>🧠 The Human Brain</h3><button class="dict-x" onclick="closeVisual()">✕</button></div>'
   +'<img class="visual-img" alt="Diagram of the human brain and its lobes" src="'+BRAIN_IMG+'">'
   +'<p class="visual-cap">Before you read — look at the brain and the four activities around it (music, art, maths, sport). With a partner, say which part of the brain each activity might use, and predict what the reading will be about.</p>';
  document.getElementById("visualOv").classList.add("open"); }
function closeVisual(){ document.getElementById("visualOv").classList.remove("open"); }
/* ---- Facts vs Assumptions (interactive) ---- */
function faPick(btn,uid,i,v){ var st=FA[uid]; if(!st||st.done) return; st.picks[i]=v;
  var card=document.getElementById(uid+"_c"+i); card.querySelectorAll(".fa-choice").forEach(function(b){b.classList.remove("sel");}); btn.classList.add("sel");
  var done=Object.keys(st.picks).length, tot=st.items.length;
  document.getElementById(uid+"_score").textContent=done+" / "+tot+" answered";
  var sb=document.getElementById(uid+"_submit"); if(sb) sb.disabled=(done<tot); }
function faSubmit(uid){ var st=FA[uid]; if(!st||st.done) return; st.done=true; var correct=0;
  st.items.forEach(function(it,i){ var card=document.getElementById(uid+"_c"+i); var ok=st.picks[i]===it.ans; if(ok)correct++;
    card.classList.add(ok?"fa-ok":"fa-no");
    card.querySelectorAll(".fa-choice").forEach(function(ch){ ch.style.pointerEvents="none";
      var v=ch.textContent.trim().toLowerCase()==="fact"?"fact":"assumption";
      if(v===it.ans) ch.classList.add(it.ans==="fact"?"right":"rightA");
      if(st.picks[i]===v && !ok) ch.classList.add("badpick"); });
    var fb=document.getElementById(uid+"_fb"+i); fb.className="fa-fb show "+(it.ans==="fact"?"f":"a");
    fb.innerHTML='<b>'+(it.ans==="fact"?"FACT":"ASSUMPTION")+' — signal: <i>'+esc(it.cue)+'</i></b>'+esc(it.why); });
  document.getElementById(uid+"_score").textContent="Score: "+correct+" / "+st.items.length;
  var sb=document.getElementById(uid+"_submit"); if(sb){ sb.textContent="Try again"; sb.disabled=false; sb.onclick=function(){ faReset(uid); }; } }
function faReset(uid){ var st=FA[uid]; if(!st)return; st.done=false; st.picks={};
  st.items.forEach(function(it,i){ var card=document.getElementById(uid+"_c"+i); card.className="fa-card"; card.id=uid+"_c"+i;
    card.querySelectorAll(".fa-choice").forEach(function(ch){ ch.className="fa-choice"; ch.style.pointerEvents=""; });
    document.getElementById(uid+"_fb"+i).className="fa-fb"; });
  document.getElementById(uid+"_score").textContent="0 / "+st.items.length+" answered";
  var sb=document.getElementById(uid+"_submit"); sb.textContent="Submit"; sb.disabled=true; sb.onclick=function(){ faSubmit(uid); }; }
function keyEntries(){
  // key vocabulary for THIS lesson, from its vocab list: [word, def, pos, example]
  var v=currentVocab(); return v.map(function(x){
    var ex=(x[3]||'').replace(/\u2026+/g, x[0]);   // fill the "……" blank with the word
    return {w:x[0], def:x[1]||'', pos:x[2]||'', ex:ex};
  });
}
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function keyRegex(keys){
  if(!keys||!keys.length) return null;
  var alt=keys.map(function(k){return reEsc(k.w);}).sort(function(a,b){return b.length-a.length;}).join('|');
  return new RegExp('\\b('+alt+')(s|es)?\\b','gi');
}
function boldKeys(text, re){ return re ? text.replace(re, function(m){ return '<b class="kw" data-kw="1">'+m+'</b>'; }) : text; }
/* render a paragraph: [[gaps]] -> inputs, key words -> bold, tags preserved */
function renderReadingPara(p, re, withGaps){
  var out='', last=0, m, rx=/\[\[(.+?)\]\]|(<[^>]+>)/g;
  while((m=rx.exec(p))){
    out += boldKeys(p.slice(last,m.index), re);
    if(m[1]!=null){ var w=m[1]; out += withGaps
        ? '<input class="A gap" data-a="'+esc(w.toLowerCase())+'" autocomplete="off" style="width:'+Math.max(90,w.length*13)+'px" />'
        : esc(w); }
    else out += m[2];              // keep inline tag (<i>, <b>…)
    last=rx.lastIndex;
  }
  out += boldKeys(p.slice(last), re);
  return out;
}
function glossaryHTML(keys){
  if(!keys||!keys.length) return '';
  return '<div class="glossary"><h3>🔤 Word list — key vocabulary in this text</h3>'
    +'<p class="gl-hint">Tap 🔊 to hear a word, or <b>＋ Bank</b> to save it to your Vocabulary Log. Then take the Spelling Bee in the reader bar above.</p>'
    +keys.map(function(k){ var jw=esc(k.w).replace(/'/g,"\\'"); return '<div class="gl-row">'
      +'<div class="gl-body"><span class="gl-w" onclick="openDict(\''+jw+'\')">'+esc(k.w)+'</span>'
      +(k.pos?'<span class="gl-pos">'+esc(k.pos)+'</span>':'')
      +'<div class="gl-def">'+esc(k.def)+'</div>'
      +(k.ex?'<div class="gl-ex">\u201c'+esc(k.ex)+'\u201d</div>':'')
      +'</div>'
      +'<div class="gl-actions"><button class="gl-ico" title="Hear it" onclick="sayWord(\''+jw+'\')">🔊</button>'
      +'<button class="gl-bank" onclick="bankWord(\''+jw+'\',this)">＋ Bank</button></div>'
      +'</div>'; }).join('')
    +'</div>';
}
/* ---- Vocabulary Log (saved words) ---- */
function vocabLog(){ try{ return JSON.parse(localStorage.getItem('ican_vocab_log')||'[]'); }catch(e){ return []; } }
function saveVocabLog(a){ try{ localStorage.setItem('ican_vocab_log', JSON.stringify(a)); }catch(e){} }
function bankWord(w, btn){
  var log=vocabLog(); if(log.indexOf(w)<0){ log.push(w); saveVocabLog(log); }
  if(btn){ btn.textContent='✓ Banked'; btn.classList.add('on'); btn.disabled=true; }
}
function readToolbar(id){
  return ''
  +'<div class="rtoolbar" data-art="'+id+'">'
  +  '<div class="rt-line">'

function cleanWord(w){ return (w||'').toLowerCase().replace(/[^a-z’'-]/g,'').replace(/^[’'-]+|[’'-]+$/g,''); }
function wordClick(ev){
  if(ev.target && ev.target.tagName==='INPUT') return;      /* don't hijack gap inputs */
  var art=ev.currentTarget;
  if(art && art.classList.contains('hl-on')){ return hlSelection(art); }  /* highlighter mode */
  if(!RSET.dict) return;                                    /* dictionary toggle off */
  var sel=(window.getSelection&&String(window.getSelection())) || '';

  var w=cleanWord(raw); if(!w) return;
  openDict(w);
}
function wordAtPoint(ev){
  try{
    var range=null;
    if(document.caretRangeFromPoint) range=document.caretRangeFromPoint(ev.clientX,ev.clientY);
    else if(document.caretPositionFromPoint){ var pos=document.caretPositionFromPoint(ev.clientX,ev.clientY); if(pos){ range=document.createRange(); range.setStart(pos.offsetNode,pos.offset); range.collapse(true); } }
    if(range && range.startContainer && range.startContainer.nodeType===3){
      var text=range.startContainer.textContent, o=range.startOffset, l=o, r=o, re=/[A-Za-z\u2019'\-]/;
      while(l>0 && re.test(text[l-1])) l--; while(r<text.length && re.test(text[r])) r++;
      if(r>l) return text.slice(l,r);
    }
  }catch(e){}
  var t=ev.target; if(!t) return ''; var txt=t.textContent||''; return txt.split(/\s+/).length===1 ? txt : '';
}
function hlSelection(art){
  try{ var sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return;
    var r=sel.getRangeAt(0); if(!art.contains(r.commonAncestorContainer)) return;
    var span=document.createElement('span'); span.className='usermark';
    try{ r.surroundContents(span); }catch(e){ /* spans multiple nodes: wrap extracted */ span.appendChild(r.extractContents()); r.insertNode(span); }
    sel.removeAllRanges();
  }catch(e){}
}

   +'<div style="text-align:center;padding:12px 0 4px"><div style="font-size:2.6rem">'+(pass?'🏅':'📚')+'</div>'
   +'<div style="font-size:1.4rem;font-weight:800;margin-top:4px">'+BEE.score+' / '+total+' correct ('+pct+'%)</div>'
   +'<p style="color:var(--muted);margin:8px 0 0">'+(pass?'Great spelling! You reached the certificate mark for this word list.':'Keep practising — score 60% or more to earn the certificate.')+'</p></div>'
   +'<div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn" onclick="openBee()">↻ Try again</button><button class="btn pri" onclick="closeBee()">Done</button></div>';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&BEE) closeBee(); });

/* ---------------- state persistence (per session) ---------------- */
function fields(){ return document.querySelectorAll('#body textarea, #body select, #body input, #body .rate'); }
function keyOf(){ return CUR.cls+'|'+CUR.id+'|'+CUR.stage; }
function saveState(){ if(!CUR.id) return; var arr=[]; Array.prototype.forEach.call(fields(),function(el){ arr.push((el.className||'').indexOf('rate')>=0 ? (el.getAttribute('data-r')||'') : el.value); }); LSTATE[keyOf()]=arr; }
function restoreState(){ var s=LSTATE[keyOf()]; if(!s) return; Array.prototype.forEach.call(fields(),function(el,i){ if(s[i]==null) return; if((el.className||'').indexOf('rate')>=0){ var r=parseInt(s[i],10)||0; paintStars(el,r); } else el.value=s[i]; }); }

/* ---------------- timer ---------------- */
var TM={sec:0,run:false,iv:null};
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function paint(label){var tv=document.getElementById('tv'),tl=document.getElementById('tl'),t=document.getElementById('timer'); if(tv)tv.textContent=fmt(TM.sec); if(tl&&label!=null)tl.textContent=label; if(t)t.style.background=(TM.sec<=0?'var(--red)':(TM.run?'var(--teal)':'#1a2238'));}
function setTimer(mins){ if(TM.iv){clearInterval(TM.iv);TM.iv=null;} TM.run=false; TM.sec=Math.round((mins||5)*60); paint('TAP TO START'); }
function startTimer(){ if(TM.sec<=0)return; TM.run=true; if(TM.iv)clearInterval(TM.iv); TM.iv=setInterval(function(){ TM.sec--; if(TM.sec<=0){TM.sec=0;TM.run=false;clearInterval(TM.iv);TM.iv=null;paint("TIME'S UP");return;} paint('COUNTING DOWN'); },1000); paint('COUNTING DOWN'); }
function stopTimer(){ TM.run=false; if(TM.iv){clearInterval(TM.iv);TM.iv=null;} }
function timerToggle(){ if(TM.run){ TM.run=false; if(TM.iv){clearInterval(TM.iv);TM.iv=null;} paint('PAUSED — TAP TO RESUME'); } else startTimer(); }

renderClasses();
</script>
