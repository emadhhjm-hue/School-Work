   a1:[{t:"p",html:"<b>Reading — “Ready to Move to College?”</b> Read the article below (paragraphs are lettered A–E). Use the toolbar to have it <b>read to you</b>, tap any word for its meaning, then do the heading-matching task under <b>Activity 4</b>."},{t:"passage",title:"Ready to Move to College?",paras:[
     "Before college, most young people around the world live in a family home. Their first living experience away from home may be in a dormitory or residence hall at an “institution of higher ed (education).” One definition of dorm is “a building with rooms for residents, usually with common bathroom facilities and recreation areas.” In many ways, college dormitories are like other kinds of shared housing, like co-ops (cooperatives), international houses, apartment rentals, or private homes. Both on campus and in the larger community, shared-living accommodations vary in size: number of occupants, cost, facilities, amenities, and other features. Residents without their own rooms may have to share space with one or two roommates. But even occupants with private single rooms have to relate to people of various lifestyles and habits in the same building or area. In fact, some institutions define dormitory as “a shared living and learning community on a college or university campus.” That’s because the main advantage of any kind of communal living is the “higher learning” of getting along with others.",
     "The occupants of residence halls or other kinds of shared-living accommodations can differ greatly. On some campuses, first-year students have to live in dormitories, so most dorm residents are of similar ages. In “special-interest housing,” building residents may have the same major (area of study), lifestyle, or cultural background. Even so, they will have a variety of interests, experiences, habits, personalities, attitudes, and preferences. Survival means “getting through the experience without harm.” So what is most important for survival in shared-living situations? It’s good relationships! For “higher learning” at colleges or universities, or in the larger community, not only students but also other adults need to relate to one or more roommates, residents on the same floor, or occupants of the same building or area.",
     "What are some possible challenges of living with others? What if there’s not enough space, privacy, quiet, cleanliness, healthy living, or security? What about disagreements over food shopping or house cleaning? Without solutions, such differences can grow to big problems for young people away from home and family for the first time. They may be happy about their new independence, but the challenges of transition to community living with strangers can be difficult.",
     "How can we make sure we all get along well together? People with experience in living with others give this advice. 1. It’s most important to get along with the other residents of the same room, floor, building, or area. Be considerate and pleasant. You may not become close friends, but don’t be enemies! 2. Next in importance to surviving communal-living situations is to stay out of trouble. Be direct and honest (not shy) about your own needs and values. Do you want to stay healthy? To stay out of harmful situations? To study and learn well? 3. And finally, participate in shared living! Create house rules and follow them. Attend meetings and other educational events. Stay informed, and get to know good people! If you’re true to your own values, you’ll “survive” nearly any kind of new living experience. And it may even become one of the best memories of your life!",
     "For some people, their first experience away from home and family is in a shared-living situation at a college or university. Other adults may need or want to live communally later in life. People are different, of course, so it’s very important to get along with roommates, housemates, and others in the same area or community. Following rules, staying out of trouble, and participating are good ways to meet the possible challenges of residential living."
   ]},{t:"note",html:"<b>Activity 4 (While Reading) — Paragraphs &amp; Headings.</b> Match the paragraphs A–E with the headings. Do you think this will guide you to the main idea of each paragraph?"},{t:"match",intro:"Match each heading to its paragraph (A–E):",pairs:[
     ["Introduction and Definitions","Paragraph A"],
     ["The Residents of Campus Housing","Paragraph B"],
     ["Some Challenges of Communal Living","Paragraph C"],
     ["How to Survive Living with Others","Paragraph D"],
     ["Conclusion and Summary","Paragraph E"]
   ]},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Show answers &amp; clues (teacher / self-check)</summary><div style=\"margin-top:8px;line-height:1.7\"><b>A → Introduction and Definitions.</b> Clue: it defines “dorm” and other shared homes and names the main advantage — getting along with others.<br><b>B → The Residents of Campus Housing.</b> Clue: “The occupants… can differ greatly,” ages, majors, backgrounds.<br><b>C → Some Challenges of Communal Living.</b> Clue: the questions about space, privacy, quiet, cleanliness, disagreements.<br><b>D → How to Survive Living with Others.</b> Clue: the numbered pieces of advice (get along, stay out of trouble, participate).<br><b>E → Conclusion and Summary.</b> Clue: “For some people…,” and the closing summary of following rules, staying out of trouble and participating.<br><i>Tip:</i> the heading matches the sentence that carries the paragraph’s <b>main idea</b> — often the first or last sentence.</div></details>"}],
   a2:[{t:"p",html:"<b>Activity 6 — Main ideas.</b> Do the task, then open the dropdown to check your answers and the clues."},{t:"subtabs",tabs:[
     {label:"Act 6 · Main ideas",blocks:[
       {t:"note",html:"<b>6. Reading</b> — Read the following main ideas for the five paragraphs in the article in Activity 4. Match each main idea with its related paragraph. Write the letter of the paragraph on the line after the number, then use the dropdown below to match on-screen and check."},
       {t:"note",html:"<div style=\"line-height:1.9\">1. ______ For young people away from home for the first time, some features of shared living situations can make college life especially difficult.<br>2. ______ Even if the occupants of a residence hall and other communal-living accommodations are very different from one another, they need positive relationships.<br>3. ______ Many students’ first living experience away from home and family is in a dorm or shared-living community, sometimes with students studying on the same course.<br>4. ______ Probably the best ways to “survive” a college or other shared-living experience are to get along with others, to stay out of trouble, and to take part in educational events.<br>5. ______ In conclusion, difficult or challenging residential-living situations with others can become positive, memorable experiences if people follow good advice.</div>"},
       {t:"match",intro:"Match each main idea (1–5) to its paragraph (A–E):",pairs:[
         ["1. Some features can make college life especially difficult for those away from home for the first time.","Paragraph C"],
         ["2. Very different occupants still need positive relationships.","Paragraph B"],
         ["3. Many students’ first experience away from home is in a dorm or shared-living community.","Paragraph A"],

         ["5. In conclusion, challenging living situations can become positive, memorable experiences with good advice.","Paragraph E"]
       ]},
       {t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Answer key &amp; clues</summary><div style=\"margin-top:8px;line-height:1.7\"><b>1 → C</b> (the challenges of communal living — space, privacy, disagreements) · <b>2 → B</b> (occupants differ greatly, yet good relationships matter most) · <b>3 → A</b> (the introduction — first living experience in a dorm) · <b>4 → D</b> (the advice: get along, stay out of trouble, participate) · <b>5 → E</b> (the conclusion/summary).<br><i>How to find them:</i> match the <b>key words</b> of each main idea to the paragraph’s topic sentence — ‘especially difficult’ → challenges (C); ‘very different… positive relationships’ → residents (B); ‘first living experience’ → intro (A); ‘best ways to survive’ → advice (D); ‘in conclusion’ → summary (E).</div></details>"},
       {t:"reflect",items:["Write the overall meaning of the WHOLE article in one sentence of your own.","Write one detail from the text that supports that overall meaning."]}

   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Across the world — and in the UAE — students and families share living spaces in many ways, from extended-family homes to university dormitories and international student housing. Learning to live respectfully alongside people of different backgrounds and habits is part of cultural awareness."},{t:"prompts",items:["How does sharing a home teach patience and respect?","What would you do to be a considerate person to share a space with?"]}],

   ]}],
   a1:[{t:"p",html:"<b>Approaches to writing — plan first.</b> Good writers plan before they draft. You are going to write <b>one organised informational paragraph</b> answering: <i>What does it take to live successfully in shared accommodation?</i>"},{t:"note",html:"<b>📖 Instructions.</b> Look back at <b>Reading 1 “Ready to Move to College?” (pp. 4–9)</b> and your notes from Lesson 5-6, especially the paragraph about the best ways to ‘survive’ shared living. Use those ideas as evidence in your paragraph. The reading text is in your book; this platform gives you the planning tools and checklists."},{t:"note",html:"<b>Grammar for writing — present modals (G.8.1):</b> use these to express necessity, obligation and advice.<br><b>Necessity / obligation:</b> “You <b>must</b> respect quiet hours.” · “Roommates <b>have to</b> share the cleaning.”<br><b>Advice / recommendation:</b> “You <b>should</b> agree on rules early.” · “You <b>ought to</b> be considerate.”<br><b>No obligation:</b> “You <b>don’t have to</b> be best friends — just respectful.”"},{t:"mcq",intro:"Choose the correct modal:",qs:[{q:"To say something is necessary, use…",opts:["must / have to","might","could"],ans:0},{q:"To give friendly advice, use…",opts:["should / ought to","must not","have to"],ans:0},{q:"“You ____ make a lot of noise late at night.” (it is not allowed)",opts:["must not","don’t have to","should"],ans:0},{q:"“You ____ be best friends, but you should be polite.” (it isn’t necessary)",opts:["don’t have to","must","have to"],ans:0}]}],
   a2:[{t:"p",html:"<b>Graphic organiser — gather your ideas.</b> Complete this plan in your notebook before you draft. Turn each idea into a sentence with a modal (must / have to / should)."},{t:"note",html:"<b>Planning frame (copy &amp; complete):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th>Part of the paragraph</th><th>My notes (use a modal)</th></tr><tr><td><b>Topic sentence</b> — the main point about successful shared living</td><td>&nbsp;</td></tr><tr><td><b>Supporting idea 1</b> — an obligation (must / have to)</td><td>&nbsp;</td></tr><tr><td><b>Supporting idea 2</b> — a piece of advice (should / ought to)</td><td>&nbsp;</td></tr><tr><td><b>Supporting idea 3</b> — a benefit or an example from the reading</td><td>&nbsp;</td></tr><tr><td><b>Concluding sentence</b> — why these habits matter</td><td>&nbsp;</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Model ‘My notes’ — a completed example to guide you</summary><div style=\"margin-top:8px\"><p style=\"font-size:.86rem;color:var(--muted);margin:0 0 8px\">This is ONE way to fill the frame. Use it as a tutorial — then write your own notes with different ideas.</p><table style=\"width:100%;border-collapse:collapse\" border=\"1\"><tr style=\"background:#eef2fb\"><th style=\"padding:6px;text-align:left\">Part of the paragraph</th><th style=\"padding:6px;text-align:left\">My notes (use a modal)</th></tr><tr><td style=\"padding:6px\"><b>Topic sentence</b></td><td style=\"padding:6px\">Living successfully with others <b>depends on</b> a few simple habits everyone <b>must</b> follow.</td></tr><tr><td style=\"padding:6px\"><b>Supporting idea 1</b> (obligation)</td><td style=\"padding:6px\">Roommates <b>have to</b> share the chores and <b>must</b> respect quiet hours at night.</td></tr><tr><td style=\"padding:6px\"><b>Supporting idea 2</b> (advice)</td><td style=\"padding:6px\">You <b>should</b> respect other people’s privacy and <b>ought to</b> ask before borrowing their things.</td></tr><tr><td style=\"padding:6px\"><b>Supporting idea 3</b> (benefit / example)</td><td style=\"padding:6px\">If noise becomes a problem, you <b>should</b> talk calmly — the benefit <b>is</b> a peaceful home and new friendships.</td></tr><tr><td style=\"padding:6px\"><b>Concluding sentence</b></td><td style=\"padding:6px\">These habits <b>matter</b> because respect and responsibility <b>turn</b> a shared space into a real community.</td></tr></table></div></details>"},{t:"note",html:"<div style=\"border:2px solid var(--blue);border-radius:12px;padding:14px 16px;background:#f4f7ff\"><b>✍️ Writing prompt (write about 100 words).</b><br>Some students are moving into shared accommodation for the first time. Write an informational paragraph advising them on <b>how to live successfully with others</b>.<br><br><b>In the body, write about these THREE points:</b><ol style=\"margin:6px 0 0\"><li><b>Rules &amp; responsibilities</b> — what roommates <i>must</i> or <i>have to</i> do (e.g. share chores, respect quiet hours).</li><li><b>Being considerate</b> — advice on respecting others’ privacy and space (what you <i>should</i> / <i>ought to</i> do).</li><li><b>Handling challenges &amp; benefits</b> — one common problem and how to solve it, and one benefit of shared living.</li></ol><div style=\"margin-top:8px;font-size:.9rem;color:var(--muted)\"><b>Structure:</b> Introduction (topic sentence) → Body (the three points above, with an example) → Conclusion (why these habits matter).</div></div>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Marking rubric — how your writing is scored (out of 10)</summary><div style=\"margin-top:8px\"><table style=\"width:100%;border-collapse:collapse\" border=\"1\"><tr style=\"background:#eef2fb\"><th style=\"padding:6px\">Criterion</th><th style=\"padding:6px\">What the teacher looks for</th><th style=\"padding:6px\">Marks</th></tr><tr><td style=\"padding:6px\"><b>1. Task completion</b></td><td style=\"padding:6px\">Answers the prompt fully; covers all three body points; about 100 words.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>2. Organization</b></td><td style=\"padding:6px\">Clear paragraph/essay mode: topic sentence → body → conclusion, with transitions (first, also, however, finally).</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>3. Sentence structure</b></td><td style=\"padding:6px\">Varied, complete sentences; ideas linked clearly; no run-ons or fragments.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>4. Grammar &amp; mechanics</b></td><td style=\"padding:6px\">Correct use of present modals (must / have to / should); subject–verb agreement; word order.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>5. Spelling &amp; punctuation</b></td><td style=\"padding:6px\">Accurate spelling; capital letters, full stops and commas used correctly.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr style=\"background:#eef2fb\"><td style=\"padding:6px\" colspan=\"2\"><b>Total</b></td><td style=\"padding:6px;text-align:center\"><b>/10</b></td></tr></table></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Sample answer — colour-coded by part</summary><div style=\"margin-top:8px\"><div style=\"margin-bottom:8px;font-size:.86rem\"><span class=\"hl-topic\">Introduction / topic sentence</span> <span class=\"hl-r1\">Point 1 · rules &amp; responsibilities</span> <span class=\"hl-r2\">Point 2 · being considerate</span> <span class=\"hl-ex\">Point 3 · challenge, solution &amp; benefit</span> <span class=\"hl-close\">Conclusion</span> · <b><i>transitions in bold italic</i></b></div><p style=\"line-height:2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff\"><span class=\"hl-topic\">Moving into shared accommodation for the first time is exciting, but living successfully with others depends on a few simple habits.</span> <b><i>First,</i></b> <span class=\"hl-r1\">roommates must agree on clear rules and share the responsibilities: everyone has to help with the cleaning and respect quiet hours at night.</span> <b><i>In addition,</i></b> <span class=\"hl-r2\">you should always be considerate — you ought to respect other people’s privacy and ask before borrowing their things.</span> <b><i>However,</i></b> <span class=\"hl-ex\">problems such as noise or mess can still happen; <b><i>for example,</i></b> if a roommate plays loud music late at night, you should talk calmly and find a fair solution. The benefit is a peaceful home and new friendships.</span> <b><i>Finally,</i></b> <span class=\"hl-close\">these habits matter because respect and responsibility turn a shared space into a real community.</span></p></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff8ea\"><summary style=\"cursor:pointer;font-weight:800;color:#8a5a12\">💡 Sentence starters — help for struggling writers</summary><div style=\"margin-top:8px;line-height:1.9\"><b>Introduction:</b> “Living successfully with others depends on…” · “When you share a home, it is important to…”<br><b>Point 1 (rules):</b> “First, roommates must…” · “Everyone has to…”<br><b>Point 2 (considerate):</b> “In addition, you should…” · “It is polite to…”<br><b>Point 3 (challenge + benefit):</b> “However, one common problem is… To solve this, you should…” · “One real benefit of shared living is…”<br><b>Conclusion:</b> “Finally, these habits matter because…” · “In conclusion, shared living works best when…”</div></details>"}],
   a3:[{t:"p",html:"<b>Draft &amp; revise.</b> Write your paragraph (about 80–100 words) using your plan. Then use the checklist and a partner conference to improve it."},{t:"note",html:"<b>Writing checklist —</b> ☐ clear topic sentence ☐ three supporting details in a logical order ☐ at least two present modals (must / have to / should) ☐ one idea drawn from the reading ☐ a concluding sentence ☐ linking words (first, also, however, finally) ☐ I checked spelling, capitals and full stops."},{t:"note",html:"<b>Peer conference (post-writing):</b> swap paragraphs with a partner. Tell them ONE thing that is clear and strong, and ask ONE question about something that could be clearer. Then revise your own paragraph."},{t:"rating",label:"Rate your paragraph: clear topic sentence, organised details, and correct modals?"}],
   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Self-regulation and discipline — keeping to shared rules, taking responsibility and being considerate — are what make any shared home work, from an extended-family household to a university residence hall. These habits are valued across the UAE and around the world."},{t:"prompts",items:["Which one habit does the most to make shared living successful, and why?","How do you show responsibility in a space you share at home or school?"]}],
   enrich:[{t:"p",html:"<b>Modals in context.</b> Complete each piece of advice with the best modal."},{t:"mcq",intro:"Choose the best word:",qs:[{q:"You ____ respect other people’s privacy. (necessary)",opts:["have to","might","could"],ans:0},{q:"You ____ agree on quiet hours early on. (advice)",opts:["should","must not","don’t have to"],ans:0},{q:"You ____ leave the kitchen dirty. (not allowed)",opts:["must not","should","have to"],ans:0},{q:"You ____ do everything together — just be considerate. (not necessary)",opts:["don’t have to","must","have to"],ans:0}]},{t:"reflect",items:["Write one obligation and one piece of advice for a new roommate, each using a modal.","Write your paragraph’s topic sentence."]}],
   exit:[{t:"reflect",items:["Write one sentence from your paragraph that uses a present modal.","Write one pre-writing or post-writing strategy you used today (organiser, checklist, conference).","(KWL “L”) Write one thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel planning and writing an organised informational paragraph?"}]
  }

 "l1314":{
  num:"13-14", focus:"Reading & Viewing", title:"Unique Housing for Three College Students", book:BOOK3,
  grammar:"Infinitives of purpose — to / in order to + verb", fl:"FL.27 Describing advantages & disadvantages", charter:"Critical Thinking",
  page:"Reading & Writing pp. 9–14 · Lesson 13-14 PPT",

   kwl:[{t:"note",html:"<b>Prior knowledge (KWL).</b> Think of an unusual or creative place someone could live. What would make it special — and what problems might it have?"},{t:"kwl"}],

   obj:[{t:"obj",items:["read personal accounts and identify specific information","use predictions and context clues to understand experiences and challenges","make inferences about text content and meaning","describe advantages and disadvantages using infinitives of purpose (to / in order to)"]},{t:"note",html:"<b>Main SLO:</b> ENG.06.RV.CS.2.1 — read and identify specific information.<br><b>Supporting SLO:</b> ENG.06.RV.CS.4.2 — make inferences or predictions about text content, line of argumentation and the meaning of sections, using whole-text comprehension and text features and organisation.<br><b>Grammar:</b> Infinitives of purpose (to / in order to) · <b>FL.27</b> Describing advantages &amp; disadvantages · <b>Charter:</b> Critical Thinking."}],
   vocab:[{t:"p",html:"<b>Key vocabulary</b> — creative housing. Read and listen to the phrases and compare them with the words you brainstormed. Tap 🔊 to hear a word or ＋ Bank to save it, then take the Spelling Bee below."},{t:"vocab",items:[
     ["save money","to keep money instead of spending it","phrase","These students … by living in unusual ways."],
     ["get through college","to complete your studies at college","phrase","They found creative ways to … ."],
     ["get around town","to travel from place to place in a town","phrase","He used a bicycle to … ."],

     ["keep clean","to stay washed and tidy","phrase","He bathed in a river to … ."],

     ["become popular","to start to be liked or known by many people","phrase","His video blog … very quickly."],
     ["close friends","people you know and trust very well","noun phrase","Living secretly made it hard to make … ."],
     ["live a lie","to hide the truth about your life","phrase","He felt he had to … for two years."],
     ["have fun","to enjoy yourself","phrase","He could not join his classmates to … ."],
     ["campus accommodation","a place to live provided by a college or university","noun phrase","… can be very expensive."],
     ["facilities","rooms or equipment provided for people to use","noun","He used the university’s … , such as the gym and library."]
   ]}],
   a1:[{t:"p",html:"<b>Reading — “Unique Housing for Three College Students.”</b> Read the three students’ accounts below (Chapter 1, Reading &amp; Writing, pp. 11–12). Use the toolbar to have it <b>read to you</b>, tap any word for its meaning, then find <b>specific information</b> about each student and <b>infer</b> the advantages and challenges of their choice."},{t:"note",html:"<b>Reading strategy — read for specific information + infer.</b> Decide what to look for <i>before</i> you read: <b>who</b> each student is, <b>where</b> they live, <b>why</b> they chose it, and one <b>advantage</b> and one <b>disadvantage</b>. Some answers are stated; others you must work out from clues (inference)."},{t:"passage",title:"Unique Housing for Three College Students",nolabel:true,paras:[
     "<b>Not Every College Student Lives in a Dorm.</b> While in college, most students choose among the three most common types of housing: dormitories, apartments, and their parents’ homes. Some students, however, are more creative. Below are three stories of students who saved a lot of money — and endured some challenges — by getting through college in unusual ways.",
     "<b>Student 1.</b> In Wales, a graduate student named Joe Pearce lived on a 23-foot sailboat for 14 months while at Aberystwyth University. He purchased the ship for $1,200. If he had lived in a dorm or apartment, that much money would pay his rent for only about two months. Pearce paid only $1.50 per day to keep his boat tied up at a nature reserve. To save even more money, Pearce used a bicycle to get around town and to campus, which was eight miles away. He also used wood that he found at the nature reserve to cook his meals. Pearce estimates that he saved $8,500 living on his boat. The winter months were hard on the boat because it was cold and rainy.",
     "“People laugh when I tell them that I got my graduate degree while living on a boat because they don’t believe me. I show them pictures, and then they are curious and fascinated. They ask a million questions about my experience.”",
     "<b>Student 2.</b> Frank Cronin spent an entire school year living in a tent near Galway, Ireland, while attending the National University of Ireland. Cronin saved a lot of money this way. He also made a little money by documenting his experiences on a video blog. Companies paid to advertise on his site. To keep clean, Cronin bathed in a nearby river or at the university gym. He says he loved living in the wild, but privacy and security were concerns. Because he was broadcasting his experience, it was difficult to keep his location secret. This meant he couldn’t leave anything valuable in his tent.",
     "“I became a local celebrity because of the way I lived. Before I created my site, no one knew who I was or what I was doing there. My video blog became popular, and that’s when I started to have visitors. I didn’t want this to happen, but I’m to blame.”",
     "<b>Student 3.</b> To help reduce his costs for graduate school at Duke University in North Carolina, Ken Ilgunas lived for two years in a van he bought for $1,500. Living in his van allowed him to eliminate many other expenses and avoid debt. For Internet and electricity (to charge his electronics), he used the library. For showers, he bought an inexpensive campus gym membership. Living in this way, he estimates that students would pay almost $9,000 over the course of four years. Living in a Duke dorm for the same amount of time would cost $44,000. The most difficult part of his experience, he says, was loneliness. Because he wasn’t supposed to be living in his van, he had to keep it secret from everyone. This prevented him from developing close relationships.",
     "“I lived a lie for two years. I listened to my classmates talk about studying and having fun at each other’s dorms and apartments. I wasn’t able to go, so I didn’t experience this important part of college life.”"
   ]},{t:"note",html:"<b>Note-taking frame (copy &amp; complete from the text):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th>&nbsp;</th><th>Student 1 (Pearce)</th><th>Student 2 (Cronin)</th><th>Student 3 (Ilgunas)</th></tr><tr><td><b>Where did they live?</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>Why did they choose it?</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>One advantage</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>One challenge</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table>"},{t:"mcq",intro:"Reading for specific information — choose the best answer:",qs:[{q:"Where did Joe Pearce live while at university?",opts:["on a 23-foot sailboat","in a dormitory","in a tent"],ans:0},{q:"How did Frank Cronin make a little money?",opts:["from a video blog with advertising","by selling his tent","by renting a room"],ans:0},{q:"What was the hardest part of Ken Ilgunas’s experience?",opts:["loneliness, because he had to keep it secret","the cost of his van","the university library"],ans:0},{q:"What do all three students have in common?",opts:["they saved money by living in unusual ways","they lived in the same country","they all lived in vans"],ans:0}]},{t:"p",html:"<b>Activity 7 · Collocations.</b>"},{t:"note",html:"<b>7. Collocations</b> — Fill in the gap using <b>do, make, take</b> and <b>have</b> to form the correct collocation (the tense of the verbs may vary). Write your answers in your notebook, then open the key to check."},{t:"note",html:"<div style=\"line-height:1.9\">1. They ____________ part in many campus activities last year.<br>2. She ____________ arrangements for the theater this weekend.<br>3. He didn’t go to class and ____________ an excuse about being ill.<br>4. I ____________ an appointment at 8 a.m., so I must hurry!<br>5. Can I ____________ a break before lunch?<br>6. Robert is ____________ research for his biology class now.<br>7. Will you ____________ a test before summer?<br>8. Try not to worry so much, it’s good to ____________ fun sometimes!<br>9. After her operation, Susan had to walk for half an hour every day. “This will ____________ you good,” the doctor said.<br>10. All I want to say is thank you. You helped me ____________ great progress in English!<br>11. They hiked for six hours, but then decided to ____________ a break.<br>12. Can you ____________ me a favor?</div>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Answer key</summary><div style=\"margin-top:8px;line-height:1.9\">1. took &nbsp; 2. is making / makes &nbsp; 3. made &nbsp; 4. have &nbsp; 5. take &nbsp; 6. doing &nbsp; 7. take &nbsp; 8. have &nbsp; 9. do &nbsp; 10. make &nbsp; 11. take &nbsp; 12. do</div></details>"}],
   a2:[{t:"p",html:"<b>Activity 8 · Getting Meaning from Context.</b>"},{t:"note",html:"<b>8. Reading again</b> — Look back at the article. Then choose the correct word or phrase from the box and match it with its definition. (There are more options than spaces.)"},{t:"note",html:"<div style=\"padding:8px 12px;border:1px dashed var(--blue);border-radius:10px;background:#f4f7ff;font-weight:700\">amenities · bedroom · campus · cooperative · dormitory · facilities · higher education · residence hall · special-interest housing · survive</div>"},{t:"note",html:"<div style=\"line-height:1.9\">1. ____________________ = a building with rooms for residents, usually with common bathroom facilities and recreation areas<br>2. ____________________ = features of accommodation for comfort or luxury<br>3. ____________________ = a building for residents with the same major, life style, or cultural background<br>4. ____________________ = get through without harm<br><br>Some words in the same article are short forms. Write the rest of these words next to their definitions.<br>5. dorm____________ = a shared living and learning community on college or university campus<br>6. higher ed____________ = study and learning at a college or university<br>7. housing co-op____________ = housing with shared work and decision making</div>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Answer key</summary><div style=\"margin-top:8px;line-height:1.9\">1. dormitory &nbsp; 2. amenities &nbsp; 3. special-interest housing &nbsp; 4. survive &nbsp; 5. dorm<b>itory</b> &nbsp; 6. higher ed<b>ucation</b> &nbsp; 7. housing co-op<b>erative</b></div></details>"},{t:"p",html:"<b>Grammar for meaning — infinitives of purpose.</b> We use <b>to</b> or <b>in order to</b> + verb to explain <i>why</i> someone does something. e.g. “Pearce used a bicycle <b>to save</b> money.” / “Ilgunas lived in a van <b>in order to</b> avoid debt.”"},{t:"mcq",intro:"Choose the correct purpose form:",qs:[{q:"He bought a boat ____ money on rent.",opts:["to save","for save","saving"],ans:0},{q:"He used the library ____ get free Internet.",opts:["in order to","for to","to be"],ans:0},{q:"He bathed in a river ____ keep clean.",opts:["to","for","by"],ans:0}]},{t:"note",html:"<b>Describing advantages &amp; disadvantages (FL.27):</b> “One <b>advantage</b> of… is that…”, “A <b>drawback</b> / disadvantage is…”, “On the one hand… on the other hand…”."},{t:"reflect",items:["Write one sentence with an infinitive of purpose about one student (…did … to …).","Write one advantage and one disadvantage of that student’s home."]}],
   culture:[{t:"p",html:"<b>UAE–World Connection.</b> Critical thinking means weighing advantages and disadvantages before deciding. From sustainable ‘tiny houses’ to smart, space-saving apartments, creative housing shows people solving real problems in clever ways — a mindset the UAE encourages in its push for innovation."},{t:"prompts",items:["Which of the three students made the smartest choice, in your view? Why?","What creative housing idea would you like to try, and what is its main advantage?"]}],
   enrich:[{t:"p",html:"<b>Vocabulary in context.</b> Complete each sentence with the best phrase from this lesson."},{t:"mcq",intro:"Choose the best phrase:",qs:[{q:"Ilgunas lived in a van to ____ and avoid debt.",opts:["save money","become popular","have fun"],ans:0},{q:"Cronin bathed in a river to ____ .",opts:["keep clean","get a degree","get around town"],ans:0},{q:"Living secretly made it hard for Ilgunas to make ____ .",opts:["close friends","facilities","a video blog"],ans:0},{q:"Ilgunas felt he had to ____ for two years.",opts:["live a lie","get around town","keep clean"],ans:0},{q:"Cronin’s video blog helped him ____ .",opts:["become popular","get a degree","keep clean"],ans:0}]},{t:"reflect",items:["Write two advantages and one challenge of one student’s home, from the text.","Write one sentence using a phrase from this lesson (e.g. save money, live a lie, keep clean)."]}],
   exit:[{t:"reflect",items:["Write one specific detail you found about one of the three students.","Write one inference you made (something not stated directly) and the clue for it.","(KWL “L”) Write one thing you learned in this lesson."]},{t:"rating",label:"How confident do you feel reading for specific information and making inferences?"}]
  }

 "l1516":{
  num:"15-16", focus:"Writing & Representing", title:"Sharing Things", book:BOOK3,
  grammar:"Cohesive devices — referencing & substitution", fl:"FL.16 Expressing opinion", charter:"Creativity",
  page:"Reading & Writing pp. 15–20 · Lesson 15-16 PPT",
  stages:{

   a1:[{t:"p",html:"<b>Reading to Write — “Bike-sharing is Completely Changing City Life.”</b> Read the article below (paragraphs A–F). Use the toolbar to have it <b>read to you</b>, tap any word for its meaning, then do Activities 6 and 7."},{t:"passage",title:"Bike-sharing is Completely Changing City Life",paras:[
     "More and more people seem to be enjoying a car-free lifestyle. In 2016, there were about two million bikes available. Today, there are more than 1,600 bike-sharing programs around the world that provide over 18 million bicycles.",
     "Say hello to the dockless bike, the new technology that’s changing how people get around. The greatest advantage of dockless bike-sharing systems is that they don’t need a dock anymore. (Docks are special frames with bars that lock bikes.) People who live, work or visit cities can rent a bike for an hour, a day or week by using a smartphone. Firstly, they can ride their bike anywhere in these cities. Secondly, they just park them wherever their journey ends. Users simply download an app on their phone to find and unlock a bike that’s available nearby. Besides, it’s much easier than having your own bike since you don’t have to carry a lock and you don’t have to worry about where you leave it.",
     "A major advantage of bike-sharing is that it reduces traffic, pollution, and noise. It also encourages a healthier lifestyle; it gets people thinking about cycling and to see it as a fun and healthy activity. For these reasons, many local governments are cooperating with private bike-sharing companies. What’s more, the programs are done at little or no cost to the citizens as they are supported by public-transport authorities. For example, the German national rail company offers a bike rental service in over 50 towns and cities. In some cases, like London, the bike-sharing system is owned by the public-transport authority itself. In other places, like Colombia, South America, the system is connected to public transport such as the metro.",
     "Finding a bike waiting when you leave your house or office, get off the bus, train, or metro has its drawbacks. The main disadvantage of dockless bike-sharing is that riders don’t always leave bikes in their designated (correct) places for others to start their journeys. In some areas, people complain about bikes left on streets, sidewalks, and in front of buildings. For instance, pedestrians can’t walk on the sidewalks and cars have less space to park. As a result, these ‘litter bikes’ that are found just about anywhere can make any city, town, or neighborhood look unattractive.",
     "Another disadvantage is that bikes are sometimes damaged or stolen, especially in larger cities. An additional disadvantage is that the bikes are not used enough. This means that bike-sharing companies have to close their businesses. Local authorities are creating more bike lanes, educating people in how to use bike-sharing systems, and even introducing laws about where users can leave their bikes. Companies have added technology to their apps to identify and punish those who leave their bikes in all the wrong places. Some even offer daily pickups.",
     "On the whole, dockless bikes have become an effective, inexpensive, and enjoyable way to travel in many cities across the world."
   ]},{t:"note",html:"<b>6. Reading again</b> — Read the article again. Identify the main ideas and give details about them. Answer in your notebook, then open the suggested answers to compare."},{t:"note",html:"<div style=\"line-height:1.8\"><b>1.</b> What is the main idea of this article?<br><b>2.</b> Do any of the paragraphs have similar ideas?<br><b>3.</b> Write the main idea and supporting details for paragraphs <b>B, C, D</b> and <b>E</b>.</div>"},{t:"note",html:"<b>Frame (copy &amp; complete):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th>Paragraph</th><th>Main idea</th><th>Details</th></tr><tr><td><b>B</b></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>C</b></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>D</b></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><b>E</b></td><td>&nbsp;</td><td>&nbsp;</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Suggested answers</summary><div style=\"margin-top:8px;line-height:1.7\"><b>1. Main idea:</b> Dockless bike-sharing is changing city travel — it brings big benefits (cheap, less traffic and pollution, healthier living) but also problems (bikes left in the wrong places, damage and theft), which cities are working to solve.<br><b>2. Similar ideas:</b> Paragraphs <b>B and C</b> both explain <i>advantages</i>; paragraphs <b>D and E</b> both explain <i>disadvantages</i>.<br><b>3.</b><br><b>B — Main idea:</b> Dockless bikes are convenient and easy to use. <i>Details:</i> no dock needed; rent by app for an hour/day/week; ride and park anywhere; no lock to carry.<br><b>C — Main idea:</b> Bike-sharing benefits cities and health, so governments support it. <i>Details:</i> reduces traffic, pollution, noise; encourages healthy cycling; little or no cost via transport authorities; examples — German rail, London, Colombia.<br><b>D — Main idea:</b> A drawback is bikes left in the wrong places. <i>Details:</i> riders skip designated spots; bikes on streets and sidewalks; block pedestrians and parking; ‘litter bikes’ look unattractive.<br><b>E — Main idea:</b> Bikes can be damaged, stolen or underused, so companies and authorities respond. <i>Details:</i> theft/damage in big cities; low use closes businesses; more bike lanes, education, laws; app technology to punish bad parking; daily pickups.</div></details>"},{t:"note",html:"<b>7. Focusing on connecting ideas</b> — Which connecting words or phrases help the author move smoothly from one idea to the next? Categorise them by their function. Some items are given as examples."},{t:"note",html:"<table style='width:100%;border-collapse:collapse' border='1'><tr style='background:#eef2fb'><th>List &amp; Add Points</th><th>Introduce/List Advantages</th><th>Introduce/List Disadvantages</th></tr><tr><td><i>Firstly,</i> ……</td><td><i>The greatest advantage is…</i> ……</td><td>……</td></tr><tr style='background:#eef2fb'><th>Introduce Examples/Reasons</th><th>Show Contrast</th><th>Introduce Conclusion</th></tr><tr><td><i>In some cases,</i> ……</td><td>……</td><td>……</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Suggested answers (from the text)</summary><div style=\"margin-top:8px;line-height:1.7\"><b>List &amp; Add Points:</b> Firstly, Secondly, Besides, What’s more, Another…, An additional…<br><b>Introduce/List Advantages:</b> The greatest advantage is…, A major advantage of… is that…<br><b>Introduce/List Disadvantages:</b> …has its drawbacks, The main disadvantage of… is that…, Another disadvantage is…, An additional disadvantage is…<br><b>Introduce Examples/Reasons:</b> In some cases, For example, For instance, such as, like, For these reasons<br><b>Show Contrast:</b> In other places… (used to contrast one case with another; this text uses contrast lightly)<br><b>Introduce Conclusion:</b> On the whole, As a result</div></details>"}],
   a2:[{t:"p",html:"<b>Language for writing — cohesive devices (referencing &amp; substitution).</b> To avoid repeating words, use <b>referencing</b> (it, they, this, these, such) and <b>substitution</b> (one, ones, do so). e.g. “Shared bikes are cheap; <b>they</b> also cut traffic.” · “I prefer the dockless scheme to the docked <b>one</b>.”"},{t:"mcq",intro:"Choose the best cohesive device:",qs:[{q:"“The city built bike lanes. ____ made cycling safer.”",opts:["This","Bike lanes bike lanes","A city"],ans:0},{q:"“I like the new bikes more than the old ____ .”",opts:["ones","bikes bikes","it"],ans:0},{q:"“Shared cars save money, and ____ reduce pollution too.”",opts:["they","the shared cars the shared cars","one"],ans:0}]},{t:"note",html:"<b>Also reuse the connectors from Activity 7</b> — for advantages (<i>The greatest advantage is…</i>), disadvantages (<i>The main disadvantage is…</i>), examples (<i>For example, For instance</i>) and conclusions (<i>On the whole</i>)."},{t:"p",html:"<b>Plan your opinion essay.</b> Decide your opinion, then complete this plan before drafting."},{t:"note",html:"<b>Essay plan (copy &amp; complete):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th>Part</th><th>My notes</th></tr><tr><td><b>Introduction</b> — the topic + your opinion (thesis)</td><td>&nbsp;</td></tr><tr><td><b>Body 1</b> — an advantage + example</td><td>&nbsp;</td></tr><tr><td><b>Body 2</b> — another advantage + example</td><td>&nbsp;</td></tr><tr><td><b>Body 3</b> — a disadvantage + your response</td><td>&nbsp;</td></tr><tr><td><b>Conclusion</b> — restate opinion + final thought</td><td>&nbsp;</td></tr></table>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Model ‘My notes’ — a completed example to guide you</summary><div style=\"margin-top:8px;line-height:1.7\"><b>Introduction:</b> Bike-sharing is spreading fast; in my opinion, it makes cities better.<br><b>Body 1 (advantage):</b> It is convenient — you unlock a bike with an app and park it anywhere.<br><b>Body 2 (advantage):</b> It cuts traffic and pollution, so the air is cleaner.<br><b>Body 3 (disadvantage):</b> A drawback is ‘litter bikes’ left on pavements; regulation and designated areas solve this.<br><b>Conclusion:</b> On the whole, I believe sharing is good for a city.</div></details>"},{t:"p",html:"<b>✍️ Writing prompt (write about 120–150 words).</b> Using the reading and your plan, write a <b>structured opinion essay</b>: <i>Is the sharing economy (such as bike-sharing) good for a city?</i> Give your opinion, support it with at least two advantages and examples, mention one disadvantage and a response, and connect your ideas with the linking words from Activity 7 and cohesive devices."},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Marking rubric — how your writing is scored (out of 10)</summary><div style=\"margin-top:8px\"><table style=\"width:100%;border-collapse:collapse\" border=\"1\"><tr style=\"background:#eef2fb\"><th style=\"padding:6px\">Criterion</th><th style=\"padding:6px\">What the teacher looks for</th><th style=\"padding:6px\">Marks</th></tr><tr><td style=\"padding:6px\"><b>1. Task completion</b></td><td style=\"padding:6px\">Clear opinion, two advantages with examples, one disadvantage + response; ~120–150 words.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>2. Organization</b></td><td style=\"padding:6px\">Essay mode: introduction → body → conclusion, with linking words from Activity 7.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>3. Sentence structure</b></td><td style=\"padding:6px\">Varied, complete sentences; ideas linked with cohesive devices.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>4. Grammar &amp; mechanics</b></td><td style=\"padding:6px\">Correct referencing/substitution; subject–verb agreement.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr><td style=\"padding:6px\"><b>5. Spelling &amp; punctuation</b></td><td style=\"padding:6px\">Accurate spelling; capitals, full stops and commas correct.</td><td style=\"padding:6px;text-align:center\">/2</td></tr><tr style=\"background:#eef2fb\"><td style=\"padding:6px\" colspan=\"2\"><b>Total</b></td><td style=\"padding:6px;text-align:center\"><b>/10</b></td></tr></table></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbff\"><summary style=\"cursor:pointer;font-weight:800;color:var(--red)\">▼ Sample answer — colour-coded by part</summary><div style=\"margin-top:8px\"><div style=\"margin-bottom:8px;font-size:.86rem\"><span class=\"hl-topic\">Introduction / opinion</span> <span class=\"hl-r1\">Advantage 1 + example</span> <span class=\"hl-r2\">Advantage 2 + example</span> <span class=\"hl-ex\">Disadvantage + response</span> <span class=\"hl-close\">Conclusion</span> · <b><i>linking words in bold italic</i></b> · <u>cohesive devices underlined</u></div><p style=\"line-height:2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff\"><span class=\"hl-topic\">Bike-sharing is spreading to cities everywhere. In my opinion, it makes city life better.</span> <b><i>The greatest advantage is</i></b> <span class=\"hl-r1\">that it is convenient; <u>you</u> unlock a bike with an app and park it anywhere.</span> <b><i>A major advantage is</i></b> <span class=\"hl-r2\">that it reduces traffic and pollution, <b><i>so</i></b> the air becomes cleaner.</span> <b><i>However,</i></b> <span class=\"hl-ex\">one disadvantage is that bikes are left on pavements; <b><i>as a result,</i></b> cities use regulation and designated areas to solve <u>this</u>.</span> <b><i>On the whole,</i></b> <span class=\"hl-close\">I believe sharing is good for a city, because <u>it</u> saves money and helps the environment.</span></p></div></details>"},{t:"note",html:"<details style=\"border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff8ea\"><summary style=\"cursor:pointer;font-weight:800;color:#8a5a12\">💡 Sentence starters — help for struggling writers</summary><div style=\"margin-top:8px;line-height:1.9\"><b>Introduction:</b> “In my opinion, bike-sharing…” · “I believe that sharing things…”<br><b>Advantage 1:</b> “The greatest advantage is that…”<br><b>Advantage 2:</b> “A major advantage is that…”<br><b>Disadvantage:</b> “However, the main disadvantage is… As a result, cities should…”<br><b>Conclusion:</b> “On the whole, I believe… because…”</div></details>"},{t:"rating",label:"Rate your essay: clear opinion, advantages & a disadvantage, and good linking words?"}],

   a1:[{t:"p",html:"<b>Activity 4 — Listening for main ideas &amp; specific information.</b> Close your book. Listen to the counsellor’s presentation (a <i>counselor</i> is another word for <i>tutor</i>). Take notes on the main ideas while you listen. Then look at your notes and check that you understand all the main ideas."},{t:"note",html:"<b>Note-taking hints:</b> don’t write every word; note only key words and stressed words; organise your notes into two columns — <i>Main ideas</i> and <i>Details</i>."},{t:"note",html:"<b>Note-taking frame (copy &amp; complete as you listen):</b><br><table style='width:100%;border-collapse:collapse' border='1'><tr><th style='width:50%'>Main ideas</th><th>Details</th></tr><tr><td><b>Speaker:</b> Counsellor — Terry Sargent</td><td>&nbsp;</td></tr><tr><td><b>Time-management tips:</b></td><td>&nbsp;</td></tr><tr><td>• Use calendar / daily planner</td><td>&nbsp;</td></tr><tr><td>• To-do list</td><td>&nbsp;</td></tr><tr><td>• Say no</td><td>&nbsp;</td></tr></table>"},{t:"p",html:"<b>Listening script</b> — read it with the read-to-me tool, or your teacher reads it aloud while you take notes with your book closed."},{t:"passage",title:"Freshman Workshop: You’re on Your Own! (Terry Sargent)",paras:[
     "Welcome, everyone, to the freshman workshop. My name is Terry Sargent, and I’m a counsellor here at the college. Now that you are living on your own for the first time, nobody is going to remind you about your homework or wake you up for class. You have to manage your own time — and that is exactly what today’s session is about.",
     "My first tip is simple: use a calendar or a daily planner. Write down every class, every meeting and every assignment, so you can see the whole week at a glance. When you can see your time, you can plan it.",
     "My second tip is to make a to-do list every morning. Put the most important tasks at the top, and cross each one off as you finish it. Crossing things off feels good, and it shows you how much you have really done.",
     "Third, always know your deadlines — the day and time each assignment is due. Set your phone to remind you a day or two before, so nothing is ever a surprise.",
     "Now, here is something students often forget: it is fine to say no. You cannot do everything, so choose carefully. If you take on too much, you will feel overwhelmed and your work will suffer.",
     "Finally, plan time to rest as well as to work. Take a short break, go for a walk, or do some exercise to clear your mind. A balanced schedule keeps you healthy, and a healthy student is a successful student. Good luck — you can do this!"
   ]},{t:"mcq",intro:"Check the main ideas — choose the best answer:",qs:[{q:"Who is the speaker and what is his job?",opts:["Terry Sargent, a college counsellor","a student named Miguel","a maths teacher"],ans:0},{q:"What is the presentation mainly about?",opts:["managing your own time at college","choosing a sport","cooking meals"],ans:0},{q:"What is the FIRST tip?",opts:["use a calendar or daily planner","never sleep","skip classes"],ans:0},{q:"What should you do with each finished task?",opts:["cross it off the to-do list","forget it","do it again"],ans:0},{q:"Why does the counsellor say it is fine to ‘say no’?",opts:["so you don’t take on too much and feel overwhelmed","because work is not important","so you can stay in bed"],ans:0}]}],

 {t:"There’s no doubt that the left hemisphere is different to the right hemisphere.",ans:"fact",cue:"“no doubt” + surgery “proved… were different”",why:"The text says the disruptions after surgery “proved” the hemispheres were different, and “no doubt” signals certainty."},
 {t:"A person isn’t just “left-brained” or “right-brained”.",ans:"fact",cue:"“Scientists agree”",why:"It is presented as established knowledge — scientists agree the two hemispheres continually collaborate."},
 {t:"The myth of left-brain and right-brain is due to scientific research conducted in the past.",ans:"assumption",cue:"“was probably caused”",why:"The word “probably” shows the cause is believed, not proven — an assumption."},
 {t:"A logical activity and an artistic activity require both brain hemispheres to be active.",ans:"assumption",cue:"“scientists are now theorizing”",why:"“Theorizing” signals an idea under investigation, not a proven fact."},
 {t:"Over 700 cases have been filed that are based on newly discovered memories.",ans:"fact",cue:"“In fact, over 700 cases have been filed”",why:"A concrete, countable figure stated as fact (“in fact”) — it can be verified."},
 {t:"Many newly discovered memories are false.",ans:"assumption",cue:"“studies… suggested that many… might be”",why:"“Suggested” and “might be” show this is a possibility being proposed, not established."},
 {t:"Small pieces of memory are kept in different parts of the brain.",ans:"fact",cue:"“It is known that…”",why:"“It is known” directly signals proven, accepted information — a fact."},
 {t:"People “remember” things that have never happened.",ans:"fact",cue:"“But it’s certain that people can ‘remember’…”",why:"“It’s certain” is an explicit fact cue."},
 {t:"There is no structural difference between a false memory and a true one.",ans:"assumption",cue:"“there may be no structural difference”",why:"“May be” marks this as a possibility/claim by Dr. Nash, not a proven fact."},
 {t:"The brain of a teenager differs from that of both children and adults.",ans:"fact",cue:"“very recent studies provide evidence that…”",why:"Backed by study evidence and stated as an established finding — presented as fact."}

   a1:[{t:"subtabs",tabs:[
     {label:"Abridged reading",blocks:[{t:"note",html:"<b>Abridged version.</b> A shorter, simpler retelling of the article — read this first if the full text feels hard."},{t:"passage",title:"The Human Brain (abridged)",paras:["The brain has an “old” part that controls basic needs like breathing and sleeping, and a “new” part, unique to humans, for complex thinking. The thinking part, the cerebrum, has two halves called hemispheres, joined by a bridge called the corpus callosum.","People used to say you were either “left-brained” (logical) or “right-brained” (creative). New research shows this is a myth: the two halves work together all the time. Solving a maths problem or making art needs both logic and creativity.","Memory can trick us. In the 1980s, some adults suddenly “remembered” events from childhood, and over 700 court cases were based on these memories. Later studies suggested many were false — even a small suggestion can create a memory of something that never happened.","The teenage brain is still developing. The corpus callosum keeps growing into a person’s twenties, so teenagers may not yet be as self-aware as adults, and they read emotions on faces less easily.","Can we change our brain? Studies say yes. Smoking and “infomania” (too much information from phones and messages) can lower intelligence, but meditation seems to improve memory, learning and concentration — training the mind like exercise trains the body."]}]},

       {t:"passage",title:"The Human Brain — New Discoveries",paras:["<span class='rhead'>New Discoveries</span><br>Most of us learn basic facts about the human brain in our middle or high school biology classes. We study the subcortex, the “old brain,” which is found in the brains of most animals and is responsible for basic functions such as breathing, eating, drinking, and sleeping. We learn about the neocortex, the “new brain,” which is unique to humans and is where complex brain activity takes place. We find that the cerebrum, which is responsible for all active thought, is divided into two parts, or hemispheres. The left hemisphere, generally, manages the right side of the body; it is responsible for logical thinking. The right hemisphere manages the left side of the body; this hemisphere controls emotional, creative, and artistic functions. And we learn that the corpus callosum is the “bridge” that connects the two hemispheres. Memorizing the names for parts of the brain might not seem thrilling to many students, but new discoveries in brain function are exciting. Recent research is shedding light on creativity, memory, maturity, gender, and the possibility of changing the brain.","<span class='rhead'>Left Brain / Right Brain: Truth or Myth?</span><br>Scientists agree that the left hemisphere of the brain specializes in different areas or skills than the right hemisphere. Up until recently, many believed that people were either left-brained (in other words, more logical) or right-brained (in other words, more creative) depending on which hemisphere they used most. However, new research suggests that this is a myth and that dividing creativity and logic into the right and left hemispheres is a simple way of looking at the human brain, as well as the things a person can do. Rather than being separated, the two hemispheres continually collaborate. Being able to solve a mathematical equation requires both logic and creativity. So does producing a work of art. Therefore, scientists are now theorizing that any type of activity requires the use of different parts of the brain both in the left hemisphere and the right. The confusion was probably caused in the 1940s when doctors would surgically separate the two hemispheres in patients suffering from seizures. After such an operation, the patient’s brain seemed to function normally, but there were disruptions in perception and cognition which proved that the left and right hemispheres were different.","<span class='rhead'>Memory: True or False?</span><br>In the 1980s in the United States, there were many cases of adults who suddenly remembered, with the help of a psychologist, things that had happened to them in childhood. These memories had been repressed – held back – for many years. Some of these newly discovered memories have sent people to prison. As people remember crimes that they saw or experienced as children, the police have reopened and investigated old criminal cases. In fact, over 700 cases have been filed that are based on these repressed memories.","However, studies in the 1990s suggested that many of these might be false memories. At a 1994 conference at Harvard Medical School, neuroscientists discussed how memory is believed to work. It is known that small pieces of a memory (sound, sight, feeling, and so on) are kept in different parts of the brain; the limbic system, in the middle of the brain, pulls these pieces together into one complete memory. But it’s certain that people can “remember” things that have never happened. Even a small suggestion can leave a piece of memory in the brain. Most frightening, according to Dr. Michael Nash of the University of Tennessee, is that “there may be no structural difference” in the brain between a false memory and a true one.","<span class='rhead'>The Teen Brain</span><br>Parents of teenagers have always known that there is something, well, different about the teen years. Some parents claim that their teenage children belong to a different species. Until recently, neuroscience did not support this belief. The traditional belief was that by the time a child was eight to twelve, the brain was completely mature. However, very recent studies provide evidence that the brain of a teenager differs from that of both children and adults. According to Jay Giedd of the National Institute of Mental Health, “Maturation does not stop at age ten, but continues into the teen years” and beyond. In fact, Giedd and his colleagues found that the corpus callosum “continues growing into your 20s.” Because, it is believed, the corpus callosum is involved in self-awareness and intelligence, the new studies imply that teens may not be as fully self-aware or as intelligent as they will be later. Other researchers, at McLean Hospital in Massachusetts, have found that teenagers are not as able (as adults are) to “read” emotions on people’s faces.","<span class='rhead'>Male versus Female Brain?</span><br>Watch a group of children as they play. You’ll probably notice that the boys and girls play differently, speak differently, and are interested in different things. Of course, there are gender differences but do they really determine the way male and female brains work? As with the left-brain and right-brain theory, scientists in the past studied the origins of these differences and proposed the theory of male versus female brain. Some of their arguments were interesting. For example, they suggested that men were better at reading maps and fixing stuff, whereas women were better at multitasking, using their intuition, or reading the emotions of people in photographs. After further research, however, some scientists don’t agree with the male–female distinction of brains. They believe that our brains are “plastic” and can change in many different ways throughout our lives despite our gender. Although the debate over male and female brains continues, it seems that they are more alike than we used to think.","<span class='rhead'>A Change of Mind?</span><br>We all know the expression “to change your mind”. But is it possible literally to change your mind – or, to be more precise, to change your brain? Reports from 2005 say yes. First, the bad news, at least for smokers: a study from the University of Aberdeen and the University of Edinburgh, in Scotland, concludes that smoking makes people less intelligent. On cognitive tests (that is, tests that involve judgment), smokers did significantly worse than non-smokers. The theory is that toxins – poisons – in the smoke enter the blood and damage blood vessels providing the brain with oxygen. And there is more bad news, for most of us: a study from the University of London says that “infomania” – the constant flood of information from cell phones, emails, and text messaging – can reduce intelligence by ten points on an IQ test.","However, there is also good news: meditation seems to change the “wiring” in the brain in several positive ways. In a study that compared the brains of eight lifelong Buddhist meditators who work with the Dalai Lama with the brains of beginner meditators, scientists discovered that there were significant differences. The expert meditators had higher levels of gamma brain waves, which improve memory, learning, and concentration. Meditation appears to do for the brain what physical training does for the body. The researcher Richard Davidson said, “The trained mind, or brain, is physically different from the untrained one.” Perhaps we should consider going into training."]},

   a1:[
     {t:"p",html:"<b>Activity — Listen for the main points.</b> This is a two-part lecture. Listen (or press 🔊 Read to me), then note the main idea of each part."},
     {t:"script",label:"Audio script 09_07 / 09_08 — the lecture (teacher: play or press Read to me)",intro:"",lines:[["Presenter · Part 1 — Taking notes and outlining","I want you to imagine this situation. Let’s say you’re at a shopping mall. You walk by one of those digital advertising screens, and you decide to stop and look. Suddenly an ad appears for running shoes, followed by an ad for men’s deodorant, and then one for an energy drink. It’s like the sign “knows” that you’re a 20-year-old guy who loves sports. Well, guess what — it does know! That’s because, when you looked at the sign, a computer scanned your face and selected ads that matched your age, gender, and body. The technology that does this is called facial recognition software."],["","In my speech today, I’m going to explain what facial recognition technology is and some of the positive ways we can use it. But then, in the second part of my speech, I’m going to tell you about some negative aspects of this technology — especially the negative impact on privacy. And I’m going to argue that this technology is something that we, and the government, need to control very carefully."],["","To begin, what is facial recognition software? Actually, there are two kinds of facial recognition technology that work using artificial intelligence. One kind can recognize human faces but is unable to identify who the person is. This is the kind I mentioned in my introduction. It has been used in advertising for over a decade and is continuously developing. For example, some software is now able to recognize a person’s mood, from very happy to very unhappy. This can help companies understand how customers respond to their advertisements."],["","The second kind of software does have the ability to recognize who you are. It works by measuring the distance between your eyes, the shape of your nose, the width of your mouth, and so on — and it is really useful for security. In Canada, for example, since 2018 facial recognition technology has been installed at all international airports to monitor passengers. It can also be used by police to identify criminals when they are caught on camera. Now, I can imagine what you’re thinking: facial recognition software is great! It can help businesses sell products, and it can ensure safety and fight crime. What’s wrong with that? Well, I agree that those are excellent applications of facial recognition software."],["Presenter · Part 2 — Taking notes and outlining","The problem is that facial recognition software also has the potential to take away your privacy. Everybody here has a social-media account, right? I read that each day, 350 million photos are posted to Facebook. So there is probably a photo of you somewhere on the Internet, and that photo probably has your name and other personal information attached to it. Let’s say you’re walking down the street and a camera takes a picture of you. Someone could use facial recognition software to match that image to your photo online. In that way, they can get your name, your age, your city, your likes and dislikes, your employment history, and all kinds of other private information."],["","Maybe you think that this is not a big deal, but to me it is dangerous. Imagine a world where a picture of your face could allow complete strangers to find out about you and use this personal information inappropriately. Fraud and identity theft are serious issues these days. And remember those digital ads in malls that I talked about at the beginning? Imagine if those screens could match your face with your medical history and display an ad for an antidepressant or heart medication right there for anybody to see. I think that would be incredibly embarrassing, don’t you?"],["","So, if you are concerned about protecting your privacy, what can you do about it? There are two things you need to do right away. First, try to limit the number of photos online that are connected with your name — for example, don’t let people tag your photos. In the second place, it’s essential to support laws that protect people’s privacy. In Europe and Canada, for instance, organizations have to get your permission before they are allowed to store your photo or information about you in their databases, and they are expected to keep that information secure."],["","In conclusion, facial recognition software already exists, and it is impossible to go back in time and make it disappear. So, if you care about your privacy and want to keep your freedom to walk down the street without strangers knowing all your secrets, then you and the government should take steps to control it before it’s too late."]]},
     {t:"reflect",items:["Main point of PART 1 (what facial recognition is + positive uses):","Main point of PART 2 (the problem with privacy):"]},

function qrSvg(text, opts){
  opts=opts||{}; var cell=opts.cell||8, quiet=opts.quiet||4;

    var n=qr.getModuleCount(); var size=(n+quiet*2)*cell;
    var rects='';
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)){ rects+='<rect x="'+((c+quiet)*cell)+'" y="'+((r+quiet)*cell)+'" width="'+cell+'" height="'+cell+'"/>'; } } }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="'+size+'" height="'+size+'" fill="#ffffff"/><g fill="#0b1220">'+rects+'</g></svg>';
  }catch(e){ return '<p style="color:#b00020">Could not generate a QR code for this link (it may be too long). Try a shorter URL.</p>'; }
}

/* stable, seeded scramble so dropdown options don't mirror the answer key,
   yet stay in the same order across re-renders (keeps saved answers valid) */
function scrambleOpts(base, seedStr){
  var s=2166136261; for(var i=0;i<seedStr.length;i++){ s^=seedStr.charCodeAt(i); s=Math.imul(s,16777619); }
  s=s>>>0; var a=base.slice();
  for(var k=a.length-1;k>0;k--){ s=(Math.imul(s,1664525)+1013904223)>>>0; var j=s%(k+1); var t=a[k];a[k]=a[j];a[j]=t; }
  if(a.length>1 && a.join('\u0001')===base.join('\u0001')){ a.push(a.shift()); } // never leave it in original order
  return a;
}

function grade(btn){
 var box=btn.parentNode, els=box.querySelectorAll('.A'), right=0,tot=0,done=true,keys=[];
 Array.prototype.forEach.call(els,function(el){ tot++; var a=el.getAttribute('data-a')||''; var ok;
   if(el.tagName==='SELECT'){ if(el.value==='')done=false; ok=(el.value!==''&&el.value===a); el.style.borderColor=ok?'var(--good)':(el.value===''?'var(--line)':'var(--bad)'); var o=el.querySelector('option[value="'+a+'"]'); keys.push('<li>'+esc(o?o.textContent:a)+'</li>'); }
   else { var v=(el.value||'').trim().toLowerCase(); if(!v)done=false; ok=(v===a); el.style.borderBottomColor=ok?'var(--good)':(v===''?'var(--blue)':'var(--bad)'); keys.push('<li>'+esc(a)+'</li>'); }
   if(ok)right++; });

}

function faPick(btn,uid,i,v){ var st=FA[uid]; if(!st||st.done) return; st.picks[i]=v;
  var card=document.getElementById(uid+"_c"+i); card.querySelectorAll(".fa-choice").forEach(function(b){b.classList.remove("sel");}); btn.classList.add("sel");
  var done=Object.keys(st.picks).length, tot=st.items.length;
  document.getElementById(uid+"_score").textContent=done+" / "+tot+" answered";
  var sb=document.getElementById(uid+"_submit"); if(sb) sb.disabled=(done<tot); }
function faSubmit(uid){ var st=FA[uid]; if(!st||st.done) return; st.done=true; var correct=0;
  st.items.forEach(function(it,i){ var card=document.getElementById(uid+"_c"+i); var ok=st.picks[i]===it.ans; if(ok)correct++;
    card.classList.add(ok?"fa-ok":"fa-no");
    card.querySelectorAll(".fa-choice").forEach(function(ch){ ch.style.pointerEvents="none";
      var v=ch.textContent.trim().toLowerCase()==="fact"?"fact":"assumption";
      if(v===it.ans) ch.classList.add(it.ans==="fact"?"right":"rightA");
      if(st.picks[i]===v && !ok) ch.classList.add("badpick"); });
    var fb=document.getElementById(uid+"_fb"+i); fb.className="fa-fb show "+(it.ans==="fact"?"f":"a");
    fb.innerHTML='<b>'+(it.ans==="fact"?"FACT":"ASSUMPTION")+' — signal: <i>'+esc(it.cue)+'</i></b>'+esc(it.why); });
  document.getElementById(uid+"_score").textContent="Score: "+correct+" / "+st.items.length;
  var sb=document.getElementById(uid+"_submit"); if(sb){ sb.textContent="Try again"; sb.disabled=false; sb.onclick=function(){ faReset(uid); }; } }
function faReset(uid){ var st=FA[uid]; if(!st)return; st.done=false; st.picks={};
  st.items.forEach(function(it,i){ var card=document.getElementById(uid+"_c"+i); card.className="fa-card"; card.id=uid+"_c"+i;
    card.querySelectorAll(".fa-choice").forEach(function(ch){ ch.className="fa-choice"; ch.style.pointerEvents=""; });
    document.getElementById(uid+"_fb"+i).className="fa-fb"; });
  document.getElementById(uid+"_score").textContent="0 / "+st.items.length+" answered";
  var sb=document.getElementById(uid+"_submit"); sb.textContent="Submit"; sb.disabled=true; sb.onclick=function(){ faSubmit(uid); }; }
function keyEntries(){
  // key vocabulary for THIS lesson, from its vocab list: [word, def, pos, example]
  var v=currentVocab(); return v.map(function(x){
    var ex=(x[3]||'').replace(/\u2026+/g, x[0]);   // fill the "……" blank with the word
    return {w:x[0], def:x[1]||'', pos:x[2]||'', ex:ex};
  });
}
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function keyRegex(keys){
  if(!keys||!keys.length) return null;
  var alt=keys.map(function(k){return reEsc(k.w);}).sort(function(a,b){return b.length-a.length;}).join('|');
  return new RegExp('\\b('+alt+')(s|es)?\\b','gi');
}
function boldKeys(text, re, seen, bases){ if(!re) return text; return text.replace(re, function(m){ var lm=m.toLowerCase(), norm=lm; if(bases){ for(var i=0;i<bases.length;i++){ var b=bases[i]; if(lm===b||lm===b+'s'||lm===b+'es'){ norm=b; break; } } } if(seen){ if(seen[norm]) return m; seen[norm]=1; } return '<b class="kw" data-kw="1">'+m+'</b>'; }); }
/* render a paragraph: [[gaps]] -> inputs, key words -> bold (first occurrence only, via shared `seen`), tags preserved */
function renderReadingPara(p, re, withGaps, seen, bases){
  if(!seen) seen={};
  var out='', last=0, m, rx=/\[\[(.+?)\]\]|(<[^>]+>)/g;
  while((m=rx.exec(p))){
    out += boldKeys(p.slice(last,m.index), re, seen, bases);
    if(m[1]!=null){ var w=m[1]; out += withGaps
        ? '<input class="A gap" data-a="'+esc(w.toLowerCase())+'" autocomplete="off" style="width:'+Math.max(90,w.length*13)+'px" />'
        : esc(w); }
    else out += m[2];              // keep inline tag (<i>, <b>…)
    last=rx.lastIndex;
  }
  out += boldKeys(p.slice(last), re, seen, bases);
  return out;
}
function glossaryHTML(keys){
  if(!keys||!keys.length) return '';
  return '<div class="glossary"><h3>🔤 Word list — key vocabulary in this text</h3>'
    +'<p class="gl-hint">Tap 🔊 to hear a word, or <b>＋ Bank</b> to save it to your Vocabulary Log. Then take the Spelling Bee in the reader bar above.</p>'
    +keys.map(function(k){ var jw=esc(k.w).replace(/'/g,"\\'"); return '<div class="gl-row">'
      +'<div class="gl-body"><span class="gl-w" onclick="openDict(\''+jw+'\')">'+esc(k.w)+'</span>'
      +(k.pos?'<span class="gl-pos">'+esc(k.pos)+'</span>':'')
      +'<div class="gl-def">'+esc(k.def)+'</div>'
      +(k.ex?'<div class="gl-ex">\u201c'+esc(k.ex)+'\u201d</div>':'')
      +'</div>'
      +'<div class="gl-actions"><button class="gl-ico" title="Hear it" onclick="sayWord(\''+jw+'\')">🔊</button>'
      +'<button class="gl-bank" onclick="bankWord(\''+jw+'\',this)">＋ Bank</button></div>'
      +'</div>'; }).join('')
    +'</div>';
}
/* ---- Vocabulary Log (saved words) ---- */
function vocabLog(){ try{ var a=JSON.parse(localStorage.getItem('ican_vocab_log')||'[]'); return a.map(function(e){ return (typeof e==='string')?{w:e,def:'',pos:'',ex:''}:e; }); }catch(e){ return []; } }
function saveVocabLog(a){ try{ localStorage.setItem('ican_vocab_log', JSON.stringify(a)); }catch(e){} }
function lookupWord(w){
  var lw=(w||'').toLowerCase();
  var g=lessonWord(lw)||GLOSS[lw]||GLOSS[lw.replace(/s$/,'')]||GLOSS[lw.replace(/es$/,'')]||GLOSS[lw.replace(/ed$/,'')]||GLOSS[lw.replace(/ing$/,'')];
  if(!g) return {def:'',pos:'',ex:''};
  var ex=(g[2]||'').replace(/\u2026+/g, w);   // fill the "……" blank with the word
  return {def:g[0]||'', pos:g[1]||'', ex:ex};
}
function inLog(w){ var lw=(w||'').toLowerCase(); return vocabLog().some(function(e){ return (e.w||'').toLowerCase()===lw; }); }
function bankWord(w, btn){
  var log=vocabLog();
  if(!inLog(w)){ var info=lookupWord(w); log.push({w:w, def:info.def, pos:info.pos, ex:info.ex}); saveVocabLog(log); }
  if(btn){ btn.textContent='✓ Saved'; btn.classList.add('on'); btn.disabled=true; }
}
function unbankWord(w){ var log=vocabLog().filter(function(e){ return (e.w||'').toLowerCase()!==(w||'').toLowerCase(); }); saveVocabLog(log); }

function wordAtPoint(ev){
  try{
    var range=null;
    if(document.caretRangeFromPoint) range=document.caretRangeFromPoint(ev.clientX,ev.clientY);
    else if(document.caretPositionFromPoint){ var pos=document.caretPositionFromPoint(ev.clientX,ev.clientY); if(pos){ range=document.createRange(); range.setStart(pos.offsetNode,pos.offset); range.collapse(true); } }
    if(range && range.startContainer && range.startContainer.nodeType===3){
      var text=range.startContainer.textContent, o=range.startOffset, l=o, r=o, re=/[A-Za-z\u2019'\-]/;
      while(l>0 && re.test(text[l-1])) l--; while(r<text.length && re.test(text[r])) r++;
      if(r>l) return text.slice(l,r);
    }
  }catch(e){}
  var t=ev.target; if(!t) return ''; var txt=t.textContent||''; return txt.split(/\s+/).length===1 ? txt : '';
}
function hlSelection(art){
  try{ var sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return;
    var r=sel.getRangeAt(0); if(!art.contains(r.commonAncestorContainer)) return;
    var span=document.createElement('span'); span.className='usermark';
    try{ r.surroundContents(span); }catch(e){ /* spans multiple nodes: wrap extracted */ span.appendChild(r.extractContents()); r.insertNode(span); }
    sel.removeAllRanges();
  }catch(e){}
}
